<script>
/* ===================== NÚCLEO: render, materiales, geometría ===================== */
var T=THREE,V=V3,$=function(i){return document.getElementById(i)};
function clamp(x,a,b){return x<a?a:x>b?b:x}function lerp(a,b,t){return a+(b-a)*t}function R(a,b){return a+Math.random()*(b-a)}
function sgn(x){return x<0?-1:1}function angDiff(a,b){var d=b-a;while(d>Math.PI)d-=6.283185;while(d<-Math.PI)d+=6.283185;return d}
V.init({fov:62,far:900,exposure:1.0,shadows:true,pr:V.touch?1.15:1.6,near:.1});
var scene=V.scene,cam=V.cam,rd=V.r;
rd.outputColorSpace=T.SRGBColorSpace;
var N=V.noise;
function px(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),im=x.createImageData(w,h),d=im.data;for(var j=0;j<h;j++)for(var i=0;i<w;i++){var q=fn(i,j),o=(j*w+i)*4;d[o]=q[0];d[o+1]=q[1];d[o+2]=q[2];d[o+3]=255}x.putImageData(im,0,0);return c}
function mkTex(c){var t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=2;return t}
function hash(x,y){var h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)}
/* ---- texturas procedurales ---- */
var TXG={
 concrete:function(){return px(256,256,function(x,y){var n=N(x*.06,y*.06)*30+N(x*.5,y*.5)*18+Math.random()*10;var j=(x%128<1.5||y%128<1.5)?-26:0;var s=N(x*.02+9,y*.02)>.78?-14:0;return[168+n+j+s,168+n+j+s,164+n+j+s]})},
 brick:function(){return px(256,256,function(x,y){var row=Math.floor(y/32),xx=(x+(row%2)*32)%64,yy=y%32;var m=(yy<3||xx<3);var n=N(x*.1+row*3,y*.1)*34+Math.random()*12;var v=hash(Math.floor((x+(row%2)*32)/64),row)*30;return m?[196+n*.3,188+n*.3,176+n*.3]:[150+n+v,72+n*.5+v*.4,52+n*.4+v*.3]})},
 plaster:function(){return px(256,256,function(x,y){var n=N(x*.04,y*.04)*14+N(x*.4,y*.4)*8+Math.random()*5;return[232+n,224+n,208+n]})},
 wood:function(){return px(256,256,function(x,y){var p=Math.floor(y/32),yy=y%32;var n=N(x*.015+p*7,yy*.25+p)*34+N(x*.12,y*.05)*14;var j=(yy<1.5)?-42:0;var o=(p*53)%36-14;return[170+n+o+j,110+n*.7+o*.6+j,64+n*.5+o*.3+j]})},
 woodD:function(){return px(256,256,function(x,y){var p=Math.floor(x/42),xx=x%42;var n=N(xx*.25+p,y*.012+p*5)*30+N(x*.05,y*.12)*12;var j=(xx<1.5)?-40:0;return[96+n+j,62+n*.7+j,38+n*.5+j]})},
 metal:function(){return px(256,256,function(x,y){var w=Math.sin(x/256*6.283*8)*18;var n=Math.random()*10+N(x*.05,y*.05)*16;return[138+w+n,142+w+n,150+w+n]})},
 asphalt:function(){return px(256,256,function(x,y){var n=Math.random()*34+N(x*.04,y*.04)*20;return[60+n,60+n,64+n]})},
 grass:function(){return px(256,256,function(x,y){var n=N(x*.1,y*.1)*44+N(x*.7,y*.7)*26+Math.random()*10;return[64+n*.5,126+n,46+n*.3]})},
 stone:function(){return px(256,256,function(x,y){var tx=Math.floor(x/64),ty=Math.floor(y/64);var m=(x%64<2||y%64<2);var n=N(x*.03,y*.03)*24+hash(tx,ty)*22+Math.random()*6;var v=Math.abs(Math.sin((x+y*.6)*.05+N(x*.02,y*.02)*6))<.06?-22:0;return m?[170,168,160]:[210+n+v,208+n+v,200+n+v]})},
 facade:function(){return px(256,256,function(x,y){var u=x/256,v=y/256;var wx=u>.12&&u<.88&&v>.14&&v<.86;var n=Math.random()*8+N(x*.04,y*.04)*14;if(!wx)return[188+n,184+n,176+n];var fr=(u<.15||u>.85||v<.17||v>.83);if(fr)return[236,236,238];var g=v*.8;var lit=hash(Math.floor(x/128)+3,Math.floor(y/128))>.82;var b=lit?[255,220,150]:[70+g*60+n,104+g*70+n,140+g*70+n];var rf=Math.max(0,.5-Math.abs(u-.3-v*.5))*40;return[b[0]+rf,b[1]+rf,b[2]+rf]})},
 roof:function(){return px(256,256,function(x,y){var n=Math.random()*50+N(x*.06,y*.06)*20;return[112+n*.7,108+n*.7,104+n*.7]})},
 fabric:function(){return px(128,128,function(x,y){var w=((x%4<2)^(y%4<2))?10:0;var n=Math.random()*14+N(x*.05,y*.05)*16;return[190+n+w,190+n+w,190+n+w]})},
 carpet:function(){return px(128,128,function(x,y){var n=Math.random()*26;return[200+n,200+n,200+n]})},
 tile:function(){return px(256,256,function(x,y){var m=(x%64<2||y%64<2);var n=N(x*.05,y*.05)*10+Math.random()*4;return m?[150,152,152]:[222+n,224+n,226+n]})},
 paper:function(){return px(64,64,function(x,y){var n=Math.random()*10;return[240+n,236+n,226+n]})},
 trim:function(){return px(64,64,function(x,y){var n=Math.random()*6;return[236+n,234+n,228+n]})}
};
/* material: textura, metros por baldosa, rugosidad */
var MD={concrete:['concrete',4,.95],brick:['brick',2.2,.9],plaster:['plaster',3,.95],wood:['wood',3,.7],woodD:['woodD',3,.65],metal:['metal',2,.45,.7],asphalt:['asphalt',6,.95],grass:['grass',3.5,1],stone:['stone',4,.8],facade:['facade',3,.5],roof:['roof',3,1],fabric:['fabric',1.6,1],carpet:['carpet',1.2,1],tile:['tile',2.5,.35],paper:['paper',2,.9],trim:['trim',2,.6],plain:[null,1,.7]};
var MATS={},TEXS={};
function getMat(k){if(MATS[k])return MATS[k];var d=MD[k]||MD.plain;var o={vertexColors:true,roughness:d[2],metalness:d[3]||0};if(d[0]){if(!TEXS[d[0]])TEXS[d[0]]=mkTex(TXG[d[0]]());o.map=TEXS[d[0]];if(!V.touch&&['concrete','brick','stone','wood','woodD','asphalt','roof','plaster','fabric','carpet'].indexOf(k)>=0){o.bumpMap=TEXS[d[0]];o.bumpScale=(k==='brick'||k==='stone')?2.2:1.2}}if(k==='glass'){o.transparent=true;o.opacity=.28;o.depthWrite=false}MATS[k]=new T.MeshStandardMaterial(o);return MATS[k]}
MATS.glass=new T.MeshStandardMaterial({vertexColors:true,color:0xffffff,transparent:true,opacity:.3,roughness:.05,metalness:.3,depthWrite:false});
function boxGeo(w,h,d,ts){var g=new T.BoxGeometry(w,h,d),uv=g.attributes.uv,ox=Math.random(),oy=Math.random();
 var f=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(var i=0;i<6;i++)for(var j=0;j<4;j++){var k=i*4+j;uv.setXY(k,uv.getX(k)*f[i][0]/ts+ox,uv.getY(k)*f[i][1]/ts+oy)}return g}
/* ---- lotes ---- */
var BATCH={},DYN=[],SOL=[],DECOROOT=null,worldGroup=new T.Group();scene.add(worldGroup);
function pushItem(mat,item){(BATCH[mat]=BATCH[mat]||[]).push(item)}
function solid(x0,y0,z0,x1,y1,z1,o){var s={x0:x0,y0:y0,z0:z0,x1:x1,y1:y1,z1:z1,o:o||{}};SOL.push(s);return s}
/* caja: centro x/z, y inferior. o:{nosolid,glass} */
function B(cx,y,cz,w,h,d,mat,col,o){o=o||{};mat=mat||'concrete';var d0=MD[mat]||MD.plain;var g=boxGeo(w,h,d,d0[1]);pushItem(mat,[g,V.MX(cx,y+h/2,cz),col==null?0xffffff:col]);if(o.nosolid)return null;o.mat=mat;return solid(cx-w/2,y,cz-d/2,cx+w/2,y+h,cz+d/2,o)}
function BX(x0,y0,z0,x1,y1,z1,mat,col,o){return B((x0+x1)/2,y0,(z0+z1)/2,x1-x0,y1-y0,z1-z0,mat,col,o)}
function Cyl(cx,y,cz,r,h,mat,col,o){o=o||{};var g=new T.CylinderGeometry(r,r,h,o.seg||14);var uv=g.attributes.uv;var ts=(MD[mat||'metal']||MD.plain)[1];for(var i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*6.283*r/ts,uv.getY(i)*h/ts);pushItem(mat||'metal',[g,V.MX(cx,y+h/2,cz),col==null?0xffffff:col]);if(o.solid){return solid(cx-r*.85,y,cz-r*.85,cx+r*.85,y+h,cz+r*.85,o)}return null}
function Deco(geo,mat,col,x,y,z,rx,ry,rz,sx,sy,sz){pushItem(mat||'plain',[geo,V.MX(x,y,z,rx,ry,rz,sx,sy,sz),col==null?0xffffff:col])}
function Sph(x,y,z,r,mat,col,sx,sy,sz){Deco(new T.SphereGeometry(r,12,9),mat||'plain',col,x,y,z,0,0,0,sx,sy,sz)}
function Rot(cx,cy,cz,w,h,d,rx,ry,rz,mat,col){var g=boxGeo(w,h,d,(MD[mat]||MD.plain)[1]);pushItem(mat||'plain',[g,V.MX(cx,cy,cz,rx,ry,rz),col==null?0xffffff:col])}
/* plataforma móvil: caja con movimiento */
function Mover(cx,y,cz,w,h,d,mat,col,fn){var g=boxGeo(w,h,d,(MD[mat]||MD.plain)[1]);var cols=new Float32Array(g.attributes.position.count*3),c=new T.Color(col==null?0xffffff:col);for(var i=0;i<g.attributes.position.count;i++){cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b}g.setAttribute('color',new T.BufferAttribute(cols,3));
 var m=new T.Mesh(g,getMat(mat));m.castShadow=m.receiveShadow=true;worldGroup.add(m);var s=solid(cx-w/2,y,cz-d/2,cx+w/2,y+h,cz+d/2,{mover:true});var o={m:m,s:s,x:cx,y:y+h/2,z:cz,w:w,h:h,d:d,fn:fn,dx:0,dy:0,dz:0,px:0,py:0,pz:0};DYN.push(o);m.position.set(cx,y+h/2,cz);return o}
function updMovers(t){for(var i=0;i<DYN.length;i++){var o=DYN[i],p=o.fn(t);var nx=o.x+p[0],ny=o.y+p[1],nz=o.z+p[2];o.dx=nx-o.m.position.x;o.dy=ny-o.m.position.y;o.dz=nz-o.m.position.z;o.m.position.set(nx,ny,nz);var s=o.s;s.x0=nx-o.w/2;s.x1=nx+o.w/2;s.y0=ny-o.h/2;s.y1=ny+o.h/2;s.z0=nz-o.d/2;s.z1=nz+o.d/2;s.dx=o.dx;s.dy=o.dy;s.dz=o.dz}}
function finalize(){var CELL=64;Object.keys(BATCH).forEach(function(k){var cells={};BATCH[k].forEach(function(it){var e=it[1].elements,key=Math.floor(e[12]/CELL)+','+Math.floor(e[13]/CELL)+','+Math.floor(e[14]/CELL);(cells[key]=cells[key]||[]).push(it)});
  Object.keys(cells).forEach(function(c2){var geo=V.merge(cells[c2]);geo.computeBoundingSphere();var m=new T.Mesh(geo,k==='glass'?MATS.glass:getMat(k));m.castShadow=k!=='glass';m.receiveShadow=true;worldGroup.add(m)})});BATCH={}}
/* ---- cielo, luces ---- */
var sky=new T.Mesh(new T.SphereGeometry(700,24,14),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{top:{value:new T.Color(0x4a8ee0)},hor:{value:new T.Color(0xcfe4f6)},low:{value:new T.Color(0xb8c8d8)},sun:{value:new T.Vector3(.4,.6,.3)},sunc:{value:new T.Color(0xfff2d0)}},
 vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top,hor,low,sun,sunc;varying vec3 v;void main(){float h=v.y;vec3 c=h>0.?mix(hor,top,pow(clamp(h,0.,1.),.55)):mix(hor,low,clamp(-h*3.,0.,1.));float s=max(0.,dot(normalize(v),normalize(sun)));c+=sunc*(pow(s,600.)*3.+pow(s,10.)*.25);gl_FragColor=vec4(c,1.);}'}));
scene.add(sky);

 $('pC').onclick=function(){m.style.display='none';PAUSED=false};$('pR').onclick=function(){m.style.display='none';restart()};$('pK').onclick=function(){m.style.display='none';PAUSED=false;respawn()};$('pH').onclick=showHelp;$('pM').onclick=function(){m.style.display='none';showMenu()}};
document.addEventListener('visibilitychange',function(){if(document.hidden&&!PAUSED&&MAP&&$('menu').style.display!=='flex')$('pauseB').onclick()});
</script>
<script>
(function(){var q=location.search.match(/map=(\d+)/);if(q&&MAPS[+q[1]]){loadMap(+q[1])}else{PAUSED=true;showMenu()}
 /* depuración */
 window.__dbg={animate:animate,POSE:POSE,tick:gameTick,P:P,CH:CH,CAM:CAM,IN:IN,press:press,loadMap:loadMap,stepPlayer:stepPlayer,SOL:SOL,MAPS:MAPS}})();
</script>
<script>
window.__validate=function(){
 var S=SOL.filter(function(s){return s.x1-s.x0>.45&&s.z1-s.z0>.45&&s.y1-s.y0>.05});
 function under(x,z,y){var best=null;S.forEach(function(s){if(x>=s.x0-.3&&x<=s.x1+.3&&z>=s.z0-.3&&z<=s.z1+.3&&s.y1<=y+.8){if(!best||s.y1>best.y1)best=s}});return best}
 function gap(a,b){var dx=Math.max(0,a.x0-b.x1,b.x0-a.x1),dz=Math.max(0,a.z0-b.z1,b.z0-a.z1);return Math.hypot(dx,dz)}
 function can(a,b){var g=gap(a,b),dy=b.y1-a.y1,tol=(a.o.mover?2.4:0)+(b.o.mover?2.4:0),dt=(a.o.mover||b.o.mover)?3:0;dy-=dt*(dy>0?1:0);
  if(dy<=.55)return g<=((dy<-.5)?4.6:4.2)+tol;if(dy<=1.4)return g<=4.0+tol;if(dy<=2.2)return g<=3.6+tol;if(dy<=3.0)return g<=2.7+tol;if(dy<=3.4)return g<=1.4+tol;if(dy<=5.2)return g<=.9+tol;return false}
 var LK=(MAP.links||[]).map(function(l){return[under(l[0],l[1],l[2]),under(l[3],l[4],l[5])]});
 var s0=under(MAP.start.x,MAP.start.z,MAP.start.y),g0=MAP.goal?under(MAP.goal.x,MAP.goal.z,MAP.goal.y):null;
 var seen=new Set([s0]),q=[s0];while(q.length){var a=q.pop();for(var i=0;i<S.length;i++){var b=S[i];if(seen.has(b))continue;if(can(a,b)){seen.add(b);q.push(b)}}LK.forEach(function(l){if(l[0]===a&&l[1]&&!seen.has(l[1])){seen.add(l[1]);q.push(l[1])}})}
 var out={nodes:S.length,reached:seen.size,goal:g0?seen.has(g0):null,start:!!s0};
 /* plataformas que parecen ruta y no se alcanzan (altura>0) */
 out.miss=S.filter(function(s){return!seen.has(s)&&s.y1>.5&&!s.o.nosolid}).slice(0,25).map(function(s){return[Math.round(s.x0),Math.round(s.x1),+s.y1.toFixed(1),Math.round(s.z0),Math.round(s.z1)].join(',')});
 return out};
</script>
