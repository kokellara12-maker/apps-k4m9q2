var S={};(function(){var P=GK.px;

  // cabeza

  P.r(x,17,7,2,2,'#fff');P.r(x,21,7,2,2,'#fff');P.p(x,18,8,'#1a1a1a');P.p(x,22,8,'#1a1a1a');P.p(x,21,10,'#ff7a9a');P.r(x,19,10,1,1,D);

GK.S=S;
GK.start({px:3,title:'Gato Ninja Tejados',icon:'🐱',color:'#ffb347',bg:'#150a2e',help:'Toca para saltar. Mantén pulsado en el aire para <b>planear</b>. Esquiva chimeneas y palomas, recoge pescados 🐟',
reset:function(){fc=0;speed=260;dist=0;roofs=[];birds=[];fish=[];hold=false;t=0;var p={x:-50,w:0,y:GK.H()*.68};var r=nr({x:-50,w:0,y:GK.H()*.68},true);r.x=-50;roofs.push(r);for(var i=0;i<6;i++)roofs.push(nr(roofs[roofs.length-1]));cat={x:GK.W()*.25,y:r.y,vy:0,on:true,co:0,tail:0}},

up:function(){hold=false},
update:function(dt){t+=dt;speed=Math.min(560,260+dist*.012);var dx=speed*dt;dist+=dx;

 while(roofs[0].x+roofs[0].w<-50)roofs.shift();while(roofs[roofs.length-1].x<GK.W()+400)roofs.push(nr(roofs[roofs.length-1]));

 var g=1800;if(hold&&cat.vy<0)g=900;if(hold&&cat.vy>0){g=500;cat.vy=Math.min(cat.vy,150)}
 cat.vy+=g*dt;var oy=cat.y;cat.y+=cat.vy*dt;var on=false;
 for(var r of roofs){if(cat.x>r.x+6&&cat.x<r.x+r.w-6&&oy<=r.y+4&&cat.y>=r.y){cat.y=r.y;cat.vy=0;on=true}}
 if(on){if(!cat.on)GK.burst(cat.x,cat.y,5,'#ddd',90,.3)}else if(cat.on){cat.co=.1}cat.on=on;if(cat.co>0)cat.co-=dt;

 var cx0=cat.x-12,cx1=cat.x+12,cy0=cat.y-30,cy1=cat.y;
 for(var r of roofs)for(var c of r.ch){if(cx1>c.x&&cx0<c.x+c.w&&cy1>r.y-c.h&&cy0<r.y){GK.shake(10);GK.over('¡Chimenea!')}}
 for(var b of birds)if(GK.dist(cat.x,cat.y-15,b.x,b.y)<24){GK.shake(10);GK.over('¡Paloma!')}
 for(var f of fish)if(!f.g&&GK.dist(cat.x,cat.y-15,f.x,f.y)<26){f.g=1;fc++;GK.float(f.x,f.y,'+5','#7df');GK.beep(900,.08,'triangle',.08,400)}
 if(cat.y>GK.H()+60)GK.over('¡Te caíste!');GK.setScore(Math.floor(dist/40)+fc*5);},
draw:function(c,W,H){GK.sky(c,W,H,['#0b0522','#2a1252','#7a3a7a','#f0906a'],0,H);GK.stars(c,W,H,t||0,55,H*.5);
 GK.glow(c,W*.8,H*.18,140,'#ffe9a0',.5);c.fillStyle='#fff6d0';c.beginPath();c.arc(W*.8,H*.18,32,0,7);c.fill();c.fillStyle='rgba(200,190,150,.5)';c.beginPath();c.arc(W*.8-8,H*.18-6,8,0,7);c.arc(W*.8+10,H*.18+8,5,0,7);c.fill();
 var d0=dist||0;[[.1,'#3a2060',90,70,'rgba(255,200,120,.35)'],[.22,'#24103e',60,60,'rgba(255,220,120,.55)']].forEach(function(L){var off=d0*L[0];for(var i=-1;i<W/60+2;i++){var gi=Math.floor(off/60)+i,bh=L[2]+((((gi*37+11)%L[3])+L[3])%L[3]),bx=i*60-(off%60);c.fillStyle=L[1];c.fillRect(bx,H*.8-bh,52,bh+H);c.fillStyle=L[4];for(var wy=H*.8-bh+10;wy<H*.8-6;wy+=18)for(var wx=bx+8;wx<bx+46;wx+=14)if((((gi*7+Math.floor(wx*3+wy))%7)+7)%7===0)c.fillRect(wx,wy,5,7)}});
 if(speed>400){c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=2;for(var i=0;i<8;i++){var ly=(i*97+t*300)%H;c.beginPath();c.moveTo(W,ly);c.lineTo(W-90-(i%3)*40,ly);c.stroke()}}

 for(var r of roofs){GK.tileFill(c,S.brick,r.x,r.y+12,r.w,H-r.y,1);var wi=0;for(var wx=r.x+18;wx<r.x+r.w-26;wx+=42)for(var wy=r.y+34;wy<H;wy+=48){var lit=(((wx*7+wy*3)|0)%5>1);GK.spr(c,lit?S.win:S.winD,wx,wy,{ox:0,oy:0,s:1.4})}

  for(var ch of r.ch)GK.spr(c,S.chim,ch.x+ch.w/2,r.y+2,{s:1.35})}

 for(var b of birds){GK.shadow(c,b.x,b.y+28,10,3,.15);GK.spr(c,S.bird[Math.floor(t*10)%2],b.x,b.y+6,{oy:.5,f:1,s:1.3})}
 if(cat){var fr=!cat.on?(cat.vy>0&&hold?3:2):Math.floor(t*12)%2;GK.shadow(c,cat.x,cat.y+2,18,4,.25);GK.spr(c,S.cat[fr],cat.x,cat.y+4,{s:1.5});if(hold&&!cat.on&&cat.vy>0){c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(cat.x,cat.y-60,26,6,0,0,7);c.fill()}}}});
