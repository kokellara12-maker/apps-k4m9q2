<script>

function ramp_y(r,x,z){if(x<r.x0-.05||x>r.x1+.05)return null;var t=(z-r.za)/(r.zb-r.za);if(t<-.02||t>1.02)return null;t=clamp(t,0,1);return r.ya+(r.yb-r.ya)*t}
function spiral_y(s,x,z,fy){var dx=x-s.cx,dz=z-s.cz,r=Math.hypot(dx,dz);if(r<s.r0-.02||r>s.r1+.05)return null;var ang=Math.atan2(dz,dx);var best=null;var tot=s.a1-s.a0;var lo=Math.min(s.a0,s.a1),hi=Math.max(s.a0,s.a1);for(var k=-4;k<=4;k++){var a=ang+k*Math.PI*2;if(a<lo-.05||a>hi+.05)continue;var t=(a-s.a0)/tot;t=clamp(t,0,1);var y=s.ya+(s.yb-s.ya)*t;if(y<=fy+.55&&(best==null||y>best))best=y}return best}
function floorAt(x,z,fy){var best=-99;for(var i=0;i<FL.length;i++){var f=FL[i];if(x>=f.x0&&x<=f.x1&&z>=f.z0&&z<=f.z1&&f.y<=fy+.55&&f.y>best)best=f.y}
