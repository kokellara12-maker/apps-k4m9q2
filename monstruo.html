<!doctype html><html lang="es"><head><script src="mute.js"></script><script src="progress.js"></script><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script><script src="bgm.js" data-track="noche"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0c0a1c"><title>Monstruo bajo la Cama</title></head><body><script src="gk.js"></script><script>
(function(){
var me,kid,par,scare,t,wake,zone,night,sw,walls,fear,lamp;
function setup(){var W=GK.W(),H=GK.H();kid={x:W*.5,y:H*.38,w:90,h:130};me={x:W*.15,y:H*.78};par={x:W*.5,y:H*.12,a:Math.PI/2,s:0,dir:1,pt:0,cone:.5,len:260};scare=0;wake=0;zone=0;fear=0;sw=GK.rnd(0,6);walls=[{x:0,y:H*.2,w:W*.22,h:20},{x:W*.78,y:H*.55,w:W*.22,h:20}]}
function cone(p,x,y){var dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy);if(d>p.len)return false;var a=Math.atan2(dy,dx),da=Math.abs(((a-p.a+Math.PI*3)%(Math.PI*2))-Math.PI);return da<p.cone*.5+0}

GK.start({title:'Monstruo bajo la Cama',icon:'👾',color:'#c070ff',bg:'#0c0a1c',help:'Arrastra para moverte. Quédate <b>quieto cerca de la cama</b> para asustar al niño 👶. Si la linterna de papá/mamá te ilumina, ¡escóndete bajo la cama! (toca la cama)',
reset:function(){night=1;setup();t=0;this.hid=0},
down:function(x,y){var W=GK.W(),H=GK.H();this.tx=x;this.ty=y;this.dn=performance.now()},move:function(x,y){if(GK.ptr.down){this.tx=x;this.ty=y}},up:function(){this.tx=null},
update:function(dt){var W=GK.W(),H=GK.H();t+=dt;
 if(this.tx!=null){var dx=this.tx-me.x,dy=this.ty-me.y,d=Math.hypot(dx,dy);if(d>8){me.moving=1;me.x+=dx/d*200*dt;me.y+=dy/d*200*dt}else me.moving=0}else me.moving=0;
 me.x=GK.clamp(me.x,16,W-16);me.y=GK.clamp(me.y,100,H-30);
 var under=me.x>kid.x-kid.w/2-6&&me.x<kid.x+kid.w/2+6&&me.y>kid.y+kid.h*.2&&me.y<kid.y+kid.h+20;this.hid=under&&!me.moving?1:0;
 var near=GK.dist(me.x,me.y,kid.x,kid.y+kid.h/2)<kid.w*.9;
 if(near&&!me.moving){scare+=dt*(34+night*3);if(Math.random()<dt*6)GK.burst(kid.x,kid.y,1,'#c8f',60,.5)}else scare=Math.max(0,scare-dt*10);
 if(scare>=100){GK.add(50+night*10);GK.float(kid.x,kid.y-20,'¡BUUU! +'+(50+night*10),'#d9a0ff',26);GK.beep(120,.5,'sawtooth',.12,-60);GK.shake(8);night++;scare=0;par.len=Math.min(340,260+night*8);par.cone=Math.min(.9,.5+night*.03);GK.burst(kid.x,kid.y,30,'#c8f',260)}
 par.pt+=dt;var sp=.7+night*.12;par.a+=par.dir*sp*dt*.7;if(par.a>Math.PI*.95){par.dir=-1}if(par.a<Math.PI*.05){par.dir=1}par.x=W*.5+Math.sin(t*.35+sw)*W*.3;
 if(!this.hid&&inCone(par,me.x,me.y)){fear+=dt*1.6;if(fear>=1){GK.shake(14);GK.over('¡Te vieron!')}}else fear=Math.max(0,fear-dt*.8);
 GK.setScore(GK.score()+0)},
draw:function(c,W,H){c.fillStyle='#16102e';c.fillRect(0,0,W,H);c.fillStyle='#2a1f48';c.fillRect(0,H*.88,W,H);if(!kid)return;
 c.fillStyle='#2c2250';for(var x=0;x<W;x+=70)c.fillRect(x,0,3,H*.12);
 var kb=c.createLinearGradient(0,0,0,1);c.fillStyle='#4a7a9a';c.fillRect(kid.x-kid.w/2,kid.y,kid.w,kid.h);c.fillStyle='#3a5a7a';c.fillRect(kid.x-kid.w/2,kid.y+kid.h*.45,kid.w,kid.h*.55);c.fillStyle='#fff';c.fillRect(kid.x-kid.w/2+8,kid.y+6,kid.w-16,24);c.font='30px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(scare>40?'😨':'😴',kid.x,kid.y+18);
 c.fillStyle='#1a1230';c.fillRect(kid.x-kid.w/2,kid.y+kid.h,kid.w,14);
 if(me.x>kid.x-kid.w/2&&me.x<kid.x+kid.w/2&&me.y>kid.y+kid.h*.2){c.fillStyle='rgba(192,112,255,.2)';c.fillRect(kid.x-kid.w/2,kid.y,kid.w,kid.h)}
 GK.rr(kid.x-50,kid.y-24,100,10,5,'#222');GK.rr(kid.x-50,kid.y-24,100*scare/100,10,5,'#c070ff');GK.text('MIEDO',kid.x,kid.y-36,12,'#d9a0ff');
 for(var w of walls){c.fillStyle='#3a2c5a';c.fillRect(w.x,w.y,w.w,w.h)}
 var g=c.createRadialGradient(par.x,par.y,10,par.x,par.y,par.len);g.addColorStop(0,'rgba(255,240,150,.55)');g.addColorStop(1,'rgba(255,240,150,.02)');c.fillStyle=g;c.beginPath();c.moveTo(par.x,par.y);c.arc(par.x,par.y,par.len,par.a-par.cone/2,par.a+par.cone/2);c.closePath();c.fill();
 c.font='34px serif';c.fillText('🧑',par.x,par.y);c.fillText('🔦',par.x+Math.cos(par.a)*20,par.y+Math.sin(par.a)*20);
 if(!this.hid){c.font='34px serif';c.fillStyle='#fff';c.globalAlpha=1;c.fillText('👾',me.x,me.y)}else{c.globalAlpha=.4;c.font='34px serif';c.fillText('👾',me.x,me.y);c.globalAlpha=1;GK.text('escondido',me.x,me.y-26,12,'#c9a0ff')}
 if(fear>0){c.fillStyle='rgba(255,60,60,'+fear*.35+')';c.fillRect(0,0,W,H)}
 GK.text('Noche '+night,W/2,H-30,18,'#c9a0ff')}});
})();
