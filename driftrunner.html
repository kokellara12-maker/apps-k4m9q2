html,body{margin:0;height:100%;overflow:hidden;background:#0a0620;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;--sa:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color:#fff;font-weight:900;font-style:italic}
#stage{position:absolute;inset:0;background:#0a0620}
#hud{position:absolute;inset:0;pointer-events:none}
#hud *{box-sizing:border-box}
.chip{position:absolute;background:rgba(10,8,40,.55);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:5px 12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#sc{left:calc(12px + var(--sa));top:calc(10px + var(--st));font-size:30px;line-height:1.05;min-width:120px}
#sc small{display:block;font-size:13px;opacity:.85}
#mult{left:calc(12px + var(--sa));top:calc(78px + var(--st));font-size:20px;color:#ffe14d;display:none}
#mbar{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:3px;overflow:hidden}#mbar i{display:block;height:100%;width:0;background:#ffe14d}
#hearts{left:50%;transform:translateX(-50%);top:calc(10px + var(--st));font-size:22px;white-space:nowrap}
#biome{left:50%;transform:translateX(-50%);top:calc(54px + var(--st));font-size:12px;opacity:0;transition:opacity .5s;white-space:nowrap}
.rb{position:absolute;pointer-events:auto;width:46px;height:46px;border-radius:50%;background:rgba(10,8,40,.55);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:20px;font-style:normal;touch-action:manipulation}
#bPause{right:calc(12px + var(--sr));top:calc(10px + var(--st))}#bMute{right:calc(68px + var(--sr));top:calc(10px + var(--st))}
#nit{position:absolute;left:50%;bottom:calc(138px + var(--sb));transform:translateX(-50%);width:70px;height:70px;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:34px;font-style:normal;background:rgba(10,8,40,.55);border:3px solid rgba(255,255,255,.3);touch-action:none}
#nit.rdy{border-color:#ffb02a;box-shadow:0 0 22px #ff8a1a;background:rgba(255,120,20,.55);animation:pl .5s infinite alternate}
@keyframes pl{to{transform:translateX(-50%) scale(1.08)}}
#nitb{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#ffb02a var(--p,0%),transparent 0);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
#pu{left:calc(12px + var(--sa));top:calc(112px + var(--st));font-size:15px;display:none;font-style:normal}
