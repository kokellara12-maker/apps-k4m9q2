:root{--f:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:var(--f);overflow:hidden;overscroll-behavior:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;gap:10px;align-items:flex-start;z-index:5;pointer-events:none}
.back{pointer-events:auto;text-decoration:none;color:#fff;background:rgba(10,14,34,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;white-space:nowrap}
#info{flex:1;min-width:0;background:rgba(10,14,34,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:9px 12px;margin-right:56px}
#ttl{font-weight:900;font-size:17px;letter-spacing:.02em}
#sc{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7fd4ff;margin-top:1px}
#fact{font-size:12.5px;line-height:1.35;color:rgba(255,255,255,.78);margin-top:5px}
#lad{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 74px);bottom:150px;width:46px;z-index:6;touch-action:none}
#lad .rail{position:absolute;left:21px;top:0;bottom:0;width:4px;border-radius:2px;background:linear-gradient(180deg,#b05cff,#35e0ff 40%,#ffd27a 70%,#ff7a4a);opacity:.5}
#lad button{position:absolute;left:3px;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,14,34,.7);color:#fff;font-size:20px;padding:0;display:flex;align-items:center;justify-content:center}
#lad button.on{border-color:#7fd4ff;box-shadow:0 0 12px #35e0ff;background:rgba(30,60,110,.8)}
#thumb{position:absolute;left:0;width:46px;height:4px;margin-top:-2px;border-radius:2px;background:#fff;box-shadow:0 0 10px #fff,0 0 20px #7fd4ff;pointer-events:none}

#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(255,255,255,.2);background:rgba(10,14,34,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;font-size:14px;font-family:var(--f);white-space:nowrap}
.chip.on{background:linear-gradient(180deg,#3c7bff,#2a4fd0);border-color:#9fc2ff;box-shadow:0 0 14px rgba(80,140,255,.6)}
