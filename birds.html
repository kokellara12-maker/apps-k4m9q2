SP.cloud=[28,38,24].map(function(w){return GK.mkd(w*3,w*1.4,function(x){var W=w*3,H=w*1.4;P.e(x,W*.3,H*.62,W*.24,H*.3,'#fff');P.e(x,W*.52,H*.46,W*.26,H*.38,'#fff');P.e(x,W*.74,H*.62,W*.22,H*.3,'#fff');P.r(x,W*.15,H*.62,W*.7,H*.3,'#fff');P.e(x,W*.5,H*.88,W*.4,H*.1,'#cfe6f8');P.e(x,W*.42,H*.34,W*.1,H*.12,'#f4fbff')},{out:false,sh:false})});

/* ---------- dibujo ---------- */
function S(x,y){return [ Math.round((x-cam)*ppm), Math.round(groundScreen()-y*ppm) ]}
function drawBlock(c,u,w,h,x,y,ang){c.save();c.translate(x,y);c.rotate(ang);var pw=Math.round(w*ppm),ph=Math.round(h*ppm);c.beginPath();c.rect(-pw/2,-ph/2,pw,ph);c.clip();var t=SP[u.m];if(u.m==='glass')c.globalAlpha=.62;for(var yy=-ph/2;yy<ph/2;yy+=16)for(var xx=-pw/2;xx<pw/2;xx+=16)c.drawImage(t,Math.round(xx),Math.round(yy));c.globalAlpha=1;
 c.fillStyle='rgba(255,255,255,.28)';c.fillRect(-pw/2,-ph/2,pw,2);c.fillRect(-pw/2,-ph/2,2,ph);c.fillStyle='rgba(0,0,0,.35)';c.fillRect(-pw/2,ph/2-2,pw,2);c.fillRect(pw/2-2,-ph/2,2,ph);
 var hr=u.hp/u.mx;if(hr<.65){c.strokeStyle='rgba(20,8,0,.8)';c.lineWidth=2;c.beginPath();c.moveTo(-pw*.3,-ph/2);c.lineTo(-pw*.15,0);c.lineTo(-pw*.28,ph/2);if(hr<.35){c.moveTo(pw*.25,-ph/2);c.lineTo(pw*.12,-ph*.1);c.lineTo(pw*.3,ph/2)}c.stroke()}
 c.restore()}
function birdSp(t){return t==='yellow'?SP.yellow:t==='blue'?SP.blue:t==='black'?SP.black:SP.red}
function draw(c,W,H){ppm=H/13;var gs=groundScreen();
 var bands=['#58b4f0','#68c0f4','#7accf6','#92d8f8','#b0e4fb','#cdeefc'];for(var i=0;i<6;i++){c.fillStyle=bands[i];c.fillRect(0,i*gs/6,W,gs/6+1)}
 var T0=performance.now()/1000,cm=Math.round(cam*ppm);
 for(var n=0;n<7;n++){var nx=((n*300-cm*.15+T0*6)%(W+500)+W+500)%(W+500)-200;GK.spr(c,SP.cloud[n%3],nx,H*(.05+(n%3)*.14),{ox:0,oy:0})}
 for(var L=0;L<2;L++){var par=L?.4:.2,s2=L?1.2:1.6;for(var hx=-1;hx<W/330+2;hx++){var bx=hx*380-(cm*par)%380;GK.spr(c,SP.hill,bx,gs+2,{ox:0,oy:1,s:s2})}}
 if(!world)return;
 GK.tileFill(c,SP.grass,0,gs,W,H-gs,1);
 var sp=S(SL.x,SL.y),gp=S(SL.x,0);
 GK.spr(c,SP.sling,gp[0],gp[1]+2,{oy:1,s:1.3});
 if(cur&&!cur.flying&&state==='aim'){c.strokeStyle='#2e1606';c.lineWidth=5;c.lineCap='round';var bp=S(cur.x,cur.y);c.beginPath();c.moveTo(gp[0]-10,gp[1]-ppm*2.4);c.lineTo(bp[0],bp[1]);c.stroke();c.strokeStyle='#5a3410';c.lineWidth=3;c.stroke()}
 bodies.forEach(function(b){var u=b.getUserData(),p=b.getPosition(),s=S(p.x,p.y),a=-b.getAngle();if(s[0]<-200||s[0]>W+200)return;if(u.t==='block')drawBlock(c,u,u.w,u.h,s[0],s[1],a);else if(u.t==='pig'){GK.spr(c,u.helm?SP.pigH:SP.pig,s[0],s[1],{oy:.5,r:a,s:u.helm?1.1:1})}else if(u.t==='bird')GK.spr(c,birdSp(u.bt),s[0],s[1],{oy:.5,r:a})});
 if(drag&&cur){var dx=SL.x-cur.x,dy=SL.y-cur.y,vx=dx*9.2,vy=dy*9.2;c.fillStyle='rgba(255,255,255,.9)';for(var i=1;i<22;i++){var tt=i*.09,px=cur.x+vx*tt,py=cur.y+vy*tt-5*tt*tt;if(py<0)break;var q=S(px,py);var rs=Math.max(2,5-Math.floor(i/5));c.fillRect(q[0]-rs/2,q[1]-rs/2,rs,rs)}}
 if(cur&&!cur.flying){var bp2=S(cur.x,cur.y);GK.spr(c,birdSp(cur.t),bp2[0],bp2[1],{oy:.5})}
 if(cur&&!cur.flying&&state==='aim'){c.strokeStyle='#2e1606';c.lineWidth=5;c.lineCap='round';var bp3=S(cur.x,cur.y);c.beginPath();c.moveTo(gp[0]+10,gp[1]-ppm*2.4);c.lineTo(bp3[0],bp3[1]);c.stroke();c.strokeStyle='#8a5a28';c.lineWidth=3;c.stroke()}
 parts.forEach(function(q){var s=S(q.x,q.y);c.globalAlpha=Math.max(0,q.t*1.5);c.fillStyle=q.c;var d=Math.max(3,Math.round(q.s*ppm));c.fillRect(s[0],s[1],d,d)});c.globalAlpha=1;
 pops.forEach(function(q){var s=S(q.x,q.y);c.globalAlpha=Math.min(1,q.t*1.6);GK.text(''+q.v,s[0],s[1],Math.min(22,10+q.v/500),'#fff');c.globalAlpha=1});
 var qs=birdQ.slice();qs.forEach(function(t,i){var s=S(SL.x-1.6-i*1.05,.05);GK.spr(c,birdSp(t),s[0],s[1],{oy:1})});
 GK.text('NIVEL '+(lvl+1),W/2,26,16,'#fff');GK.text('Cerdos: '+pigsLeft,W/2,48,13,'#b8f08a');
 if(state==='aim'&&cur&&!drag&&birdQ.length===(LEVELS[lvl%LEVELS.length].b.length-1))GK.text('Arrastra el pájaro hacia atrás y suelta',W/2,H*.3,15,'#fff');
 if(state==='fly'&&!usedPower&&cur&&cur.t!=='red'&&stT>.25)GK.text('Toca la pantalla: poder del pájaro',W/2,H*.2,14,'#fff');
 if(msgT>0)GK.text(msg+(stars?'  '+'*'.repeat(stars):''),W/2,H*.4,32,'#ffd23a')}
GK.start({px:1,dither:false,title:'KOKE BIRDS',color:'#ff5a3a',bg:'#5ab8f0',help:'Lanza pájaros con la honda y destruye todos los cerdos. Arrastra hacia atrás y suelta. Toca la pantalla en el aire para activar el poder: el amarillo acelera, el azul se divide y el negro explota.',reset:reset,update:update,draw:draw,down:down,move:move,up:up});
