<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0a14">
<title>Calculadora</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0c0a14;
    --key: #1e1a2e;
    --key-fn: #3a3454;
    --key-op: #00c8d6;
    --key-eq: #ff2bd6;
    --ink: #f4f1ff;
    --dim: #8e86ad;
    --dark-ink: #07151a;
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .back {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: 12px;
    z-index: 2;
    padding: 6px 10px;
    border-radius: 999px;
    color: var(--dim);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
  .back:focus-visible { outline: 2px solid var(--key-op); }
  .app {
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-inline: 16px;
    padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .screen {
    flex: 0 0 26%;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    gap: 6px;
    padding-inline: 6px;
    min-width: 0;
  }
  #expr {
    min-height: 1.4em;
    color: var(--dim);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #out {
    max-width: 100%;
    line-height: 1;
    font-weight: 300;
    font-size: 84px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .pad {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 12px;
  }
  button {
    font: inherit;
    font-size: clamp(24px, 6.5vh, 34px);
    font-weight: 500;
    border: 0;
    border-radius: 999px;
    background: var(--key);
    color: var(--ink);
    padding: 0;
    min-height: 0;
    cursor: pointer;
    transition: filter 0.08s, transform 0.08s;
  }
  button:active { filter: brightness(1.35); transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--key-op); outline-offset: 2px; }
  .fn { background: var(--key-fn); }
  .op { background: var(--key-op); color: var(--dark-ink); font-weight: 700; }
  .op.on { background: var(--ink); }
  .eq { background: var(--key-eq); color: #1a0416; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<a class="back" href="index.html">‹ Apps</a>
<div class="app">
  <div class="screen">
    <div id="expr"></div>
    <div id="out">0</div>
  </div>
  <div class="pad" id="pad">
    <button class="fn" data-k="AC">AC</button>
    <button class="fn" data-k="BS" aria-label="Borrar">⌫</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/" aria-label="Dividir">÷</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiplicar">×</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Restar">−</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Sumar">+</button>

    <button data-k="SIGN" aria-label="Cambiar signo">±</button>
    <button data-k="0">0</button>
    <button data-k=".">,</button>
    <button class="eq" data-k="=">=</button>
  </div>
</div>

<script>
(function () {
  var SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  var MAX_DIGITS = 12;

  var cur = '0';        // número que se está escribiendo (texto con punto decimal)
  var prev = null;      // primer operando
  var op = null;        // operación pendiente
  var awaiting = false; // se acaba de pulsar una operación
  var replace = false;  // el siguiente dígito empieza un número nuevo
  var err = false;
  var expr = '';

  var out = document.getElementById('out');
  var exprEl = document.getElementById('expr');
  var pad = document.getElementById('pad');

  function numStr(n) {
    if (!isFinite(n)) return null;
    var r = parseFloat(n.toPrecision(12));
    var s = String(r);
    if (s.indexOf('e') !== -1) s = r.toExponential(6).replace(/\.?0+e/, 'e');
    return s;
  }

  function fmt(s) {
    if (s === 'Error') return s;
    var neg = s.charAt(0) === '-';
    if (neg) s = s.slice(1);
    var p = s.split('.');
    var i = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + i + (p.length > 1 ? ',' + p[1] : '');
  }

  function render() {
    var text = err ? 'Error' : fmt(cur);
    out.textContent = text;
    exprEl.textContent = expr;
    var w = out.parentNode.clientWidth - 12;
    var size = Math.max(30, Math.min(84, w / (Math.max(text.length, 5) * 0.6)));
    out.style.fontSize = size + 'px';
    var btns = pad.querySelectorAll('.op');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', awaiting && btns[i].getAttribute('data-k') === op);
    }
  }

  function fail() {
    err = true;
    cur = '0';
    prev = null;
    op = null;
    awaiting = false;
    replace = false;
    expr = '';
    render();
  }

  function clearAll() {
    cur = '0'; prev = null; op = null; awaiting = false; replace = false; err = false; expr = '';
    render();
  }

  function digitCount(s) { return s.replace(/[-.]/g, '').length; }

  function inputDigit(d) {
    if (err) clearAll();
    if (replace || awaiting) {
      if (replace && op === null) expr = '';
      cur = '0';
      replace = false;
      awaiting = false;
    }
    if (cur === '0') cur = d;
    else if (digitCount(cur) < MAX_DIGITS) cur += d;
    render();
  }

  function inputDot() {
    if (err) clearAll();
    if (replace || awaiting) {
      if (replace && op === null) expr = '';
      cur = '0';
      replace = false;
      awaiting = false;
    }
    if (cur.indexOf('.') === -1) cur += '.';
    render();
  }

  function operate(a, b, o) {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
    return b;
  }

  function setOp(o) {
    if (err) return;
    var v = Number(cur);
    if (op !== null && !awaiting) {
      var r = operate(prev, v, op);
      var s = numStr(r);
      if (s === null) { fail(); return; }
      prev = Number(s);
      cur = s;
    } else if (op === null) {
      prev = v;
    }
    op = o;
    awaiting = true;
    replace = false;
    expr = fmt(numStr(prev)) + ' ' + SYM[o];
    render();
  }

  function equals() {
    if (err || op === null) return;
    var v = Number(cur);
    var r = operate(prev, v, op);
    var s = numStr(r);
    if (s === null) { fail(); return; }
    expr = fmt(numStr(prev)) + ' ' + SYM[op] + ' ' + fmt(numStr(v)) + ' =';
    cur = s;
    prev = null;
    op = null;
    awaiting = false;
    replace = true;
    render();
  }

  function percent() {
    if (err) return;
    var v = Number(cur);
    var r = (op !== null && prev !== null) ? prev * v / 100 : v / 100;
    var s = numStr(r);
    if (s === null) { fail(); return; }
    cur = s;
    awaiting = false;
    replace = true;
    render();
  }

  function sign() {
    if (err || cur === '0') return;
    cur = cur.charAt(0) === '-' ? cur.slice(1) : '-' + cur;
    render();
  }

  function backspace() {
    if (err || replace || awaiting) return;
    if (cur.length <= 1 || (cur.length === 2 && cur.charAt(0) === '-')) cur = '0';
    else cur = cur.slice(0, -1);
    render();
  }

  function press(k) {
    if (k >= '0' && k <= '9' && k.length === 1) inputDigit(k);
    else if (k === '.') inputDot();
    else if (k === '+' || k === '-' || k === '*' || k === '/') setOp(k);
    else if (k === '=') equals();
    else if (k === 'AC') clearAll();
    else if (k === 'BS') backspace();
    else if (k === '%') percent();
    else if (k === 'SIGN') sign();
  }

  pad.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (b) press(b.getAttribute('data-k'));
  });

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k >= '0' && k <= '9') press(k);
    else if (k === '.' || k === ',') press('.');
    else if (k === '+' || k === '-' || k === '*' || k === '/') press(k);
    else if (k === 'x' || k === 'X') press('*');
    else if (k === 'Enter' || k === '=') { press('='); e.preventDefault(); }
    else if (k === 'Backspace') press('BS');
    else if (k === 'Escape' || k === 'c' || k === 'C') press('AC');
    else if (k === '%') press('%');
  });

  window.addEventListener('resize', render);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  render();
})();
</script>
</body>
</html>
