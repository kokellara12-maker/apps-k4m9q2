*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",-apple-system,system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0}canvas{display:block}
.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.pill{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.14)}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--card);border:1px solid rgba(255,255,255,.14);color:var(--ink);font-weight:800;padding:0}
.btn{font:inherit;font-weight:900;font-size:19px;color:#1a1530;background:var(--acc);border:0;border-radius:18px;padding:14px 30px;box-shadow:0 5px 0 rgba(0,0,0,.28);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}.btn.g{background:rgba(255,255,255,.16);color:var(--ink);box-shadow:none;font-size:16px;padding:11px 22px}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,5,15,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:18px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:24px 22px;text-align:center;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pp .25s ease-out}
.card h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:.5px}.card p{margin:0;font-size:15px;opacity:.88;line-height:1.35}
