<!doctype html>
<html lang="es">
<head><script src="bgm.js" data-track="accion"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f14">
<title>Carreras 3D</title>
<style>
:root{--acc:#ff4d3d;--ink:#fff;--dim:rgba(255,255,255,.62);--glass:rgba(16,18,24,.52);--line:rgba(255,255,255,.14);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0d0f14;color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(10,6,4,.42) 100%)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:20px}
#back{position:fixed;z-index:30;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 10px);padding:8px 14px;border-radius:999px;color:#fff;text-decoration:none;font-weight:600;font-size:15px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.btn{padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:600;font-size:16px}
.btn:active{filter:brightness(.8);transform:scale(.98)}
.btn.pri{background:var(--acc);font-size:19px;font-weight:700;padding:16px 18px;box-shadow:0 8px 24px rgba(255,77,61,.35)}
/* menú */
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:calc(env(safe-area-inset-top) + 56px) 16px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 52%,rgba(0,0,0,.65) 100%)}
.mp{width:100%;max-width:440px;padding:18px;display:flex;flex-direction:column;gap:12px}
#menu h1{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 62px);margin:0;text-align:center;font-size:clamp(34px,10vw,56px);font-weight:800;letter-spacing:.14em;font-style:italic;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#menu h1 small{display:block;font-size:13px;font-weight:600;letter-spacing:.4em;color:var(--dim);margin-top:4px;font-style:normal}
.bestrow{display:flex;justify-content:space-between;align-items:baseline;color:var(--dim);font-size:14px}.bestrow b{color:#fff;font-size:22px;font-variant-numeric:tabular-nums}
.swr{display:flex;gap:10px;justify-content:space-between}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}.sw.sel{border-color:#fff}
.two{display:flex;gap:8px}.two .btn{flex:1;font-size:14px;padding:12px 8px}
/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud *{pointer-events:none}
#hud .pad,#hud .tb{pointer-events:auto}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;justify-content:center;gap:8px}
.chip{padding:7px 14px;border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);text-align:center;min-width:118px}
.chip small{display:block;font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:700}
.chip b{font-size:19px;font-variant-numeric:tabular-nums;font-weight:700}
#sub,.sub{display:flex;justify-content:center;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:600;min-height:16px}#besttxt::before{content:'★ ';color:#ffd23f}#besttxt:empty::before{content:''}
#delta{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--dim);min-height:16px}#delta.good{color:#58e08a}#delta.bad{color:#ff6b5d}
#mm{position:absolute;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px);width:112px;height:112px;opacity:.95}
.tbs{position:absolute;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 10px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tb{padding:9px 14px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);font-weight:600;font-size:14px}
#speedo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:190px;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#spd{font-size:60px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;font-style:italic}
#speedo .u{font-size:12px;letter-spacing:.3em;color:var(--dim);font-weight:700}
#gear{position:absolute;right:-6px;top:6px;font-size:30px;font-weight:800;color:var(--acc);font-style:italic;min-width:30px;text-align:left}
#rpmbar{height:8px;border-radius:5px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
#rpmfill{height:100%;width:0;background:linear-gradient(90deg,#fff 0,#ffd23f 60%,#ff4d3d 100%);border-radius:5px}
#rpmfill.hot{background:#ff2a1a;box-shadow:0 0 12px #ff2a1a}
#tcl{position:absolute;left:-44px;top:20px;font-size:11px;font-weight:800;color:#ffb020;opacity:0;letter-spacing:.06em}#tcl.on{opacity:1}
#msg{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:30px;font-weight:800;font-style:italic;text-shadow:0 4px 24px rgba(0,0,0,.7);transition:opacity .3s}
#msg.big{font-size:min(20vw,96px)}#msg.go{color:#58e08a}#msg.flash{color:#ffd23f}
#wrong{position:absolute;left:0;right:0;top:40%;text-align:center;font-weight:800;font-size:22px;color:#ff6b5d;display:none;text-shadow:0 2px 14px #000}#wrong.on{display:block}
/* controles táctiles */
.pad{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);border-radius:22px;background:rgba(16,18,24,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);touch-action:none}
#steerz{left:calc(env(safe-area-inset-left) + 14px);width:min(46vw,300px);height:96px;display:flex;align-items:center;justify-content:center}
#steerz .rail{position:absolute;left:14%;right:14%;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:rgba(255,255,255,.28)}
#wheelknob{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;transition:transform .05s linear}
#wheelimg{width:48px;height:48px;border-radius:50%;border:5px solid rgba(255,255,255,.85);position:relative}
#wheelimg::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:5px;margin:-2.5px 0 0 -17px;background:rgba(255,255,255,.85)}
#wheelimg::before{content:"";position:absolute;left:50%;top:50%;width:5px;height:19px;margin:0 0 0 -2.5px;background:rgba(255,255,255,.85)}
#gas{right:calc(env(safe-area-inset-right) + 14px);width:92px;height:150px;display:grid;place-items:end center;padding-bottom:14px;font-weight:800;letter-spacing:.1em;font-size:13px;color:var(--dim)}
#brake{right:calc(env(safe-area-inset-right) + 120px);width:84px;height:104px;display:grid;place-items:end center;padding-bottom:12px;font-weight:800;letter-spacing:.1em;font-size:13px;color:var(--dim)}
#hand{right:calc(env(safe-area-inset-right) + 210px);width:64px;height:64px;display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--dim);letter-spacing:.06em}
#gas.on{background:rgba(88,224,138,.4);border-color:#58e08a;color:#fff}#brake.on{background:rgba(255,77,61,.45);border-color:#ff4d3d;color:#fff}#hand.on{background:rgba(255,176,32,.45);border-color:#ffb020;color:#fff}
@media (max-aspect-ratio:1/1){
#mm{width:84px;height:84px}
.tb{padding:7px 10px;font-size:12px}
#steerz{width:42vw;height:104px}
#gas{height:140px}#brake{right:calc(env(safe-area-inset-right) + 118px);height:96px}
#hand{right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 166px);width:92px;height:50px}
#speedo{bottom:calc(env(safe-area-inset-bottom) + 176px)}
#msg{top:20%}
}
@media (max-height:480px){#spd{font-size:44px}#steerz{height:84px}#gas{height:128px}#brake{height:92px}}
/* pausa / resultados */
.modal{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:20px}
.modal .box{width:100%;max-width:360px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.modal h2{margin:0 0 4px;font-size:26px;font-style:italic}
#rlist div{display:flex;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}#rlist .bl b{color:#ffd23f}
#rtotal{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
#rnew{color:#ffd23f;font-weight:700}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0d0f14;font-weight:700;letter-spacing:.3em;font-size:14px;color:var(--dim)}
@media (min-aspect-ratio:23/20){#menu{align-items:center;justify-content:flex-end;padding-right:calc(env(safe-area-inset-right) + 22px)}.mp{max-width:340px}#menu h1{text-align:left;left:calc(env(safe-area-inset-left) + 20px);right:auto;top:auto;bottom:calc(env(safe-area-inset-bottom) + 18px)}}

.seg{display:flex;padding:3px;border-radius:14px;background:rgba(255,255,255,.1)}
.seg button{flex:1;padding:11px 6px;border-radius:11px;background:transparent;font-weight:700;font-size:15px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(255,77,61,.35)}
#maps{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:0 -4px;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}
#maps::-webkit-scrollbar{display:none}
.mapc{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid transparent;text-align:center}
.mapc.sel{border-color:#fff;background:rgba(255,255,255,.18)}
.mapc canvas{width:48px;height:48px}
.mapc b{display:block;font-size:13px}.mapc small{display:block;font-size:10px;color:var(--dim);letter-spacing:.04em}
#dhud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px}
#dhud .row{display:flex;gap:8px}
#dtotal{font-size:30px}
#dcur{opacity:0;transform:scale(.9);transition:.15s;text-align:center;font-weight:800;font-style:italic;text-shadow:0 2px 14px #000}
#dcur.on{opacity:1;transform:none}
#dpts{font-size:30px;color:#ffd23f}#dmul{font-size:22px;color:var(--acc);margin:0 8px}#dang{font-size:16px;color:var(--dim)}
@media (max-aspect-ratio:1/1){#dhud{top:calc(env(safe-area-inset-top) + 100px)}}
@media (min-aspect-ratio:23/20){#menu{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}.mp{max-height:100%;overflow-y:auto}.seg button{padding:8px 6px}.bestrow b{font-size:18px}#maps{flex-direction:column;overflow-y:auto;overflow-x:hidden;max-height:22vh;flex:none;touch-action:pan-y}.mapc{width:100%;flex-direction:row;gap:10px;text-align:left;padding:5px 8px}.mapc canvas{width:34px;height:34px}.mp{gap:8px;padding:12px}.btn{padding:10px 12px}.btn.pri{padding:12px}.sw{width:32px;height:32px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="loading">CARGANDO…</div>
<a id="back" href="index.html">‹ Apps</a>

<div id="menu" class="hide">
  <h1>CARRERAS<small>RACE · DRIFT</small></h1>
  <div class="mp glass">
    <div class="seg"><button id="m_race">🏁 Carrera</button><button id="m_drift">💨 Drift</button></div>
    <div id="maps"></div>
    <div class="bestrow"><span id="bestlbl">Mejor vuelta</span><b id="menubest">--:--.---</b></div>
    <div class="swr">
      <button class="sw" data-c="c4262b" style="background:#c4262b"></button>
      <button class="sw" data-c="1f5fd1" style="background:#1f5fd1"></button>
      <button class="sw" data-c="f0b429" style="background:#f0b429"></button>
      <button class="sw" data-c="eceff3" style="background:#eceff3"></button>
      <button class="sw" data-c="2b2e35" style="background:#2b2e35"></button>
      <button class="sw" data-c="1f8a5b" style="background:#1f8a5b"></button>
    </div>
    <button class="btn pri" id="playb">CORRER</button>
    <div class="two"><button class="btn" id="tcb">Tracción</button><button class="btn hide" id="asb">Ayuda drift</button><button class="btn" id="stripeb">Franja</button><button class="btn" id="sndb">Sonido</button></div>
  </div>
</div>

<div id="hud" class="hide">
  <canvas id="mm" width="180" height="180"></canvas>
  <div id="dhud" class="hide"><div class="row"><div class="chip"><small>PUNTOS</small><b id="dtotal">0</b></div><div class="chip" style="min-width:80px"><small>TIEMPO</small><b id="dtime">3:00</b></div></div><div id="dbest" class="sub"></div><div id="dcur"><span id="dpts"></span><span id="dmul"></span><span id="dang"></span></div></div>
  <div class="top"><div class="chip"><small id="laptxt">VUELTA</small><b id="timetxt">0:00.000</b><div class="sub"><span id="delta"></span><span id="besttxt"></span></div></div></div>
  <div class="tbs"><button class="tb" id="pause">❚❚ Pausa</button><button class="tb" id="cam">Cámara 1</button><button class="tb" id="reset">↺ Reponer</button></div>
  <div id="msg"></div><div id="wrong">⚠ CONTRAMANO</div>
  <div id="speedo"><div id="spd">0</div><div class="u">KM/H</div><div id="gear">N</div><div id="tcl">TC</div><div id="rpmbar"><div id="rpmfill"></div></div></div>
  <div class="pad" id="steerz"><div class="rail"></div><div id="wheelknob"><div id="wheelimg"></div></div></div>
  <div class="pad" id="hand">FRENO<br>MANO</div>
  <div class="pad" id="brake">FRENO</div>
  <div class="pad" id="gas">ACELERAR</div>
</div>

<div id="pausemenu" class="modal hide"><div class="box glass"><h2>Pausa</h2><button class="btn pri" id="resume">Continuar</button><button class="btn" id="restart">Reiniciar carrera</button><button class="btn" id="quit">Salir al menú</button></div></div>
<div id="results" class="modal hide"><div class="box glass"><h2 id="rtitle">¡Meta!</h2><div id="rtotal">0:00.000</div><div id="rnew" class="hide">★ Nuevo récord</div><div id="rlist"></div><button class="btn pri" id="again">Otra carrera</button><button class="btn" id="tomenu">Menú</button></div></div>
