<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a2440">
<title>Carreras 3D</title>
<style>
:root{--acc:#ff8a3d;--acc2:#ffb35c;--ink:#fff;--mut:rgba(255,255,255,.62);--glass:rgba(36,28,52,.42);--stroke:rgba(255,255,255,.18);--good:#6ee7a0;--bad:#ff6b6b;
--sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2440;position:fixed;inset:0;width:100%;overscroll-behavior:none;font-family:var(--sf);color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(30,12,40,.34) 100%)}
#speedfx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,236,210,0) 52%,rgba(255,226,190,.22) 100%)}
.screen{position:fixed;inset:0;display:none;pointer-events:none}
.screen>*{pointer-events:auto}
body[data-s=menu] #menu,body[data-s=pause] #pause,body[data-s=results] #results{display:flex}
body[data-s=race] #hud,body[data-s=count] #hud,body[data-s=pause] #hud{display:block}
body[data-s=pause] #ctl,body[data-s=pause] #speedo{display:none}
#hud{position:fixed;inset:0;display:none;pointer-events:none}
#hud>*{pointer-events:none}
#hud .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(52,38,78,.55)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--stroke);box-shadow:0 8px 30px rgba(20,8,30,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.pill{position:fixed;z-index:20;top:calc(10px + var(--sat));left:calc(12px + var(--sal));padding:8px 14px 8px 11px;border-radius:99px;font-size:14px;font-weight:600;color:#fff;text-decoration:none;display:none;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--stroke);letter-spacing:.2px}
body[data-s=menu] .pill,body[data-s=pause] .pill{display:block}
.pill:active{transform:scale(.96)}
/* ----- menu ----- */
#menu{flex-direction:column;justify-content:space-between;align-items:center;padding:calc(54px + var(--sat)) 18px calc(16px + var(--sab))}
.logo{text-align:center;text-shadow:0 4px 24px rgba(60,10,40,.45)}
.logo h1{margin:0;font-size:46px;line-height:.95;font-weight:900;font-style:italic;letter-spacing:-1px;background:linear-gradient(180deg,#fff 10%,#ffd9a8 60%,#ff9a4d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(120,40,30,.35))}
.logo h1 span{display:inline-block;margin-left:8px;padding:0 10px;border-radius:12px;background:var(--acc);-webkit-text-fill-color:#2a1020;color:#2a1020;transform:skewX(-8deg);font-size:40px;filter:none;box-shadow:0 4px 18px rgba(255,120,40,.5)}
.logo p{margin:9px 0 0;font-size:13px;letter-spacing:3.2px;text-transform:uppercase;font-weight:600;color:rgba(255,240,225,.85)}
.sheet{width:100%;max-width:460px;border-radius:30px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:700;margin:0 0 7px 3px}
.cars{display:flex;gap:10px}
.cars button{flex:1;height:50px;border-radius:16px;border:2px solid transparent;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:rgba(255,255,255,.08);gap:8px}
.cars i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.3)}
.cars button.on,.seg button.on{border-color:var(--acc);background:rgba(255,138,61,.2)}
.seg{display:flex;gap:6px;padding:4px;border-radius:16px;background:rgba(0,0,0,.2)}
.seg button{flex:1;padding:10px 4px;border-radius:12px;font-weight:700;font-size:13.5px;border:2px solid transparent;line-height:1.15}
.seg small{display:block;font-weight:500;font-size:10.5px;color:var(--mut);margin-top:1px}
.bestrow{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-size:13px;color:var(--mut)}
.bestrow b{color:#fff;font-size:17px;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;border-radius:20px;height:54px;font-size:17px;letter-spacing:.3px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffb35c,#ff7a2f);color:#2a1020;box-shadow:0 8px 24px rgba(255,110,30,.45),inset 0 1px 0 rgba(255,255,255,.55);height:62px;font-size:21px;letter-spacing:1.5px;font-style:italic}
.btn.sec{background:rgba(255,255,255,.12);border:1px solid var(--stroke)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* ----- hud ----- */
.tl{position:absolute;top:calc(12px + var(--sat));left:calc(12px + var(--sal));border-radius:20px;padding:9px 14px 9px;min-width:132px}
.tl .a{display:flex;align-items:baseline;gap:7px}
.tl .a small,.tl .c small{font-size:10px;letter-spacing:1.4px;color:var(--mut);font-weight:700}
.tl .a b{font-size:25px;font-weight:800;font-style:italic;line-height:1}
.tl .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.3px}
.tl .c{margin-top:2px;font-size:12px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85)}
.tr{position:absolute;top:calc(12px + var(--sat));right:calc(12px + var(--sar));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tr .bt{display:flex;gap:8px}
.rb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.rb:active{transform:scale(.92)}
#mini{width:116px;height:70px;border-radius:18px}
#delta{position:absolute;top:calc(14px + var(--sat));left:50%;transform:translateX(-50%) scale(.9);padding:7px 14px;border-radius:99px;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s,transform .2s,background .2s;white-space:nowrap}
#delta.show{opacity:1;transform:translateX(-50%) scale(1)}
#delta.g{background:rgba(40,160,100,.55);color:#d6ffe8}#delta.r{background:rgba(210,60,60,.55);color:#ffe0e0}
#speedo{position:absolute;left:50%;bottom:calc(var(--sab) + 134px);transform:translateX(-50%);width:196px;height:112px;text-align:center;filter:drop-shadow(0 2px 8px rgba(30,10,40,.55))}
#speedo svg{position:absolute;left:0;top:0;width:196px;height:106px;overflow:visible}
#speedo .n{position:absolute;left:0;right:0;bottom:12px;font-size:54px;font-weight:900;font-style:italic;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
#speedo .u{position:absolute;left:0;right:0;bottom:-6px;font-size:11px;letter-spacing:2.5px;color:rgba(255,255,255,.75);font-weight:700}
#speedo .g{position:absolute;left:8px;bottom:10px;font-size:11px;font-weight:800;color:var(--acc2)}
#warn{position:absolute;top:calc(120px + var(--sat));left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:rgba(220,60,60,.7);font-weight:800;font-size:13px;letter-spacing:1.2px;opacity:0;transition:opacity .2s;white-space:nowrap}
#warn.show{opacity:1}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:99px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;white-space:nowrap;text-align:center}
#toast.show{opacity:1}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:900;font-style:italic;pointer-events:none;color:#fff;text-shadow:0 6px 40px rgba(255,120,40,.6),0 3px 0 rgba(120,40,30,.4)}
#count.pop{animation:pop .9s cubic-bezier(.2,.9,.3,1) both}
#count.go{color:#8dffb8;text-shadow:0 6px 40px rgba(60,255,140,.6)}
@keyframes pop{0%{transform:scale(1.9);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
#ctl{position:absolute;left:0;right:0;bottom:0;height:calc(130px + var(--sab));pointer-events:none}
.cb{position:absolute;bottom:calc(var(--sab) + 18px);pointer-events:auto;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:transform .06s,background .1s;font-weight:800}
.cb.dn{transform:scale(.93);background:rgba(255,138,61,.45)}
#bL,#bR{width:108px;height:98px;border-radius:30px}
#bL{left:calc(14px + var(--sal))}#bR{right:calc(14px + var(--sar))}
#bL .ico,#bR .ico{width:46px;height:46px;stroke-width:3.2}
#bB{left:50%;margin-left:-44px;width:88px;height:88px;border-radius:50%;font-size:11px;letter-spacing:1.2px;color:#ffd7d0}
#bB .ico{width:30px;height:30px;stroke:#ff8f80}
#bG{left:50%;margin-left:-40px;bottom:calc(var(--sab) + 118px);width:80px;height:56px;border-radius:20px;font-size:13px;letter-spacing:1.5px;display:none}
body.noauto #bG{display:flex}
body.ctl-drag #bL,body.ctl-drag #bR,body.ctl-tilt #bL,body.ctl-tilt #bR{display:none}
#hint{position:absolute;bottom:calc(var(--sab) + 30px);left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.75);display:none;pointer-events:none}
body.ctl-drag #hint,body.ctl-tilt #hint{display:block}
body.ctl-drag #bB,body.ctl-tilt #bB{left:auto;right:calc(18px + var(--sar));margin:0}
#fade{position:fixed;inset:0;background:#1a1226;opacity:0;pointer-events:none;transition:opacity .25s}
/* panels */
#pause,#results{align-items:center;justify-content:center;background:rgba(24,14,36,.38);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:20px}
.card{width:100%;max-width:380px;border-radius:30px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:11px;background:rgba(40,30,58,.55)}
.card h2{margin:0 0 4px;text-align:center;font-size:28px;font-weight:900;font-style:italic;letter-spacing:.5px}
.big{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.badge{align-self:center;padding:6px 14px;border-radius:99px;background:linear-gradient(180deg,#ffb35c,#ff7a2f);color:#2a1020;font-weight:800;font-size:12px;letter-spacing:1.4px}
.laps{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.laps div{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-variant-numeric:tabular-nums;font-weight:600}
.laps div span:first-child{color:var(--mut);font-size:13px}
.laps div.best{background:rgba(255,138,61,.25);border:1px solid rgba(255,138,61,.6)}
.sub{text-align:center;color:var(--mut);font-size:13px}
/* settings */
#set{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(18,10,28,.5);z-index:30;padding:0 12px calc(12px + var(--sab))}
#set.show{display:flex}
#set .card{max-width:440px;background:rgba(44,34,64,.82)}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;font-size:15.5px;min-height:38px}
.line small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px}
.sw{width:52px;height:32px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:30px;background:transparent;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:rgba(255,255,255,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.25)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}
@media (orientation:landscape){
 #menu{flex-direction:row;align-items:center;justify-content:space-between;padding:calc(12px + var(--sat)) calc(22px + var(--sar)) calc(12px + var(--sab)) calc(22px + var(--sal))}
 #menu .logo{align-self:flex-start;margin-top:44px;text-align:left}
 .sheet{max-width:340px;padding:12px;gap:8px}
 .logo h1{font-size:38px}.logo h1 span{font-size:33px}
 .btn.primary{height:52px}
 .tl{padding:7px 12px}.tl .t{font-size:20px}
 #speedo{bottom:calc(var(--sab) + 8px);left:calc(150px + var(--sal));transform:scale(.9);transform-origin:bottom left}
 #bL,#bR{height:86px;width:120px}
 #bB{margin-left:0;left:auto;right:calc(150px + var(--sar));bottom:calc(var(--sab) + 18px);width:78px;height:78px}
 body.ctl-drag #bB,body.ctl-tilt #bB{right:calc(24px + var(--sar))}
 #bG{left:auto;right:calc(150px + var(--sar));margin:0;bottom:calc(var(--sab) + 104px)}
 #count{font-size:110px}
 .card{padding:16px;gap:8px}.big{font-size:38px}
 #delta{top:calc(10px + var(--sat))}
 #mini{width:96px;height:58px}
 #warn{top:calc(70px + var(--sat))}
 #set .card{max-height:96vh;overflow:auto}
}
@media (max-height:700px) and (orientation:portrait){.logo h1{font-size:38px}.logo h1 span{font-size:33px}}
</style>
</head>
<body data-s="boot">
<canvas id="c"></canvas>
<div id="vig"></div><div id="speedfx"></div>
<a class="pill" id="apps" href="index.html">‹ Apps</a>

<section class="screen" id="menu">
  <div class="logo"><h1>CARRERAS<span>3D</span></h1><p>Atardecer en la costa</p></div>
  <div class="sheet glass">
    <div><p class="lbl">Tu coche</p><div class="cars" id="carSw"></div></div>
    <div><p class="lbl">Circuito</p><div class="seg" id="trackSw"></div></div>
    <div class="bestrow"><span>Mejor vuelta</span><b id="menuBest">--:--.--</b></div>
    <button class="btn primary" id="play">CORRER</button>
    <div class="row2">
      <button class="btn sec" id="menuSet" style="height:46px;font-size:15px"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
      <button class="btn sec" id="menuMute" style="height:46px;font-size:15px"></button>
    </div>
  </div>
</section>

<section id="hud">
  <div class="tl glass"><div class="a"><small>VUELTA</small><b id="lapTxt">1/3</b></div><div class="t" id="timeTxt">0:00.00</div><div class="c"><small>MEJOR </small><span id="bestTxt">--:--.--</span></div></div>
  <div id="delta" class="glass"></div>
  <div class="tr"><div class="bt">
    <button class="rb glass" id="resetBtn" aria-label="Reposicionar"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="rb glass" id="pauseBtn" aria-label="Pausa"><svg class="ico" viewBox="0 0 24 24" style="fill:currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button></div>
    <canvas id="mini" class="glass" width="232" height="140"></canvas></div>
  <div id="warn">SENTIDO CONTRARIO</div>
  <div id="toast" class="glass"></div>
  <div id="speedo">
    <svg viewBox="0 0 196 106"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff5a3d"/></linearGradient></defs>
    <path d="M12 100 A86 86 0 0 1 184 100" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9" stroke-linecap="round"/>
    <path id="arc" d="M12 100 A86 86 0 0 1 184 100" fill="none" stroke="url(#gg)" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg>
    <div class="n" id="spd">0</div><div class="u">KM/H</div><div class="g" id="gear">N</div>
  </div>
  <div id="count"></div>
  <div id="hint"></div>
  <div id="ctl">
    <button class="cb glass" id="bL" aria-label="Izquierda"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="cb glass" id="bB" aria-label="Freno"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3.5" style="fill:currentColor;stroke:none"/></svg>FRENO</button>
    <button class="cb glass" id="bG">ACELERAR</button>
    <button class="cb glass" id="bR" aria-label="Derecha"><svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</section>

<section class="screen" id="pause"><div class="card glass"><h2>PAUSA</h2>
  <button class="btn primary" id="pResume" style="height:56px;font-size:19px">CONTINUAR</button>
  <button class="btn sec" id="pRestart">Reiniciar carrera</button>
  <button class="btn sec" id="pSet">Ajustes</button>
  <button class="btn sec" id="pMenu">Salir al menú</button></div></section>

<section class="screen" id="results"><div class="card glass"><h2 id="resTitle">¡META!</h2>
  <div class="sub">Tiempo total</div><div class="big" id="resTotal">0:00.00</div>
  <div class="badge" id="resBadge" style="display:none">NUEVO RÉCORD</div>
  <div class="laps" id="resLaps"></div>
  <div class="sub" id="resGhost"></div>
  <button class="btn primary" id="rAgain" style="height:56px;font-size:19px">OTRA VEZ</button>
  <button class="btn sec" id="rMenu">Menú</button></div></section>

<div id="set"><div class="card glass"><h2 style="font-size:24px">AJUSTES</h2>
  <div class="line"><span>Volumen</span><input type="range" id="vol" min="0" max="100" step="1"></div>
  <div class="line"><span>Sonido<small>Silenciar todo el audio</small></span><div class="sw" id="swSound"></div></div>
  <div class="line"><span>Acelerar solo<small>Aceleración automática</small></span><div class="sw" id="swAuto"></div></div>
  <div><p class="lbl">Dirección</p><div class="seg" id="ctlSeg"><button data-c="btn">Botones</button><button data-c="drag">Arrastrar</button><button data-c="tilt">Inclinar</button></div></div>
