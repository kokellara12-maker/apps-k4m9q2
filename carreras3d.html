<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0614">
<title>Carreras 3D</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0a0614;--ink:#f1ecff;--dim:#9a8fc2;--cyan:#00f0ff;--mag:#ff2bd6;--yel:#ffd23f;--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#back{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 12px);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(10,6,20,.55);border:1px solid rgba(154,143,194,.35)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.show{display:block}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 44px);left:0;right:0;text-align:center;line-height:1.05}
.top b{display:block;font-size:34px;font-weight:900;font-style:italic;color:var(--cyan);text-shadow:0 0 14px rgba(0,240,255,.55);font-variant-numeric:tabular-nums}
.top small{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
.top .lap{color:var(--yel);font-weight:900;font-size:13px;letter-spacing:.12em}
#mm{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px);width:84px;height:84px;opacity:.9}
#spdw{position:absolute;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 50px);line-height:1}
#spdw b{font-size:40px;font-weight:900;font-style:italic;color:var(--mag);text-shadow:0 0 14px rgba(255,43,214,.6);font-variant-numeric:tabular-nums}
#spdw small{display:block;font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.1em}
#cd{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:120px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 28px var(--mag),0 0 4px #fff;pointer-events:none;display:none;animation:pop .8s ease-out}
#cd.go{color:var(--yel);text-shadow:0 0 28px var(--yel)}
@keyframes pop{0%{transform:scale(1.8);opacity:0}25%{opacity:1}100%{transform:scale(1)}}
#pop{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 130px);text-align:center;font-weight:900;font-size:22px;color:var(--cyan);text-shadow:0 0 14px rgba(0,240,255,.6);opacity:0;pointer-events:none;transition:opacity .25s;font-variant-numeric:tabular-nums}
#pop.show{opacity:1}#pop.rec{color:var(--yel);text-shadow:0 0 14px rgba(255,210,63,.7)}
#ctl{position:fixed;left:0;right:0;bottom:0;padding:0 calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 14px);display:none;justify-content:space-between;align-items:flex-end}
#ctl.show{display:flex}
.grp{display:flex;gap:10px}
.btn{width:88px;height:96px;border-radius:22px;border:2px solid rgba(0,240,255,.6);background:rgba(10,6,20,.45);color:var(--cyan);font:900 38px var(--font);display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 0 16px rgba(0,240,255,.25)}
.btn.on{background:rgba(0,240,255,.35);box-shadow:0 0 26px rgba(0,240,255,.7)}
#bb{width:104px;border-color:rgba(255,43,214,.7);color:var(--mag);font-size:16px;letter-spacing:.06em;box-shadow:0 0 16px rgba(255,43,214,.25)}
#bb.on{background:rgba(255,43,214,.35);box-shadow:0 0 26px rgba(255,43,214,.7)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px 16px;background:rgba(10,6,20,.6)}
.ov.show{display:flex}
.card{text-align:center;max-width:360px;width:100%}
h1{margin:0 0 8px;font-size:clamp(44px,14vw,72px);line-height:.95;font-weight:900;font-style:italic;text-shadow:0 0 22px rgba(255,43,214,.75),0 0 2px #fff}
h2{margin:0 0 14px;font-size:34px;font-weight:900;font-style:italic;color:var(--yel);text-shadow:0 0 18px rgba(255,210,63,.5)}
#sub{margin:0 0 16px;color:var(--cyan);font-weight:700;font-size:17px}
#help{margin:0 0 16px;color:var(--dim);font-size:14px;line-height:1.55}#help span{color:var(--ink);font-weight:700}
#rec{margin:0 0 16px;color:var(--yel);font-weight:800;font-variant-numeric:tabular-nums}
.cta{display:inline-block;border:0;padding:14px 28px;border-radius:14px;background:var(--mag);color:#14041a;font:900 17px var(--font);letter-spacing:.02em;box-shadow:0 0 26px rgba(255,43,214,.55)}
.cta.alt{background:transparent;color:var(--cyan);border:2px solid var(--cyan);box-shadow:none;margin-left:8px}
#rl{list-style:none;margin:0 0 12px;padding:0}
#rl li{display:flex;justify-content:space-between;padding:10px 14px;margin-bottom:6px;border-radius:12px;background:rgba(154,143,194,.14);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
#rl li.b{background:rgba(0,240,255,.2);color:var(--cyan)}
.sum{display:flex;justify-content:space-between;color:var(--dim);font-weight:800;font-size:15px;margin:0 4px 6px;font-variant-numeric:tabular-nums}.sum b{color:var(--ink)}
#rn{display:none;color:var(--yel);font-weight:900;margin:8px 0 14px;font-size:18px}
.row{margin-top:16px}
@media(prefers-reduced-motion:no-preference){#go{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.05)}}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="index.html">‹ Apps</a>
<div id="hud">
  <div class="top"><small class="lap">VUELTA <span id="lapn">1/3</span></small><b id="time">0:00.00</b><small id="best">Récord --:--.--</small></div>
  <div id="spdw"><b id="spd">0</b><small>KM/H</small></div>
  <canvas id="mm" width="168" height="168"></canvas>
</div>
<div id="cd"></div><div id="pop"></div>
<div id="ctl"><div class="grp"><div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div></div><div class="btn" id="bb">FRENO</div></div>
<div class="ov" id="menu"><div class="card">
  <h1>CARRERAS<br>3D</h1><p id="sub">Contrarreloj neón · 3 vueltas</p>
  <p id="help"><span>◀ ▶</span> para girar · <span>FRENO</span> para derrapar<br>Acelera solo. Evita las vallas y el borde.<br>Corre contra el fantasma de tu mejor vuelta.</p>
  <p id="rec"></p><button class="cta" id="go">¡A CORRER!</button>
</div></div>
<div class="ov" id="res"><div class="card">
  <h2>¡META!</h2><ul id="rl"></ul>
  <div class="sum"><span>Tiempo total</span><b id="rt"></b></div><div class="sum"><span>Mejor vuelta</span><b id="rb"></b></div>
  <div id="rn">🏆 ¡NUEVO RÉCORD!</div>
  <div class="row"><button class="cta" id="again">REINTENTAR</button><button class="cta alt" id="menub">MENÚ</button></div>
</div></div>
