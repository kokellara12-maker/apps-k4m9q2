<!doctype html><html lang="es"><head><script src="mute.js"></script><script src="progress.js"></script><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script><script src="bgm.js" data-track="jardin"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#6ec6f0"><title>PLANTAS VS ZOMBIS</title></head><body><script src="gk.js"></script><script>
(function(){

function cellAt(x,y){var L=LAYOUT;var c=Math.floor((x-L.x0)/L.cw),r=Math.floor((y-L.y0)/L.ch);if(c<0||c>=COLS||r<0||r>=ROWS)return null;return{c:c,r:r}}
function cx(c){return LAYOUT.x0+(c+.5)*LAYOUT.cw}function cy(r){return LAYOUT.y0+(r+.5)*LAYOUT.ch}
function reset(){lay(GK.W(),GK.H());grid=[];for(var r=0;r<ROWS;r++){grid.push(new Array(COLS).fill(null))}zs=[];peas=[];suns=[];parts=[];mowers=[];for(r=0;r<ROWS;r++)mowers.push({x:-1.1,a:false,used:false});sunN=150;cds=PL.map(function(){return 0});sel=-1;shovel=false;t=0;wave=0;spawnQ=[];nextWave=16;sunT=4;kills=0;over=false;bannerT=3;bannerTxt='¡Los zombis se acercan!';GK.setScore(0)}
function sched(){wave++;var n=2+Math.floor(wave*1.7),big=wave%5===0;if(big)n=Math.floor(n*1.8);for(var i=0;i<n;i++){var r=Math.random(),ty='n';if(wave>=2&&r<.28)ty='c';if(wave>=4&&Math.random()<.2)ty='b';if(wave>=5&&Math.random()<.18)ty='r';spawnQ.push({t:t+(big?i*.5:i*(7/n))+rnd(0,2),ty:ty,r:Math.floor(Math.random()*ROWS)})}nextWave=t+Math.max(14,26-wave*.8);if(big){bannerT=3.5;bannerTxt='¡UNA OLEADA ENORME SE ACERCA!';GK.snd('radio',.5)}else if(wave>1){bannerT=1.6;bannerTxt='Oleada '+wave}}
function plantAt(c,r,i){var P=PL[i];if(grid[r][c]||sunN<P.c||cds[i]>0)return false;sunN-=P.c;cds[i]=P.cd;grid[r][c]={t:P.id,i:i,c:c,r:r,hp:P.hp,mx:P.hp,sh:rnd(.3,1),sun:rnd(4,8),ex:P.id==='cherry'?.9:0,an:0,pop:0};GK.snd('ok',.35);GK.snd('cloth',.3);return true}
function hitZ(z,dmg,slow){z.hp-=dmg;z.fl=.12;if(slow)z.slow=4;if(z.hp<=0&&!z.dead){z.dead=true;z.dt=0;kills++;GK.add(10);GK.snd('ugh',.4);burst(z.x,z.r,'#7a9a6a',10)}}
function burst(x,r,col,n){for(var i=0;i<n;i++)parts.push({x:LAYOUT.x0+x*LAYOUT.cw,y:cy(r)-LAYOUT.ch*.2,vx:rnd(-120,120),vy:rnd(-200,40),t:.6,col:col})}
function down(x,y){var L=LAYOUT;if(over)return;
 for(var i=suns.length-1;i>=0;i--){var s=suns[i];if(!s.col&&Math.hypot(s.x-x,s.y-y)<36){s.col=1;GK.snd('coin',.4);return}}
 if(y<L.tb){var pw=70,px0=196;for(var k=0;k<PL.length;k++){var bx=px0+k*(pw+6);if(x>=bx&&x<=bx+pw){if(cds[k]>0||sunN<PL[k].c){GK.snd('err',.3);sel=-1}else{sel=sel===k?-1:k;shovel=false;GK.snd('click',.3)}return}}var sx=px0+PL.length*(pw+6);if(x>=sx&&x<=sx+54){shovel=!shovel;sel=-1;GK.snd('click',.3)}return}
 var cl=cellAt(x,y);if(!cl)return;
 if(shovel){if(grid[cl.r][cl.c]){grid[cl.r][cl.c]=null;GK.snd('cloth',.4);shovel=false}return}
 if(sel>=0){if(plantAt(cl.c,cl.r,sel))sel=-1;else GK.snd('err',.3)}}
function addSunFrom(p){suns.push({x:cx(p.c),y:cy(p.r)-12,y0:cy(p.r)+8,vy:-170,val:25,life:10,col:0,hop:1})}
function explode(p){GK.snd('boom',.6);GK.shake(8);for(var z of zs){if(!z.dead&&Math.abs(z.r-p.r)<=1&&Math.abs(z.x-(p.c+.5))<1.7){hitZ(z,1800)}}for(var i=0;i<26;i++)parts.push({x:cx(p.c),y:cy(p.r),vx:rnd(-260,260),vy:rnd(-300,100),t:.7,col:Math.random()<.5?'#ff9a2a':'#ffe26a'})}
function update(dt){if(over)return;t+=dt;var L=LAYOUT;
 if(t>=nextWave)sched();
 for(var i=spawnQ.length-1;i>=0;i--){if(spawnQ[i].t<=t){var q=spawnQ.splice(i,1)[0],Z=ZT[q.ty];zs.push({x:COLS+.4+rnd(0,.5),r:q.r,ty:q.ty,hp:Z.hp,mx:Z.hp,spd:Z.spd*(.9+Math.random()*.2),eat:0,slow:0,ph:Math.random()*6,fl:0,dead:false,dt:0})}}
 sunT-=dt;if(sunT<=0){sunT=rnd(7,11);suns.push({x:L.x0+rnd(.5,COLS-.5)*L.cw,y:L.tb-10,y0:L.y0+rnd(1,ROWS-.6)*L.ch,vy:55,val:25,life:11,col:0,fall:1})}
 for(i=0;i<cds.length;i++)cds[i]=Math.max(0,cds[i]-dt);
 for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){var p=grid[r][c];if(!p)continue;p.an+=dt;p.pop=Math.max(0,p.pop-dt*4);
  if(p.t==='sun'){p.sun-=dt;if(p.sun<=0){p.sun=12;addSunFrom(p)}}
  else if(p.t==='pea'||p.t==='ice'){p.sh-=dt;var rr=r,cc=c,tgt=zs.some(function(z){return !z.dead&&z.r===rr&&z.x>cc&&z.x<COLS+.5});if(tgt&&p.sh<=0){p.sh=1.4;peas.push({x:c+.8,r:r,ice:p.t==='ice'});p.pop=1;GK.snd('swoosh',.12,1.4)}}
  else if(p.t==='cherry'){p.ex-=dt;if(p.ex<=0){explode(p);grid[r][c]=null}}}
 for(i=peas.length-1;i>=0;i--){var pe=peas[i];pe.x+=4.2*dt;var hit=null;for(var z of zs){if(z.dead||z.r!==pe.r)continue;if(pe.x>z.x-.25&&pe.x<z.x+.35){hit=z;break}}
  if(hit){hitZ(hit,pe.ice?22:20,pe.ice);GK.snd('splash',.15,1.5+Math.random()*.4);burst(pe.x,pe.r,pe.ice?'#9fe0ff':'#7ad04a',4);peas.splice(i,1)}else if(pe.x>COLS+1)peas.splice(i,1)}
 for(i=zs.length-1;i>=0;i--){var z=zs[i];z.fl=Math.max(0,z.fl-dt);if(z.dead){z.dt+=dt;if(z.dt>1.1)zs.splice(i,1);continue}
  z.ph+=dt*(z.eat>0?9:z.ty==='r'?9:4.5);z.slow=Math.max(0,z.slow-dt);var sp=z.spd*(z.slow>0?.5:1);
  var ci=Math.floor(z.x-.15),pl=ci>=0&&ci<COLS?grid[z.r][ci]:null;if(pl&&z.x<ci+1.0){z.eat=1;pl.hp-=dt*(z.ty==='b'?95:80);if(Math.random()<dt*2.5)GK.snd('punch'+(1+((Math.random()*3)|0)),.12);if(pl.hp<=0){grid[z.r][ci]=null;GK.snd('cloth',.3)}}else{z.eat=0;z.x-=sp*dt}
  if(z.x<-.35&&!mowers[z.r].used){mowers[z.r].a=true;mowers[z.r].used=true;GK.snd('metal2',.4)}
  if(z.x<-1.4){over=true;GK.snd('ugh',.5);GK.over('¡Los zombis se comieron tu cerebro! Oleada '+wave);return}}
 mowers.forEach(function(m,r){if(m.a){m.x+=7.5*dt;zs.forEach(function(z){if(!z.dead&&z.r===r&&z.x<m.x+.6&&z.x>m.x-.5){z.hp=0;z.dead=true;z.dt=0;kills++;GK.add(10);burst(z.x,r,'#7a9a6a',8)}});if(m.x>COLS+1)m.a=false}});
 for(i=suns.length-1;i>=0;i--){var s=suns[i];if(s.col){s.x+=(150-s.x)*Math.min(1,dt*9);s.y+=(34-s.y)*Math.min(1,dt*9);if(Math.hypot(s.x-150,s.y-34)<10){sunN+=s.val;suns.splice(i,1)}}else{if(s.fall){s.y+=s.vy*dt;if(s.y>=s.y0){s.y=s.y0;s.fall=0}}else if(s.hop){s.y+=s.vy*dt;s.vy+=420*dt;if(s.vy>0&&s.y>=s.y0){s.y=s.y0;s.hop=0}}s.life-=dt;if(s.life<=0)suns.splice(i,1)}}

 var ar=Math.sin(ph*.5)*.06;c.save();c.translate(-.2,-.1);c.rotate(-1.35+ar+(z.eat>0?Math.sin(ph)*.2:0));c.fillStyle=skin;c.beginPath();c.roundRect(-.05,0,.1,.38,.05);c.fill();c.fillStyle='#6a5a4a';c.fillRect(-.055,0,.11,.12);c.restore();
