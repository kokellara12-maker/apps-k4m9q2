<script>
(function(){
var cv=document.getElementById('cv'),g=cv.getContext('2d'),DPR=Math.min(2,devicePixelRatio||1),W=0,H=0;

try{S.name=localStorage.getItem('af_name')||''}catch(e){}$('nm').value=S.name;

function toneStart(f){var a=audio();if(!a)return;toneStop(true);var master=a.createGain();master.gain.value=0;var os=[];[[1,.6],[2,.5],[3,.34],[4,.2]].forEach(function(p){var o=a.createOscillator();o.type='sine';o.frequency.value=f*p[0];var gg=a.createGain();gg.gain.value=p[1]*.18;o.connect(gg);gg.connect(master);o.start();os.push({o:o,m:p[0]})});master.connect(a.destination);master.gain.setTargetAtTime(window.__misMute?0:.9,a.currentTime,.03);tone={m:master,os:os,f:f}}

var TT=0;

 g.clearRect(0,0,W,H);var cx=W*.5,L=lenOf(viz.freq);
 if(S.phase==='home'||S.phase==='res'){viz.freq=180+Math.sin(t*.4)*60;viz.ampT=.28}
 var cols=[['rgba(60,255,200,','rgba(120,90,255,'],['rgba(80,200,255,','rgba(180,80,255,']];

 for(var k=0;k<7;k++){g.beginPath();var col=cols[k%2];var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,col[0]+'0)');gr.addColorStop(.45,col[(k+1)%2?0:1]+(.5-k*.04)+')');gr.addColorStop(.55,col[k%2?0:1]+(.5-k*.04)+')');gr.addColorStop(1,col[0]+'0)');g.strokeStyle=gr;g.lineWidth=1.4+(k===0?1.2:0);g.shadowColor='rgba(100,200,255,.8)';g.shadowBlur=k===0?18:8;
  for(var y=0;y<=H;y+=5){var u=(y/H-.5)*2;var env=Math.exp(-u*u*1.6);var a=(12+k*3.5)*viz.amp*2.3*env*(1+.12*Math.sin(t*.7+k));var x=cx+Math.sin(y/L*6.283+t*(2+k*.35)+k*1.3)*a+Math.sin(y/(L*.6)*6.283-t*1.6+k)*a*.3;if(y===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke()}
 g.globalCompositeOperation='source-over';g.shadowBlur=0;
 if(viz.shape){var s=viz.shape;var area=Math.min(W,H)*.2;var w=Math.sqrt(s.q)*area,h=area/Math.sqrt(s.q);g.save();g.translate(cx,H*.46);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=2;g.shadowColor='rgba(120,220,255,.9)';g.shadowBlur=22;g.beginPath();g.ellipse(0,0,w,h,0,0,6.283);g.stroke();if(s.ghost){g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=1.5;g.setLineDash([6,6]);var gw=Math.sqrt(s.ghost)*area,gh=area/Math.sqrt(s.ghost);g.beginPath();g.ellipse(0,0,gw,gh,0,0,6.283);g.stroke()}g.restore()}
}
requestAnimationFrame(draw);
/* ---------- retos ---------- */
function targets(mode,seed){var r=mulberry(seed*7+mode*1013+3),t=[];for(var i=0;i<5;i++){if(mode===0)t.push(Math.round(Math.exp(LMIN+r()*(LMAX-LMIN))*100)/100);else if(mode===1)t.push(Math.round((4+r()*12)*10)/10);else t.push(Math.round(Math.exp((r()*2-1)*Math.log(2.6))*100)/100)}return t}
function fmt(n,d){return n.toFixed(d)}
var COMM=[[9.9,'Tú y el tono sois la misma cosa.'],[9.3,'Oído de otro planeta.'],[8,'Muy muy cerca.'],[6,'Bastante bien.'],[3.5,'Se te acerca, más o menos.'],[0,'Ni de lejos. Otra vez.']];
var COMM1=[[9.9,'Tienes un reloj dentro.'],[9.3,'Casi exacto.'],[8,'Muy buen pulso.'],[6,'No está mal.'],[3.5,'Te has ido un poco.'],[0,'El tiempo vuela. O no.']];
var COMM2=[[9.9,'Ojo clínico. Perfecto.'],[9.3,'Casi idéntica.'],[8,'Muy buena vista.'],[6,'Aceptable.'],[3.5,'La memoria visual engaña.'],[0,'Eso no se parece.']];
function comment(s){var l=[COMM,COMM1,COMM2][S.mode];for(var i=0;i<l.length;i++)if(s>=l[i][0])return l[i][1];return''}
function score(mode,tg,v){if(mode===0){var c=Math.abs(1200*Math.log(v/tg)/Math.LN2);if(c<4)return 10;return Math.round(10*Math.max(0,1-c/320)*Math.max(0,1-c/320)*100)/100}if(mode===1){var e=Math.abs(v-tg);return Math.round(10*Math.max(0,1-2*e/tg)*100)/100}var e2=Math.abs(Math.log(v/tg));return Math.round(10*Math.max(0,1-e2/.5)*100)/100}
/* ---------- pantallas ---------- */

function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
function bestStr(){var o=[];for(var m=0;m<3;m++){var b=0;try{b=+localStorage.getItem('af_best'+m)||0}catch(e){}o.push(MODES[m]+' '+(b?fmt(b,2):'—'))}return 'Mejores: '+o.join('  ·  ')}
function home(){S.phase='home';viz.shape=null;toneStop();show('home');$('best').textContent=bestStr();var c=S.chal;var el=$('chal');if(c){el.style.display='block';el.innerHTML='<b>'+c.n+'</b> te reta en <b>'+MODES[c.m]+'</b> con <b>'+fmt(c.t,2)+'</b> / 50. ¿Puedes superarlo?'}else el.style.display='none'}
document.querySelectorAll('.mb').forEach(function(b){b.onclick=function(){var m=+b.dataset.m;S.name=($('nm').value||'').trim().slice(0,12)||'Jugador';try{localStorage.setItem('af_name',S.name)}catch(e){}audio();var seed=(S.chal&&S.chal.m===m)?S.chal.r:Math.floor(Math.random()*900000)+100000;startGame(m,seed)}});

/* ---------- ronda ---------- */
function setUI(o){$('cnt').textContent=o.cnt==null?(S.round+1)+' / 5':o.cnt;$('big').textContent=o.big||'';$('sub').textContent=o.sub||'';$('inst').innerHTML=o.inst||'';$('hint').textContent=o.hint||'';$('tgt').style.display=o.tgt?'block':'none';if(o.tgt)$('tv').innerHTML=o.tgt;$('you').style.display=o.you!=null?'block':'none';if(o.you!=null)$('you').innerHTML=o.you;$('go').classList.toggle('off',!!o.off);$('go').style.display=o.nogo?'none':'flex'}
var tmr=null;function clr(){if(tmr){clearInterval(tmr);tmr=null}S.cb=null}

 var txt=[['IGUALA LA FRECUENCIA DE SONIDO','Se reproducirá un tono. Memorízalo. Después tendrás que reproducirlo arrastrando el dedo arriba y abajo.'],['PARA EL RELOJ EN '+fmt(tg,1)+' SEGUNDOS','Cuando pulses empezar, el tiempo correrá sin que lo veas. Pulsa → cuando creas que han pasado '+fmt(tg,1)+' s.'],['REPRODUCE LA PROPORCIÓN DE LA FORMA','Verás una forma unos segundos. Luego tendrás que recrearla de memoria arrastrando arriba y abajo.']][m];

  tmr=setInterval(function(){left=4.6-(performance.now()-t0)/1000;if(left<=0){clr();toneStop();viz.ampT=.08;setUI({big:'listo',nogo:true});setTimeout(play,900)}else $('big').textContent=fmt(left,1)},60)}

function play(){var m=S.mode,tg=S.tg[S.round];S.phase='play';
 if(m===0){var f0=tg*(Math.random()<.5?1.7:1/1.7);f0=clamp(f0,FMIN*1.05,FMAX*.95);S.val=f0;toneStart(f0);viz.freq=f0;viz.ampT=.55;setUI({big:'ya',you:fmt(f0,2)+'<small>Hz</small>',hint:'Arrastra arriba y abajo',nogo:false});bindDrag()}

gm.addEventListener('pointermove',function(e){if(!S.drag||!S.drag.on||S.phase!=='play')return;var dy=(S.drag.y-e.clientY)/Math.max(260,H*.6);
 if(S.mode===0){var lf=Math.log(S.drag.v)+dy*(LMAX-LMIN)*1.0;lf=clamp(lf,LMIN,LMAX);S.val=Math.exp(lf);toneSet(S.val);viz.freq=S.val;$('you').innerHTML=fmt(S.val,2)+'<small>Hz</small>'}
 else if(S.mode===2){var lq=Math.log(S.drag.v)+dy*Math.log(5.2);lq=clamp(lq,-Math.log(2.8),Math.log(2.8));S.val=Math.exp(lq);viz.shape={q:S.val};$('you').innerHTML=fmt(S.val,2)+'<small>×</small>'}});
function endDrag(){if(S.drag)S.drag.on=false}gm.addEventListener('pointerup',endDrag);gm.addEventListener('pointercancel',endDrag);
/* ---------- resultados y ranking ---------- */
function total(a){var t=0;a.forEach(function(x){t+=x});return Math.round(t*100)/100}
function lbKey(){return 'af_lb_'+S.mode+'_'+S.seed}
function lbLoad(){try{return JSON.parse(localStorage.getItem(lbKey())||'[]')}catch(e){return[]}}
function lbSave(a){try{localStorage.setItem(lbKey(),JSON.stringify(a))}catch(e){}}
function results(){S.phase='res';toneStop();viz.shape=null;show('res');var t=total(S.scores);var lb=lbLoad();
 var seedC=S.chal&&S.chal.m===S.mode&&S.chal.r===S.seed?S.chal:null;
 if(seedC&&!lb.some(function(x){return x.n===seedC.n&&x.t===seedC.t&&!x.me}))lb.push({n:seedC.n,s:seedC.s,t:seedC.t,me:0});
 lb.push({n:S.name||'Jugador',s:S.scores.slice(),t:t,me:1,id:Date.now()});lb.sort(function(a,b){return b.t-a.t});lb=lb.slice(0,12);lbSave(lb);
 var bk='af_best'+S.mode,b=0;try{b=+localStorage.getItem(bk)||0}catch(e){}if(t>b){try{localStorage.setItem(bk,t)}catch(e){}}
 var rank=lb.findIndex(function(x){return x.me&&x.t===t});$('rt').textContent=MODES[S.mode]+' · '+fmt(t,2)+' / 50';$('rsb').textContent=(t>b?'¡Nuevo récord personal! ':'')+(lb.length>1?'Puesto '+(rank+1)+' de '+lb.length+' en este reto.':'Comparte el enlace y reta a alguien con las mismas rondas.');
 var h='';lb.forEach(function(x,i){var mine=x.me&&x.t===t&&x.id!==undefined&&rank===i;h+='<div class="rw'+(mine?' me':'')+'"><div class="h"><span>'+(i+1)+'. '+esc(x.n)+(x.me?'<i>tú</i>':'<i style="background:rgba(255,255,255,.25);color:#fff">reto</i>')+'</span><b>'+fmt(x.t,2)+' /50</b></div><canvas data-i="'+i+'"></canvas><div class="sp">'+x.s.map(function(v){return '<div>'+fmt(v,2)+'</div>'}).join('')+'</div></div>'});$('rows').innerHTML=h;
 $('rows').querySelectorAll('canvas').forEach(function(c){var x=lb[+c.dataset.i];c.width=c.clientWidth*DPR;c.height=34*DPR;var q=c.getContext('2d');q.scale(DPR,DPR);var w=c.clientWidth;x.s.forEach(function(v,j){var cx2=(j+.5)*w/5;q.strokeStyle='rgba(90,235,215,.9)';q.lineWidth=1.3;q.beginPath();var a=2+v*1.4;for(var y=0;y<=34;y+=1){var xx=cx2+Math.sin(y*.5+j*2)*a*Math.sin(y/34*3.14159);if(y===0)q.moveTo(xx,y);else q.lineTo(xx,y)}q.stroke()})});
 S.lastShare={m:S.mode,r:S.seed,n:S.name,t:t,s:S.scores.slice()}}
function esc(s){return String(s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function linkFor(x){var u=location.href.split('?')[0].split('#')[0];return u+'?m='+x.m+'&r='+x.r+'&n='+encodeURIComponent(x.n)+'&s='+x.s.join(',')}
$('share').onclick=function(){var x=S.lastShare;if(!x)return;var url=linkFor(x);var txt='Te reto en AFINADO ('+MODES[x.m]+'): saqué '+fmt(x.t,2)+' / 50. ¿Me ganas?';if(navigator.share){navigator.share({title:'AFINADO',text:txt,url:url}).catch(function(){copy(url)})}else copy(url)};
function copy(u){var done=function(){toast('Enlace copiado')};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(done,function(){fb(u)})}else fb(u);function fb(u){var ta=document.createElement('textarea');ta.value=u;ta.style.cssText='position:fixed;left:-999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('No se pudo copiar')}document.body.removeChild(ta)}}
$('again').onclick=function(){var seed=Math.floor(Math.random()*900000)+100000;startGame(S.mode,seed)};
$('menu').onclick=function(){home()};
/* ---------- enlace de reto ---------- */
(function(){var q=location.search.slice(1);if(!q)return;var o={};q.split('&').forEach(function(p){var k=p.split('=');o[k[0]]=decodeURIComponent(k[1]||'')});var m=+o.m,r=+o.r;if(isNaN(m)||isNaN(r)||m<0||m>2||!o.s)return;var s=o.s.split(',').map(Number);if(s.length!==5||s.some(isNaN))return;S.chal={m:m,r:r,n:(o.n||'Alguien').slice(0,12),s:s,t:total(s)}})();
home();
})();
</script></body></html>
