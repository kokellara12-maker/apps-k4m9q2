<!doctype html><html lang="es"><head><script src="mute.js"></script><script src="progress.js"></script><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script><script src="bgm.js" data-track="isla"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#06304a"><title>Barco Pirata</title></head><body><script src="gk.js"></script><script>
(function(){
var S=GK.store.get('s',{g:0,tot:0,u:{c:0,k:0,v:0,b:0},ts:Date.now()}),t,boss,bt,trip,ships,msg;
var UP=[['c','🧑‍✈️ Tripulación','+ oro/seg',function(l){return 15*Math.pow(1.55,l)}],['k','💣 Cañones','+ daño',function(l){return 25*Math.pow(1.6,l)}],['v','⛵ Velas','+ velocidad',function(l){return 40*Math.pow(1.7,l)}],['b','🏴‍☠️ Botín','x oro',function(l){return 120*Math.pow(2,l)}]];
function gps(){return (1+S.u.c*2.2)*(1+S.u.b*.5)*(1+S.u.v*.15)}
function dmg(){return 5+S.u.k*4}
GK.start({title:'Barco Pirata',icon:'🏴‍☠️',color:'#ffd23a',bg:'#06304a',help:'Tu barco navega solo y gana oro. Toca los botones para mejorar. Cuando aparece un <b>barco enemigo</b>, toca sin parar para hundirlo y llevarte su botín 💰',
reset:function(){var off=Math.min(3600,(Date.now()-(S.ts||Date.now()))/1000);if(off>10){var g=Math.floor(off*gps()*.3);S.g+=g;S.tot+=g;msg='Mientras no estabas: +'+g+'💰'}else msg='';t=0;boss=null;bt=20;trip=0;ships=[];GK.setScore(S.tot);GK.commit()},
down:function(x,y){var W=GK.W(),H=GK.H();for(var i=0;i<UP.length;i++){var bx=10+(i%2)*(W/2-5),by=H-170+Math.floor(i/2)*78,bw=W/2-15;if(GK.hit(x,y,bx,by,bw,70)){var l=S.u[UP[i][0]],c=Math.round(UP[i][3](l));if(S.g>=c){S.g-=c;S.u[UP[i][0]]++;GK.beep(900,.1,'triangle',.08,400);save()}else GK.beep(150,.1,'square',.05);return}}
 if(boss){boss.hp-=dmg();GK.float(x,y,'-'+dmg(),'#fff',20);GK.beep(200,.06,'sawtooth',.06,-80);GK.burst(x,y,4,'#f84',140,.3);GK.shake(2);if(boss.hp<=0){var rw=Math.round(boss.rw);S.g+=rw;S.tot+=rw;GK.float(GK.W()/2,H*.35,'+'+rw+'💰','#ffd23a',34);GK.burst(boss.x,boss.y,30,'#fc3',260);GK.beep(900,.3,'triangle',.1,500);boss=null;bt=25;save()}}
 else{S.g+=1;S.tot+=1;GK.float(x,y,'+1','#fc6',14)}},
update:function(dt){var W=GK.W(),H=GK.H();t+=dt;var g=gps()*dt;S.g+=g;S.tot+=g;trip+=dt*(.1+S.u.v*.03);
 if(Math.floor(trip)>this.lt){this.lt=Math.floor(trip);var b=Math.round(gps()*8);S.g+=b;S.tot+=b;GK.float(W*.8,H*.3,'¡Isla! +'+b+'💰','#7df',22)}this.lt=Math.floor(trip);
 if(!boss){bt-=dt;if(bt<=0){var lv=1+Math.floor(S.tot/2500);boss={x:W*.72,y:H*.34,hp:40*lv+dmg()*8,mx:40*lv+dmg()*8,rw:Math.max(40,gps()*35),t:20};GK.beep(250,.4,'sawtooth',.1,-100)}}else{boss.t-=dt;boss.x=W*.72+Math.sin(t*1.5)*12;if(boss.t<=0){boss=null;bt=20;GK.float(W/2,H*.3,'¡Se escapó!','#f88',24)}}
 GK.setScore(S.tot);this.sv=(this.sv||0)+dt;if(this.sv>3){this.sv=0;save();GK.commit()}},
draw:function(c,W,H){var g=c.createLinearGradient(0,0,0,H*.6);g.addColorStop(0,'#58c4ee');g.addColorStop(1,'#b8ecff');c.fillStyle=g;c.fillRect(0,0,W,H*.6);c.fillStyle='#ffe58a';c.beginPath();c.arc(W*.2,H*.12,28,0,7);c.fill();
 c.fillStyle='#1a7aa8';c.fillRect(0,H*.38,W,H);for(var k=0;k<3;k++){c.fillStyle='rgba(255,255,255,'+(.15+k*.08)+')';for(var x=-60;x<W+60;x+=50)c.fillRect(x+((t||0)*(20+k*15))%50,H*.4+k*30+Math.sin(x+(t||0)*2)*4,28,3)}
 var bx=W*.28,by=H*.36+Math.sin((t||0)*2)*5;c.save();c.translate(bx,by);c.rotate(Math.sin((t||0)*1.6)*.05);c.fillStyle='#7a4a24';c.beginPath();c.moveTo(-50,-4);c.lineTo(50,-4);c.lineTo(36,26);c.lineTo(-36,26);c.fill();c.fillStyle='#4a2a10';c.fillRect(-2,-70,4,68);c.fillStyle='#f4eedd';c.beginPath();c.moveTo(2,-68);c.lineTo(40,-34);c.lineTo(2,-14);c.fill();c.fillStyle='#111';c.fillRect(-2,-78,18,10);c.fillStyle='#fff';c.font='9px serif';c.fillText('☠',2,-70);c.restore();
 if(boss){c.save();c.translate(boss.x,H*.36+Math.sin(t*2+1)*5);c.scale(-1,1);c.fillStyle='#3a2a2a';c.beginPath();c.moveTo(-56,-4);c.lineTo(56,-4);c.lineTo(40,30);c.lineTo(-40,30);c.fill();c.fillStyle='#111';c.fillRect(-2,-76,4,72);c.fillStyle='#a33';c.beginPath();c.moveTo(2,-74);c.lineTo(46,-38);c.lineTo(2,-16);c.fill();c.restore();GK.rr(boss.x-50,H*.36-100,100,10,5,'#400');GK.rr(boss.x-50,H*.36-100,100*Math.max(0,boss.hp/boss.mx),10,5,'#e44');GK.text('¡TOCA! '+Math.ceil(boss.t)+'s',boss.x,H*.36-120,16,'#fff')}
 else GK.text('Próximo enemigo en '+Math.ceil(bt)+'s',W/2,H*.36-110,14,'#fff');
 GK.text('💰 '+Math.floor(S.g),W/2,H*.5+10,30,'#ffd23a');GK.text('+'+gps().toFixed(1)+'/s',W/2,H*.5+44,16,'#fff');if(msg)GK.text(msg,W/2,H*.5+70,14,'#cfe');
 for(var i=0;i<UP.length;i++){var bx=10+(i%2)*(W/2-5),by=H-170+Math.floor(i/2)*78,bw=W/2-15,l=S.u[UP[i][0]],cst=Math.round(UP[i][3](l)),ok=S.g>=cst;GK.rr(bx,by,bw,70,14,ok?'#ffd23a':'#2a4a5a');GK.text(UP[i][1],bx+bw/2,by+20,14,ok?'#2a1a00':'#9bc',null,false);GK.text('Nv '+l+' · '+UP[i][2],bx+bw/2,by+40,11,ok?'#4a3500':'#7ab','center',false);GK.text('💰 '+cst,bx+bw/2,by+58,14,ok?'#2a1a00':'#fc6','center',false)}}});
function save(){S.ts=Date.now();GK.store.set('s',S)}
})();

</script></body></html>
