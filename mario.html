function draw(c,W,H){TS=H/10;var ts=TS,T0=performance.now()/1000,OFF=H-ROWS*TS;

 // nubes

 var x0=Math.floor(cam)-1,x1=Math.ceil(cam+W/ts)+1;
 // castillo
 for(var yy=0;yy<ROWS;yy++)for(var xx=x0;xx<=x1;xx++){var ch=get(xx,yy);if(ch==='.')continue;var bump=0;blocks.forEach(function(b){if(b.x===xx&&b.y===yy)bump=-Math.sin(b.t/.2*Math.PI)*ts*.3});drawTile(c,ch,xx*ts-cm,yy*ts+bump,ts,T0)}

 if(msgT>0)GK.text(msg,W/2,H*.3,32,'#fff');

function pad(c,x,y,w,h,txt,on){c.fillStyle=on?'rgba(255,120,60,.7)':'rgba(20,20,30,.45)';c.beginPath();c.arc(x+w/2,y+h/2,w/2,0,7);c.fill();c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=2;c.stroke();GK.text(txt,x+w/2,y+h/2,txt.length>1?13:30,'#fff','center',false)}
var pts={};
function hitBtn(x,y){var W=GK.W(),H=GK.H(),by=H-84;function inn(bx,byy,w,h){return Math.hypot(x-(bx+w/2),y-(byy+h/2))<w/2+8}if(inn(16,by,70,70))return 'l';if(inn(96,by,70,70))return 'r';if(inn(W-96,by,80,80))return 'j';if(inn(W-186,by+8,66,66))return 'run';return null}
function recalc(){btn.l=btn.r=btn.j=btn.run=0;for(var k in pts){var b=hitBtn(pts[k][0],pts[k][1]);if(b)btn[b]=1}}
function down(x,y,e){pts[e.pointerId]=[x,y];recalc()}function move(x,y,e){if(pts[e.pointerId]){pts[e.pointerId]=[x,y];recalc()}}function up(x,y,e){delete pts[e.pointerId];recalc()}
