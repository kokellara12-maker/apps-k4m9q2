<!doctype html>
<html lang="es">
<head><script src="mute.js"></script><script src="progress.js"></script><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f4ee">
<title>Teoría Musical</title>
<style>
:root{--bg:#f6f4ee;--ink:#222;--dim:#8a877f;--line:#d8d4c8;--card:#fdfcf8;--f:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;touch-action:none}
body{background-image:radial-gradient(#d9d5c9 1px,transparent 1px);background-size:14px 14px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px);gap:10px;overflow-y:auto;touch-action:pan-y}
.w{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between}
.top b{font-weight:500;font-size:15px}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font:inherit;font-size:16px;color:var(--ink);text-decoration:none;flex:none;touch-action:manipulation}
.ic.on{background:#111;color:#fff;border-color:#111}
.ic.dis{opacity:.35}
#cv{width:100%;aspect-ratio:1.28;background:var(--card);border:1px solid var(--line);border-radius:6px;touch-action:none;display:block}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.sw{flex:1;max-width:36px;aspect-ratio:1;border-radius:50%;border:0;padding:0;touch-action:manipulation;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #111}
.tg{display:flex;align-items:center;gap:10px;font-size:14px}
.tgb{width:54px;height:30px;border-radius:99px;border:1px solid var(--line);background:#fff;position:relative;touch-action:manipulation}
.tgb::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#222;transition:left .15s}
.tgb.on{background:#222}.tgb.on::after{left:27px;background:#fff}
#tmp{flex:1;accent-color:#222;touch-action:pan-x}
.bpm{width:56px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:14px;color:var(--dim)}
.get{align-self:center;background:#d9482b;color:#fff;border:0;border-radius:99px;font:inherit;font-size:15px;padding:12px 28px;margin-top:6px;text-decoration:none}
.foot{font-size:12px;color:var(--dim);text-align:center;line-height:1.5}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:85vh;overflow:auto;touch-action:pan-y}
.sheet h2{font-size:17px;font-weight:600;margin:0 0 10px}
.sheet p{font-size:13px;color:var(--dim);margin:4px 0 12px;line-height:1.5}
.f{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.f select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink);touch-action:manipulation}
.bt{display:block;width:100%;margin-top:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;padding:13px;border-radius:14px;color:var(--ink);touch-action:manipulation}
.bt.pri{background:#d9482b;color:#fff;border-color:#d9482b}
.slot{display:flex;gap:8px;margin-top:8px}.slot .bt{margin:0;flex:1}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"><div class="w">
 <div class="top"><a class="ic" href="index.html">←</a><b>@teoria_musical</b><button class="ic" id="help">?</button></div>
 <canvas id="cv"></canvas>
 <div class="row" id="tools">
  <button class="ic on" id="pen" title="Lápiz">✎</button><button class="ic" id="era" title="Goma">⌫</button><button class="ic" id="und">↶</button><button class="ic" id="red">↷</button><button class="ic" id="clr" title="Borrar todo">⟳</button><button class="ic" id="rnd" title="Al azar">⤮</button>
 </div>
 <div class="row" id="cols"></div>
 <div class="tg"><button class="tgb" id="inst"></button><span>El instrumento <span id="lk">🔒</span></span></div>
 <div class="row"><button class="ic" id="rew">⏮</button><button class="ic" id="play">▶</button><input type="range" id="tmp" min="50" max="220" value="120"><div class="bpm" id="tv">120</div></div>
 <div class="row"><div style="display:flex;gap:8px" id="octs"></div><div style="display:flex;gap:8px" id="dots"></div><button class="ic" id="cloud">☁</button></div>
 <div class="row" style="justify-content:flex-start"><button class="ic" id="send">➤</button><button class="ic" id="sets">▦</button></div>
 <button class="get" id="prem">⭐ Premium</button>
 <div class="foot">un instrumento visual · dibuja y suena<br>versión propia hecha para Koke</div>
</div></div>
<div id="modal"><div class="sheet" id="sh"></div></div>
<div id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES={'Mayor':[0,2,4,5,7,9,11],'Menor':[0,2,3,5,7,8,10],'Pentatónica mayor':[0,2,4,7,9],'Pentatónica menor':[0,3,5,7,10],'Menor armónica':[0,2,3,5,7,8,11],'Dórica':[0,2,3,5,7,9,10],'Frigia':[0,1,3,5,7,8,10],'Lidia':[0,2,4,6,7,9,11],'Mixolidia':[0,2,4,5,7,9,10],'Blues':[0,3,5,6,7,10]};
const SWING={'No':0,'Suave':.15,'Medio':.25,'Fuerte':.33};
const COLS=['#1f9d73','#d9482b','#7b6fe0','#ee9b2b','#3a56c7','#e0529c','#6fb0e8','#2b2b2b','#f0b27a'];
const INST=['Piano','Marimba','Sintetizador','Pluck','Bajo','Campanas','Flauta','Tambor','Kalimba'];
const DOTS=[8,16,32];
let premium=false;try{premium=localStorage.getItem('mt_prem')==='1'}catch(e){}
const S={key:0,scale:'Pentatónica mayor',oct:1,dots:1,sw:'No',bpm:120,col:0,tool:'pen',inst:false,met:false,play:false,strokes:[]};
try{const o=JSON.parse(localStorage.getItem('mt_s2')||'{}');['key','scale','oct','dots','sw','bpm','col','inst','met'].forEach(k=>{if(k in o)S[k]=o[k]});S.strokes=o.strokes||[]}catch(e){}
if(!premium)S.inst=false;
let hist=[],fut=[];
function save(){try{localStorage.setItem('mt_s2',JSON.stringify(S,['key','scale','oct','dots','sw','bpm','col','inst','met','strokes','c','p']))}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
const clone=a=>JSON.parse(JSON.stringify(a));
function commit(){hist.push(S._snap||'[]');if(hist.length>60)hist.shift();fut=[];S._snap=JSON.stringify(S.strokes);rebuild();save()}
S._snap=JSON.stringify(S.strokes);
Object.defineProperty(S,'_snap',{enumerable:false,writable:true,value:JSON.stringify(S.strokes)});

/* ---------- audio ---------- */
let AC,comp,master;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.85;comp.connect(master);master.connect(AC.destination)}if(AC.state!=='running')AC.resume();return AC}
const mf=m=>440*Math.pow(2,(m-69)/12);
function env(ctx,g,t,v,a,dec,sus,end,rel){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(Math.max(.0001,v*sus),t+a+dec);g.gain.setTargetAtTime(0,end,rel)}
function osc(ctx,ty,f,t,e,dest,a,det){const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.value=f;if(det)o.detune.value=det;g.gain.value=a;o.connect(g);g.connect(dest);o.start(t);o.stop(e);return o}
function voice(ctx,dest,ins,midi,t,dur,vel){
 vel=(vel||.8);let f=mf(midi);const out=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.connect(out);out.connect(dest);
 const end=t+Math.max(dur,.15);
 switch(ins){
 case 1:{lp.frequency.value=f*6;env(ctx,out,t,vel*.5,.003,.5,.05,t+.12,.12);osc(ctx,'sine',f,t,t+2.5,lp,1);osc(ctx,'sine',f*4,t,t+.4,lp,.35);break}
 case 2:{lp.frequency.setValueAtTime(400,t);lp.frequency.linearRampToValueAtTime(3000,t+.25);env(ctx,out,t,vel*.22,.04,.3,.7,end,.25);osc(ctx,'sawtooth',f,t,end+2,lp,1,-7);osc(ctx,'sawtooth',f,t,end+2,lp,1,7);break}
 case 3:{lp.frequency.setValueAtTime(f*8,t);lp.frequency.exponentialRampToValueAtTime(f*1.5,t+.3);env(ctx,out,t,vel*.4,.002,.45,.02,t+.1,.1);osc(ctx,'sawtooth',f,t,t+1.2,lp,1);osc(ctx,'square',f*.5,t,t+1.2,lp,.3);break}
 case 4:{f/=2;lp.frequency.value=700;env(ctx,out,t,vel*.7,.01,.3,.5,end,.12);osc(ctx,'triangle',f,t,end+1,lp,1);osc(ctx,'sine',f*2,t,end+1,lp,.3);break}
 case 5:{lp.frequency.value=9000;env(ctx,out,t,vel*.3,.002,1.2,.01,t+.2,.4);osc(ctx,'sine',f*2,t,t+2.5,lp,1);osc(ctx,'sine',f*5.4,t,t+1.2,lp,.3);osc(ctx,'sine',f*8.1,t,t+.8,lp,.12);break}
 case 6:{lp.frequency.value=f*4;env(ctx,out,t,vel*.4,.05,.1,.85,end,.1);const o=osc(ctx,'sine',f,t,end+1,lp,1),l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=5.5;lg.gain.value=f*.006;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(end+1);const n=ctx.createBufferSource();break}
 case 7:{const fq=Math.max(50,f/3);const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(fq*2.2,t);o.frequency.exponentialRampToValueAtTime(fq,t+.12);g.gain.setValueAtTime(vel*.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(out);o.start(t);o.stop(t+.4);lp.frequency.value=3000;break}
 case 8:{lp.frequency.value=f*5;env(ctx,out,t,vel*.5,.002,.5,.02,t+.1,.15);osc(ctx,'sine',f,t,t+1.5,lp,1);osc(ctx,'sine',f*5.9,t,t+.15,lp,.25);break}
 default:{lp.frequency.setValueAtTime(Math.min(9000,f*9),t);lp.frequency.exponentialRampToValueAtTime(Math.max(600,f*2.2),t+.5);env(ctx,out,t,vel*.3,.006,.25,.45,end,.18);[[1,'sine',1],[2,'sine',.45],[3,'triangle',.2],[4,'sine',.1]].forEach(([m,ty,a])=>osc(ctx,ty,f*m,t,end+1,lp,a))}}
}
function click(ctx,dest,t,acc){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.06)}

/* ---------- escala y notas ---------- */
let ROWS=[];
function rows(){const iv=SCALES[S.scale],base=48+S.key,o=[];for(let k=0;k<S.oct;k++)iv.forEach(x=>o.push(base+12*k+x));o.push(base+12*S.oct);return o}
let NOTE=[];// por paso: [{m,i}]
const N=()=>DOTS[S.dots-1];
function rowOf(y){const R=ROWS.length;return Math.max(0,Math.min(R-1,R-1-Math.floor(y*R)))}
function rebuild(){ROWS=rows();const n=N();NOTE=Array.from({length:n},()=>[]);
 S.strokes.forEach(s=>{const by={};s.p.forEach(([x,y])=>{const c=Math.max(0,Math.min(n-1,Math.floor(x*n)));(by[c]=by[c]||[]).push(y)});
  for(const c in by){const y=by[c].reduce((a,b)=>a+b,0)/by[c].length,m=ROWS[rowOf(y)];const L=NOTE[c];if(!L.some(z=>z.m===m&&z.i===s.c))L.push({m,i:s.c})}});draw()}
const inst=i=>S.inst&&premium?i:0;

/* ---------- canvas ---------- */
const cv=$('#cv'),g=cv.getContext('2d');let W=0,H=0,DPR=1;
function size(){const r=cv.getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;draw()}
function draw(){if(!W)return;g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);
 const R=ROWS.length,n=N();
 for(let r=0;r<R;r++){const y=H-(r+.5)/R*H;g.strokeStyle=(r%(SCALES[S.scale].length)===0)?'rgba(0,0,0,.09)':'rgba(0,0,0,.04)';g.lineWidth=1;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
 for(let c=0;c<=n;c+=n/4){g.strokeStyle='rgba(0,0,0,.07)';g.beginPath();g.moveTo(c/n*W,0);g.lineTo(c/n*W,H);g.stroke()}
 g.lineCap='round';g.lineJoin='round';g.lineWidth=4;
 S.strokes.concat(cur?[cur]:[]).forEach(s=>{g.strokeStyle=COLS[s.c];g.fillStyle=COLS[s.c];if(s.p.length===1){g.beginPath();g.arc(s.p[0][0]*W,s.p[0][1]*H,2.4,0,7);g.fill();return}g.beginPath();s.p.forEach(([x,y],i)=>i?g.lineTo(x*W,y*H):g.moveTo(x*W,y*H));g.stroke()});
 if(S.play&&sq.length){const now=AC.currentTime;let p=null;for(let i=sq.length-1;i>=0;i--)if(sq[i].t<=now){p=sq[i];break}
  if(p){const x=((p.i+Math.min(1,(now-p.t)/p.d))/n)*W;g.fillStyle='#111';g.fillRect(x-.75,0,1.5,H);
   NOTE[p.i%n]&&NOTE[p.i%n].forEach(z=>{const r=ROWS.indexOf(z.m);g.fillStyle='#111';g.beginPath();g.arc(x,H-(r+.5)/ROWS.length*H,4,0,7);g.fill()})}}
 g.fillStyle='rgba(0,0,0,.3)';g.font='10px monospace';ROWS.forEach((m,r)=>{if(r%SCALES[S.scale].length===0)g.fillText(NOTES[m%12]+(Math.floor(m/12)-1),3,H-(r+.5)/ROWS.length*H-3)})}
let cur=null,lastRow=-1;
function pt(e){const r=cv.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
function preview(y){const r=rowOf(y);if(r!==lastRow){lastRow=r;const c=ac();voice(c,comp,inst(S.col),ROWS[r],c.currentTime,.3,.7)}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();cv.setPointerCapture(e.pointerId);const p=pt(e);
 if(S.tool==='pen'){S._snap=JSON.stringify(S.strokes);cur={c:S.col,p:[p]};lastRow=-1;preview(p[1])}else{S._snap=JSON.stringify(S.strokes);erase(p);cur=null}draw()});
cv.addEventListener('pointermove',e=>{if(!e.buttons&&e.pointerType==='mouse')return;const p=pt(e);if(S.tool==='pen'&&cur){const l=cur.p[cur.p.length-1];if(Math.hypot((p[0]-l[0])*W,(p[1]-l[1])*H)>2){cur.p.push(p);preview(p[1]);draw()}}else if(S.tool==='era'&&e.buttons!==0||S.tool==='era'&&e.pointerType!=='mouse'){erase(p)}});
function up(e){if(cur){S.strokes.push(cur);cur=null;hist.push(S._snap);fut=[];S._snap=JSON.stringify(S.strokes);rebuild();save()}else if(S.tool==='era'&&S._snap!==JSON.stringify(S.strokes)){hist.push(S._snap);fut=[];S._snap=JSON.stringify(S.strokes);save()}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function erase(p){const rr=.05,out=[];let ch=false;
 S.strokes.forEach(s=>{let seg=[];s.p.forEach(q=>{if(Math.hypot((q[0]-p[0])*W,(q[1]-p[1])*H)<16){ch=true;if(seg.length)out.push({c:s.c,p:seg});seg=[]}else seg.push(q)});if(seg.length)out.push({c:s.c,p:seg})});
 if(ch){S.strokes=out;rebuild()}}
addEventListener('resize',size);

/* ---------- barra ---------- */
function setTool(t){S.tool=t;$('#pen').classList.toggle('on',t==='pen');$('#era').classList.toggle('on',t==='era')}
$('#pen').onclick=()=>setTool('pen');$('#era').onclick=()=>setTool('era');
$('#und').onclick=()=>{if(!hist.length)return;fut.push(JSON.stringify(S.strokes));S.strokes=JSON.parse(hist.pop());S._snap=JSON.stringify(S.strokes);rebuild();save()};
$('#red').onclick=()=>{if(!fut.length)return;hist.push(JSON.stringify(S.strokes));S.strokes=JSON.parse(fut.pop());S._snap=JSON.stringify(S.strokes);rebuild();save()};
$('#clr').onclick=()=>{if(!S.strokes.length)return;hist.push(JSON.stringify(S.strokes));fut=[];S.strokes=[];S._snap='[]';rebuild();save();toast('Borrado')};
$('#rnd').onclick=()=>{hist.push(JSON.stringify(S.strokes));fut=[];const n=N(),out=[];let y=.5;for(let c=0;c<n;c+=(Math.random()<.5?1:2)){y=Math.max(.05,Math.min(.95,y+(Math.random()-.5)*.35));const x=(c+.5)/n;out.push({c:S.col,p:[[x-.01,y],[x+.01,y]]})}S.strokes=out;S._snap=JSON.stringify(out);rebuild();save();toast('🎲 Melodía al azar')};
function buildCols(){const c=$('#cols');c.innerHTML='';COLS.forEach((k,i)=>{const b=document.createElement('button');b.className='sw'+(i===S.col?' on':'');b.style.background=k;b.onclick=()=>{S.col=i;setTool('pen');buildCols();save()};c.appendChild(b)})}
function buildNums(){const o=$('#octs'),d=$('#dots');o.innerHTML='';d.innerHTML='';[1,2,3].forEach(n=>{const b=document.createElement('button');b.className='ic'+(S.oct===n?' on':'');b.textContent=n;b.onclick=()=>{S.oct=n;rebuild();buildNums();save()};o.appendChild(b)});
 [1,2,3].forEach(n=>{const b=document.createElement('button');b.className='ic'+(S.dots===n?' on':'');b.textContent='•'.repeat(n);b.onclick=()=>{S.dots=n;rebuild();buildNums();save()};d.appendChild(b)})}
function sync(){$('#inst').classList.toggle('on',S.inst&&premium);$('#lk').textContent=premium?'':'🔒';$('#prem').textContent=premium?'⭐ Premium activo':'⭐ Premium · 1,99 €'; $('#tv').textContent=S.bpm;$('#tmp').value=S.bpm}
$('#inst').onclick=()=>{if(!premium)return showPrem();S.inst=!S.inst;sync();save();toast(S.inst?'Cada color = un instrumento':'Todo con piano')};
$('#prem').onclick=()=>showPrem();
$('#help').onclick=()=>sheet(`<h2>¿Cómo va?</h2><p>✎ Dibuja en el lienzo: arriba = agudo, abajo = grave. Izquierda → derecha es el tiempo. Cada color es un instrumento (Premium).<br><br>1·2·3 = octavas. •·••·••• = cuántas notas caben (más puntos = más rápido).<br>▦ ajustes (tonalidad, escala, swing, metrónomo, tap, MIDI) · ☁ guardar · ➤ exportar.</p><button class="bt" onclick="document.getElementById('modal').classList.remove('show')">Vale</button>`);
$('#tmp').oninput=e=>{S.bpm=+e.target.value;$('#tv').textContent=S.bpm;save()};

/* ---------- reproducir ---------- */
let sq=[],stepI=0,nextT=0,tm=null;
const stepDur=()=>240/S.bpm/N(); // 4 pulsos por vuelta
function swo(i){return i%2===1?SWING[S.sw]*stepDur()*2:0}
function tick(){const c=AC;while(nextT<c.currentTime+.12){const n=N(),i=stepI%n,d=stepDur(),t=nextT+swo(i);
  if(S.met&&i%(n/4)===0)click(c,master,nextT,i===0);
  (NOTE[i]||[]).forEach(z=>voice(c,comp,inst(z.i),z.m,t,d*1.6,.8));
  sq.push({t:nextT,i,d});if(sq.length>40)sq.shift();nextT+=d;stepI=(stepI+1)%n}}
function start(){const c=ac();S.play=true;stepI=stepI%N();nextT=c.currentTime+.05;sq=[];tm=setInterval(tick,25);$('#play').textContent='⏸';$('#play').classList.add('on');(function f(){if(S.play){draw();requestAnimationFrame(f)}})()}
function stop(){S.play=false;clearInterval(tm);$('#play').textContent='▶';$('#play').classList.remove('on');draw()}
$('#play').onclick=()=>S.play?stop():start();
$('#rew').onclick=()=>{stepI=0;if(S.play){nextT=AC.currentTime+.05;sq=[]}};

/* ---------- ajustes / premium / nube / exportar ---------- */
function sheet(h){$('#sh').innerHTML=h;$('#modal').classList.add('show')}
const close=()=>$('#modal').classList.remove('show');
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')close()});
function showPrem(){sheet(`<h2>⭐ Premium</h2><p>${premium?'Ya lo tienes todo desbloqueado.':'Gratis: todo el lienzo, escalas, octavas, exportar. Premium: <b>El instrumento</b> (cada color suena como un instrumento: piano, marimba, sintetizador, pluck, bajo, campanas, flauta, tambor y kalimba), MIDI externo y guardar varias ranuras.'}</p><button class="bt pri" id="px">${premium?'Volver a gratis':'⭐ Activar Premium'}</button><p style="font-size:11px">App personal: es un interruptor local, sin pagos.</p>`);
 $('#px').onclick=()=>{premium=!premium;try{localStorage.setItem('mt_prem',premium?'1':'0')}catch(e){}if(!premium)S.inst=false;sync();initMidi();close();toast(premium?'⭐ Premium activado':'Modo gratis')}}
$('#sets').onclick=()=>{const o=(a,c)=>a.map(x=>`<option ${x==c?'selected':''}>${x}</option>`).join('');
 sheet(`<h2>Ajustes</h2><div class="f">Tonalidad<select id="sk">${NOTES.map((n,i)=>`<option value="${i}" ${i==S.key?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="f">Escala<select id="ss">${o(Object.keys(SCALES),S.scale)}</select></div>
 <div class="f">Swing<select id="sw">${o(Object.keys(SWING),S.sw)}</select></div>
 <div class="f">Metrónomo<button class="tgb ${S.met?'on':''}" id="sm"></button></div>
 <div class="f">Tap tempo<button class="bt" style="width:auto;margin:0;padding:9px 18px" id="st">👆 Tap</button></div>
 <div class="f">MIDI externo ${premium?'':'🔒'}<span style="font-size:12px;color:var(--dim)">${premium?(navigator.requestMIDIAccess?'activo':'no disponible aquí'):'Premium'}</span></div>
 <button class="bt" onclick="document.getElementById('modal').classList.remove('show')">Listo</button>`);
 $('#sk').onchange=e=>{S.key=+e.target.value;rebuild();save()};$('#ss').onchange=e=>{S.scale=e.target.value;rebuild();save()};$('#sw').onchange=e=>{S.sw=e.target.value;save()};
 $('#sm').onclick=e=>{S.met=!S.met;e.target.classList.toggle('on',S.met);save()};
 let taps=[];$('#st').onclick=()=>{const n=performance.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];taps.push(n);if(taps.length>1){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);S.bpm=Math.max(50,Math.min(220,Math.round(60000/iv)));sync();save()}}};
function slotKey(i){return'mt_slot'+i}
$('#cloud').onclick=()=>{const n=premium?4:1;let h='<h2>☁ Guardar / abrir</h2><p>Se guarda en este móvil (funciona sin internet).</p>';
 for(let i=1;i<=4;i++){const lock=i>n;let has=false;try{has=!!localStorage.getItem(slotKey(i))}catch(e){}h+=`<div class="slot"><button class="bt ${lock?'':''}" data-s="${i}" data-a="save">${lock?'🔒':'💾'} Ranura ${i}</button><button class="bt" data-s="${i}" data-a="load" ${has&&!lock?'':'style="opacity:.4"'}>Abrir</button></div>`}
 sheet(h+'<button class="bt" onclick="document.getElementById(\'modal\').classList.remove(\'show\')">Cerrar</button>');
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(i>n)return showPrem();
  if(b.dataset.a==='save'){try{localStorage.setItem(slotKey(i),JSON.stringify({strokes:S.strokes,key:S.key,scale:S.scale,oct:S.oct,dots:S.dots,bpm:S.bpm}));toast('💾 Guardado')}catch(e){toast('No se pudo guardar')}}
  else{try{const o=JSON.parse(localStorage.getItem(slotKey(i)));if(!o)return;hist.push(JSON.stringify(S.strokes));Object.assign(S,o);S._snap=JSON.stringify(S.strokes);rebuild();buildNums();sync();save();close();toast('Abierto')}catch(e){}}})};
function evList(){const n=N(),d=240/S.bpm/n,l=[];NOTE.forEach((L,i)=>L.forEach(z=>l.push({t:i*d+swo(i),d:d*1.6,m:z.m,i:inst(z.i)})));return l}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
$('#send').onclick=()=>{sheet(`<h2>➤ Exportar</h2><p>Tu dibujo convertido en música.</p><button class="bt" id="xw">💾 Audio WAV</button><button class="bt" id="xm">🎼 Archivo MIDI</button><button class="bt" onclick="document.getElementById('modal').classList.remove('show')">Cerrar</button>`);
 $('#xw').onclick=async()=>{const l=evList();if(!l.length)return toast('Dibuja algo primero ✎');toast('Creando WAV…');const loop=240/S.bpm,sr=44100,oc=new OfflineAudioContext(2,Math.ceil((loop*2+1.5)*sr),sr),cp=oc.createDynamicsCompressor();cp.connect(oc.destination);
  for(let r=0;r<2;r++)l.forEach(e=>voice(oc,cp,e.i,e.m,e.t+r*loop,e.d,.8));
  const b=await oc.startRendering(),a=b.getChannelData(0),a2=b.getChannelData(1),n=b.length,dv=new DataView(new ArrayBuffer(44+n*4)),ws=(o,s)=>[...s].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  for(let i=0;i<n;i++){dv.setInt16(44+i*4,Math.max(-1,Math.min(1,a[i]))*32767,true);dv.setInt16(46+i*4,Math.max(-1,Math.min(1,a2[i]))*32767,true)}download(new Blob([dv],{type:'audio/wav'}),'mi-dibujo.wav');toast('✅ WAV listo')};
 $('#xm').onclick=()=>{const l=evList();if(!l.length)return toast('Dibuja algo primero ✎');const PPQ=480,tr=[],vl=n=>{const b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b},ev=[],q=S.bpm/60*PPQ;
  l.forEach(e=>{const a=Math.round(e.t*q);ev.push([a,0x90,e.m,100],[a+Math.round(e.d*q*.6),0x80,e.m,0])});ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const us=Math.round(60e6/S.bpm);tr.push(0,0xff,0x51,3,us>>16&255,us>>8&255,us&255);let last=0;ev.forEach(e=>{tr.push(...vl(e[0]-last),e[1],e[2],e[3]);last=e[0]});tr.push(0,0xff,0x2f,0);
  const h=[0x4d,0x54,0x68,0x64,0,0,0,6,0,0,0,1,PPQ>>8,PPQ&255,0x4d,0x54,0x72,0x6b,tr.length>>24&255,tr.length>>16&255,tr.length>>8&255,tr.length&255];download(new Blob([new Uint8Array([...h,...tr])],{type:'audio/midi'}),'mi-dibujo.mid');toast('✅ MIDI listo')}};
let midiOn=false;
function initMidi(){if(!premium||midiOn||!navigator.requestMIDIAccess)return;navigator.requestMIDIAccess().then(a=>{midiOn=true;const hook=()=>a.inputs.forEach(i=>i.onmidimessage=m=>{const[s,n,v]=m.data;if((s&0xf0)===0x90&&v>0){const c=ac();voice(c,comp,inst(S.col),n,c.currentTime,.4,v/127)}});hook();a.onstatechange=hook}).catch(()=>{})}
initMidi();

buildCols();buildNums();sync();ROWS=rows();size();rebuild();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
