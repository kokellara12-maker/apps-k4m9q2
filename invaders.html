<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<body><script>
/* ===== Core común para los clásicos ===== */
const Core=(cfg)=>{
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const col=cfg.color||'#35e0ff';
const css=`
:root{--acc:${col};--ink:#fff;--dim:rgba(255,255,255,.62);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#070b1f;color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,rgba(10,20,60,.35),rgba(4,6,20,.86))}
.hide{display:none!important}
.card{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.logo{font-size:clamp(44px,14vw,70px);font-weight:900;font-style:italic;letter-spacing:.02em;line-height:.95;background:linear-gradient(180deg,#fff 0,var(--acc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px var(--acc))}
.tag{color:var(--dim);font-weight:800;letter-spacing:.4em;font-size:12px;margin-top:-2px}
.sub{color:var(--dim);font-size:14px;line-height:1.4}
.btn{border:0;font:inherit;color:#06122e;font-weight:900;font-size:20px;padding:16px 34px;border-radius:18px;background:linear-gradient(180deg,#fff,var(--acc));box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation;width:100%;text-decoration:none;display:block}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;font-size:16px;padding:13px;font-weight:700}
.hi{font-size:13px;letter-spacing:.2em;color:var(--dim);font-weight:700}.hi b{color:#ffd23f;font-size:20px;letter-spacing:.05em}
.tips{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;font-size:14px;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px 14px;width:100%}
.tips i{font-style:normal}
a.back{position:fixed;z-index:20;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 10px);padding:8px 14px;border-radius:999px;color:#fff;text-decoration:none;font-weight:600;font-size:15px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#pbtn{position:fixed;z-index:9;right:calc(env(safe-area-inset-right) + 14px);top:calc(env(safe-area-inset-top) + 14px);width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;touch-action:manipulation}
#pbtn i{display:block;width:5px;height:16px;background:#fff;border-radius:2px;box-shadow:10px 0 0 #fff;margin-right:10px}
#big{font-size:46px;font-weight:900}.new{color:#ffd23f;font-weight:800}
`;
const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
const tips=(cfg.tips||[]).map(t=>`<i>${t[0]}</i><span>${t[1]}</span>`).join('');
document.body.insertAdjacentHTML('afterbegin',`
<canvas id="c"></canvas><div id="sat" style="position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden"></div>
<a class="back" id="back" href="index.html">‹ Apps</a>
<button id="pbtn" class="hide" aria-label="Pausa"><i></i></button>
<div class="ov" id="title"><div class="card">
 <div class="logo">${cfg.name}</div><div class="tag">${cfg.tag||''}</div>
 <div class="hi">RÉCORD <b id="hi1">0</b></div>
 <div class="tips">${tips}</div>
 <button class="btn" id="play">JUGAR</button>
</div></div>
<div class="ov hide" id="pause"><div class="card">
 <div class="logo" style="font-size:44px">PAUSA</div>
 <button class="btn" id="resume">Continuar</button>
 <button class="btn ghost" id="restart">Reiniciar</button>
 <button class="btn ghost" id="snd">Sonido: SÍ</button>
 <a class="btn ghost" href="index.html">‹ Volver a Apps</a>
</div></div>
<div class="ov hide" id="over"><div class="card">
 <div class="logo" style="font-size:46px">FIN</div>
 <div id="big">0</div><div id="newrec" class="new hide">★ ¡NUEVO RÉCORD! ★</div>
 <div class="sub" id="osub"></div>
 <button class="btn" id="again">OTRA VEZ</button>
 <a class="btn ghost" href="index.html">‹ Volver a Apps</a>
</div></div>`);
document.title=cfg.name;
const cv=$('c'),cx=cv.getContext('2d');
const C={cx,cv,vw:0,vh:0,dpr:1,t:0,state:'title',score:0,hudR:'',hi:store.get(cfg.id+'-hi',0),shake:0,flash:0,game:null,store,top:70,bot:20,cfg};
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
C.rnd=rnd;C.ri=ri;C.clamp=clamp;
C.rr=(x,y,w,h,r)=>{cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()};
C.font=(w,s)=>`${w} ${s}px ${getComputedStyle(document.body).fontFamily}`;
$('hi1').textContent=C.hi.toLocaleString('es-ES');
function resize(){C.dpr=Math.min(window.devicePixelRatio||1,2.5);C.vw=innerWidth;C.vh=innerHeight;cv.width=Math.round(C.vw*C.dpr);cv.height=Math.round(C.vh*C.dpr);const sp=getComputedStyle($('sat'));C.sat=parseFloat(sp.paddingTop)||0;C.sab=parseFloat(sp.paddingBottom)||0;C.top=70+C.sat;if(C.game&&C.game.resize)C.game.resize()}
addEventListener('resize',resize);

// ---------- audio ----------
const A={ctx:null,mute:store.get('clasicos-mute',false),on:false,step:0,next:0,mus:null};
C.A=A;
C.ainit=()=>{
  if(!A.ctx){try{A.ctx=new (window.AudioContext||window.webkitAudioContext)();A.master=A.ctx.createGain();A.master.gain.value=.55;A.master.connect(A.ctx.destination);
    const n=A.ctx.sampleRate*1.2,b=A.ctx.createBuffer(1,n,A.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;A.noise=b}catch(e){}}
  if(A.ctx&&A.ctx.state!=='running')A.ctx.resume();
};
C.tone=(f,dur,type,vol,slide,delay)=>{
  if(!A.ctx||A.mute)return;const t=A.ctx.currentTime+(delay||0),o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.2,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+.02);
};
C.nz=(dur,vol,fc,q,delay)=>{
  if(!A.ctx||A.mute)return;const t=A.ctx.currentTime+(delay||0),s=A.ctx.createBufferSource(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();
  s.buffer=A.noise;f.type='bandpass';f.frequency.value=fc||2000;f.Q.value=q||.8;g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(A.master);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
};
C.click=()=>C.tone(660,.06,'triangle',.12);
C.chime=()=>[0,4,7,12].forEach((s,i)=>C.tone(392*Math.pow(2,s/12),.26,'triangle',.16,0,i*.09));
C.sadder=()=>[392,330,262,196].forEach((f,i)=>C.tone(f,.35,'sawtooth',.12,-10,i*.2));
// música: cfg.music={bpm,bass:[semitonos],arp:[semitonos],root,wave}
function music(){
  const m=cfg.music;if(!m||!A.ctx||A.mute||!A.on)return;
  const t=A.ctx.currentTime;if(A.next<t-.3)A.next=t;const sp=60/m.bpm/2;
  while(A.next<t+.25){
    const s=A.step,b=m.bass[(s>>1)%m.bass.length],a=m.arp[s%m.arp.length];
    if(s%2===0){const o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type='triangle';o.frequency.value=m.root/2*Math.pow(2,b/12);g.gain.setValueAtTime(.0001,A.next);g.gain.linearRampToValueAtTime(.1,A.next+.01);g.gain.exponentialRampToValueAtTime(.0001,A.next+sp*1.8);o.connect(g);g.connect(A.master);o.start(A.next);o.stop(A.next+sp*2)}
    {const o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type=m.wave||'square';o.frequency.value=m.root*Math.pow(2,(a+b)/12);g.gain.setValueAtTime(.0001,A.next);g.gain.linearRampToValueAtTime(.028,A.next+.005);g.gain.exponentialRampToValueAtTime(.0001,A.next+sp*.9);o.connect(g);g.connect(A.master);o.start(A.next);o.stop(A.next+sp)}
    if(s%4===2){const sN=A.ctx.createBufferSource(),f=A.ctx.createBiquadFilter(),g=A.ctx.createGain();sN.buffer=A.noise;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(.045,A.next);g.gain.exponentialRampToValueAtTime(.0001,A.next+.05);sN.connect(f);f.connect(g);g.connect(A.master);sN.start(A.next);sN.stop(A.next+.06)}
    A.step++;A.next+=sp;
  }
}
setInterval(music,80);

// ---------- partículas ----------
const parts=[],pops=[];
C.burst=(x,y,n,cols,o)=>{o=o||{};for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(o.smin||40,o.smax||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s+(o.vy||0),life:rnd(.35,o.life||.9),max:o.life||.9,col:cols[ri(0,cols.length-1)],size:rnd(o.s0||2,o.s1||5),g:o.g==null?300:o.g,add:o.add!==false,sq:!!o.sq,rot:rnd(0,6)})}};
C.pop=(x,y,txt,colr,size)=>pops.push({x,y,t:0,txt,col:colr||'#ffe27a',size:size||22});
C.addScore=(n,x,y,colr)=>{C.score+=n;if(x!=null)C.pop(x,y,'+'+n,colr)};
C.doShake=v=>{C.shake=Math.max(C.shake,v)};
function drawParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const a=Math.min(1,p.life/p.max*1.6);cx.globalAlpha=a;cx.fillStyle=p.col;
    cx.save();cx.globalCompositeOperation=p.add?'lighter':'source-over';
    if(p.sq){cx.translate(p.x,p.y);cx.rotate(p.rot+C.t*8);cx.fillRect(-p.size,-p.size,p.size*2,p.size*2)}else{cx.beginPath();cx.arc(p.x,p.y,p.size,0,6.283);cx.fill()}
    cx.restore()}
  cx.globalAlpha=1;
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;if(p.t>1){pops.splice(i,1);continue}
    cx.globalAlpha=1-Math.max(0,p.t-.65)/.35;cx.font=C.font(900,p.size);cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='rgba(10,5,40,.85)';cx.lineJoin='round';
    const yy=p.y-p.t*40;cx.strokeText(p.txt,p.x,yy);cx.fillStyle=p.col;cx.fillText(p.txt,p.x,yy)}
  cx.globalAlpha=1;
}
// ---------- fondo ----------
const stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*1.7+.4,p:Math.random()*6,z:Math.random()});
C.bg=(c1,c2,glow)=>{
  const g=cx.createLinearGradient(0,0,0,C.vh);g.addColorStop(0,c1);g.addColorStop(1,c2);cx.fillStyle=g;cx.fillRect(0,0,C.vw,C.vh);
  const r=cx.createRadialGradient(C.vw/2,C.vh*.45,10,C.vw/2,C.vh*.45,Math.max(C.vw,C.vh)*.7);r.addColorStop(0,glow||'rgba(53,224,255,.16)');r.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=r;cx.fillRect(0,0,C.vw,C.vh);
  for(const s of stars){cx.globalAlpha=.25+.4*Math.sin(C.t*(.8+s.z)+s.p)**2;cx.fillStyle='#fff';const y=((s.y*C.vh+C.t*(4+s.z*14))%C.vh);cx.fillRect(s.x*C.vw,y,s.s,s.s)}
  cx.globalAlpha=1;
};
C.glowRect=(x,y,w,h,r,color,blur)=>{cx.save();cx.shadowColor=color;cx.shadowBlur=blur||16;cx.fillStyle=color;C.rr(x,y,w,h,r);cx.fill();cx.restore()};
// ---------- HUD ----------
C.drawHud=()=>{
  const y=C.sat||0;
  const top=Math.max(10,y)+2,hw=Math.min(C.vw-76,420),hx=12+0,hy=top+22;
  cx.save();
  cx.fillStyle='rgba(8,16,50,.55)';C.rr(hx,hy-14,hw,46,16);cx.fill();cx.strokeStyle='rgba(255,255,255,.14)';cx.lineWidth=1;cx.stroke();
  cx.textAlign='left';cx.font=C.font(700,10);cx.fillStyle='rgba(255,255,255,.55)';cx.fillText('PUNTOS',hx+14,hy+1);
  cx.font=C.font(900,22);cx.fillStyle='#fff';cx.fillText(Math.round(C.score).toLocaleString('es-ES'),hx+14,hy+23);
  cx.textAlign='center';cx.font=C.font(700,10);cx.fillStyle='rgba(255,255,255,.55)';cx.fillText('RÉCORD',hx+hw*.5,hy+1);cx.font=C.font(800,17);cx.fillStyle='#ffd23f';cx.fillText(Math.max(C.hi,Math.round(C.score)).toLocaleString('es-ES'),hx+hw*.5,hy+22);
  if(C.hudR){cx.textAlign='right';cx.font=C.font(700,10);cx.fillStyle='rgba(255,255,255,.55)';cx.fillText(C.hudR[0],hx+hw-14,hy+1);cx.font=C.font(900,22);cx.fillStyle=col;cx.fillText(C.hudR[1],hx+hw-14,hy+23)}
  cx.restore();
  C.top=hy+44;
};
// ---------- flujo ----------
C.start=()=>{C.ainit();C.click();$('title').classList.add('hide');$('over').classList.add('hide');$('pause').classList.add('hide');$('back').classList.add('hide');$('pbtn').classList.remove('hide');
  C.score=0;C.hudR='';parts.length=0;pops.length=0;C.state='play';A.on=true;A.step=0;resize();C.game.init()};
C.over=(sub)=>{
  if(C.state==='over')return;C.state='over';A.on=false;$('pbtn').classList.add('hide');C.sadder();
  const sc=Math.round(C.score),rec=sc>C.hi;if(rec){C.hi=sc;store.set(cfg.id+'-hi',sc)}
  $('big').textContent=sc.toLocaleString('es-ES');$('newrec').classList.toggle('hide',!rec);$('osub').textContent=sub||'';$('hi1').textContent=C.hi.toLocaleString('es-ES');
  setTimeout(()=>{if(C.state==='over'){$('over').classList.remove('hide');$('back').classList.remove('hide')}},650);
};
C.pause=()=>{
  if(C.state==='pause'){C.state='play';A.on=true;$('pause').classList.add('hide');return}
  if(C.state!=='play')return;C.state='pause';A.on=false;$('pause').classList.remove('hide');if(C.game.blur)C.game.blur();
};
function sndL(){$('snd').textContent='Sonido: '+(A.mute?'NO':'SÍ')}sndL();
$('play').onclick=C.start;$('again').onclick=C.start;$('pbtn').onclick=()=>{C.ainit();C.pause()};$('resume').onclick=()=>{C.ainit();C.pause()};
$('restart').onclick=()=>{C.state='over';C.start()};
$('snd').onclick=()=>{C.ainit();A.mute=!A.mute;store.set('clasicos-mute',A.mute);sndL();C.click()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&C.state==='play')C.pause()});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
// ---------- entrada ----------
function pt(e){return [e.clientX,e.clientY]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();C.ainit();try{cv.setPointerCapture(e.pointerId)}catch(_){}if(C.state==='play'&&C.game.down)C.game.down(e.clientX,e.clientY,e.pointerId)});
cv.addEventListener('pointermove',e=>{if(C.state==='play'&&C.game.move)C.game.move(e.clientX,e.clientY,e.pointerId)});
const up=e=>{if(C.game.up&&C.state==='play')C.game.up(e.clientX,e.clientY,e.pointerId)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.repeat&&!(C.game.keyRepeat))return;C.ainit();if(e.code==='Escape'||e.code==='KeyP'){C.pause();return}if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();if(C.state==='play'&&C.game.key)C.game.key(e.code,true)});
addEventListener('keyup',e=>{if(C.game.key&&C.state==='play')C.game.key(e.code,false)});
// ---------- bucle ----------
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.033);last=now;
  if(C.state!=='pause')C.t+=dt;
  if(C.state==='play'){C.game.update(dt)}
  else if((C.state==='title'||C.state==='over')&&C.game.idle)C.game.idle(dt);
  if(C.shake>0&&C.state!=='pause')C.shake*=Math.exp(-dt*9);if(C.flash>0&&C.state!=='pause')C.flash-=dt;
  cx.setTransform(C.dpr,0,0,C.dpr,0,0);
  cx.save();if(C.shake>.2)cx.translate(rnd(-C.shake,C.shake),rnd(-C.shake,C.shake));
  C.game.draw(cx);drawParts(C.state==='pause'?0:dt);cx.restore();
  if(C.flash>0){cx.fillStyle=`rgba(255,255,255,${Math.min(.5,C.flash)})`;cx.fillRect(0,0,C.vw,C.vh)}
  if(C.state==='play'||C.state==='pause'||C.state==='over')C.drawHud();
  const v=cx.createRadialGradient(C.vw/2,C.vh/2,Math.min(C.vw,C.vh)*.4,C.vw/2,C.vh/2,Math.max(C.vw,C.vh)*.75);v.addColorStop(0,'rgba(0,0,10,0)');v.addColorStop(1,'rgba(0,0,10,.4)');cx.fillStyle=v;cx.fillRect(0,0,C.vw,C.vh);
}
C.run=(game)=>{C.game=game;resize();if(game.preview)game.preview();requestAnimationFrame(frame)};
window.__c=C;
return C;
};

const C=Core({id:'invaders',name:'INVASORES',tag:'NEÓN · ESPACIAL',color:'#5df2ff',
  tips:[['👆','Arrastra para mover la nave'],['🔫','Dispara sola, tú esquiva'],['🛸','El OVNI da puntos extra'],['🎁','Atrapa los power-ups']],
  music:{bpm:118,root:220,wave:'sawtooth',bass:[0,0,0,-2,-2,-2,-4,-4],arp:[0,3,7,3,0,3,8,3]}});
const {cx,rr}=C;
// sprites pixel (originales): 11x8
const SPR=[
 [ // calamar
  ['00100000100','00010001000','00111111100','01101110110','11111111111','10111111101','10100000101','00011011000'],
  ['00100000100','10010001001','10111111101','11101110111','11111111111','01111111110','00100000100','01000000010']],
 [ // cangrejo
  ['00011111000','01111111110','11111111111','11100100111','11111111111','00111011100','01100100110','11000000011'],
  ['00011111000','01111111110','11111111111','11100100111','11111111111','00011011000','00110110100','01100000110']],
 [ // pulpo
  ['00111111100','01111111110','11111111111','11011111011','11111111111','00110001100','01101110110','11000000011'],
  ['00111111100','01111111110','11111111111','11011111011','11111111111','00011011000','00110110110','01100000011']]
];
const ECOL=[['#ff7bd1','#c21f8f'],['#7bffb2','#18b865'],['#ffd86b','#e08a10']];
let W=360,H=600,ox=0,oy=0,ship,shots,eshots,aliens,shields,ufo,drops,level,lives,dirX,stepT,stepI,frame,fx,shootT,tx,msg,waveClear,did,deadT,invT,cell=0;
const COLS=9,ROWSN=5;
function area(){W=Math.min(C.vw-12,520);H=C.vh-C.top-(C.sab||0)-8;ox=(C.vw-W)/2;oy=C.top+2}
function buildWave(n){
  cell=Math.floor(W/(COLS+2.2));const sp=cell*1.02;
  aliens=[];for(let r=0;r<ROWSN;r++)for(let c=0;c<COLS;c++){const t=r===0?0:r<3?1:2;aliens.push({r,c,t,x:W*.06+c*sp,y:cell*1.2+r*sp*.88,hp:t===0&&n>2?2:1,flash:0})}
  dirX=1;stepT=0;stepI=Math.max(.14,.7-n*.05);frame=0;eshots=[];
  // refugios (rejilla de bloques)

}
function reset(){
  area();level=1;lives=3;fx={rapid:0,spread:0,shield:0};shots=[];drops=[];ufo=null;msg=null;waveClear=0;deadT=0;invT=0;shootT=0;tx=null;
  ship={x:W/2,y:H-cell*1.2,w:cell*1.2};buildWave(1);ship.y=H-cell*1.35;C.hudR=['OLEADA',1];
}
function nextWave(){level++;buildWave(level);shots=[];drops=[];C.hudR=['OLEADA',level];msg={t:1.8,txt:'OLEADA '+level};C.chime();invT=1.5}
function alienBounds(){let mn=1e9,mx=-1e9,my=-1e9;for(const a of aliens){mn=Math.min(mn,a.x);mx=Math.max(mx,a.x+cell*.85);my=Math.max(my,a.y+cell*.7)}return {mn,mx,my}}
function killAlien(a,i){
  aliens.splice(i,1);const pts=[30,20,10][a.t]*level;C.addScore(pts,ox+a.x+cell*.4,oy+a.y,ECOL[a.t][0]);
  const px=ox+a.x+cell*.42,py=oy+a.y+cell*.35;C.burst(px,py,16,[ECOL[a.t][0],'#fff',ECOL[a.t][1]],{g:100,sq:true,s0:1.5,s1:3.5,life:.7});C.tone(160,.15,'sawtooth',.14,-100);C.nz(.12,.25,1500);C.doShake(2);
  if(Math.random()<.1)drops.push({x:a.x+cell*.4,y:a.y,k:['R','S','H'][C.ri(0,2)]});

}
function hitShield(x,y,r){

  return false;
}
function fire(){
  const w=fx.spread>0?[-.22,0,.22]:[0];
  for(const a of w)shots.push({x:ship.x,y:ship.y-cell*.5,vx:a*340,vy:-H*1.25});
  C.tone(880,.05,'square',.06,-500);
}
function hurt(){
  if(invT>0)return;
  if(fx.shield>0){fx.shield=0;C.burst(ox+ship.x,oy+ship.y,24,['#5df2ff','#fff'],{});C.tone(300,.3,'triangle',.18,-200);invT=1;return}
  lives--;C.doShake(14);C.flash=.5;C.burst(ox+ship.x,oy+ship.y,40,['#5df2ff','#fff','#ff7b9c'],{g:100,s0:2,s1:5});C.tone(200,.7,'sawtooth',.2,-170);C.nz(.5,.4,700);
  eshots=[];C.hudR=['VIDAS','▲'.repeat(Math.max(0,lives))];deadT=1.1;invT=2.5;

}
function update(dt){

  if(deadT<0)return;
  if(deadT>0){deadT-=dt;for(const a of aliens)if(a.flash>0)a.flash-=dt;return}

    stepT=0;frame^=1;const b=alienBounds();const sp=cell*.28;
    if((dirX>0&&b.mx+sp>W-4)||(dirX<0&&b.mn-sp<4)){dirX*=-1;for(const a of aliens)a.y+=cell*.42;C.tone(100,.08,'square',.08)}

  }

  }

    if(!gone)for(let j=aliens.length-1;j>=0;j--){const a=aliens[j];if(s.x>a.x&&s.x<a.x+cell*.85&&s.y>a.y&&s.y<a.y+cell*.7){if(--a.hp>0){a.flash=.12;C.tone(300,.05,'square',.1)}else killAlien(a,j);gone=true;break}}
    if(gone)shots.splice(i,1);
  }
  for(let i=eshots.length-1;i>=0;i--){
    const s=eshots[i];s.y+=s.vy*dt;s.ph+=dt*14;let gone=s.y>H+10;

    if(!gone&&Math.abs(s.x-ship.x)<ship.w*.42&&Math.abs(s.y-ship.y)<cell*.5){hurt();gone=true}
    if(gone)eshots.splice(i,1);
  }
  // power-ups
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.y+=H*.18*dt;
    if(Math.abs(d.x-ship.x)<ship.w*.7&&Math.abs(d.y-ship.y)<cell*.7){
      if(d.k==='R')fx.rapid=10;else if(d.k==='S')fx.spread=10;else fx.shield=1e9;
      msg={t:1,txt:{R:'DISPARO RÁPIDO',S:'TRIPLE',H:'ESCUDO'}[d.k]};C.tone(700,.1,'triangle',.14,500);C.tone(1050,.14,'triangle',.14,400,.07);drops.splice(i,1);continue}
    if(d.y>H+10)drops.splice(i,1)}
  for(const a of aliens)if(a.flash>0)a.flash-=dt;
}
function drawAlien(a){
  const sp=SPR[a.t][frame],px=Math.max(2,Math.floor(cell*.085)),w=11*px,x=ox+a.x+(cell*.85-w)/2,y=oy+a.y;
  const c=ECOL[a.t];

  for(let r=0;r<8;r++)for(let q=0;q<11;q++){if(sp[r][q]==='1'){const g=r<3?c[0]:c[1];cx.fillStyle=a.flash>0?'#fff':(a.hp>1?'#fff':g);cx.fillRect(x+q*px,y+r*px,px+.5,px+.5)}}
  cx.shadowBlur=0;cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(x+2*px,y+px,px*5,px*.6);
  // ojos
  cx.fillStyle='#10152e';cx.fillRect(x+3*px,y+3*px,px,px*1.3);cx.fillRect(x+7*px,y+3*px,px,px*1.3);
  cx.restore();
}
function drawShip(){
  const x=ox+ship.x,y=oy+ship.y,w=ship.w;
  if(deadT>0||deadT<0)return;
  cx.save();cx.translate(x,y);if(invT>0&&Math.floor(C.t*14)%2)cx.globalAlpha=.4;
  // propulsor

  cx.beginPath();cx.moveTo(0,-w*.55);cx.lineTo(w*.14,-w*.1);cx.lineTo(w*.5,w*.28);cx.lineTo(w*.5,w*.4);cx.lineTo(w*.18,w*.3);cx.lineTo(0,w*.38);cx.lineTo(-w*.18,w*.3);cx.lineTo(-w*.5,w*.4);cx.lineTo(-w*.5,w*.28);cx.lineTo(-w*.14,-w*.1);cx.closePath();cx.fill();cx.shadowBlur=0;
  cx.fillStyle='#0d2a5a';cx.beginPath();cx.ellipse(0,-w*.05,w*.07,w*.17,0,0,6.3);cx.fill();cx.fillStyle='rgba(180,240,255,.8)';cx.beginPath();cx.ellipse(0,-w*.1,w*.03,w*.08,0,0,6.3);cx.fill();
  cx.fillStyle='#ff4d6d';cx.fillRect(-w*.5,w*.2,w*.07,w*.12);cx.fillRect(w*.43,w*.2,w*.07,w*.12);
  if(fx.shield>0){cx.strokeStyle=`rgba(93,242,255,${.5+.3*Math.sin(C.t*8)})`;cx.lineWidth=3;cx.shadowColor='#5df2ff';cx.shadowBlur=14;cx.beginPath();cx.arc(0,0,w*.78,0,6.3);cx.stroke();cx.fillStyle='rgba(93,242,255,.12)';cx.fill()}
  cx.restore();
}
function draw(){
  C.bg('#050a24','#0a1240','rgba(93,242,255,.12)');

  // marco
  cx.save();cx.shadowColor='rgba(93,242,255,.3)';cx.shadowBlur=22;cx.fillStyle='rgba(4,8,30,.55)';rr(ox-3,oy-3,W+6,H+6,16);cx.fill();cx.restore();
  cx.strokeStyle='rgba(93,242,255,.35)';cx.lineWidth=2;rr(ox,oy,W,H,14);cx.stroke();

  for(const s of shields){const k=s.hp/3;cx.fillStyle=`rgb(${Math.round(60+20*k)},${Math.round(150+105*k)},${Math.round(100+60*k)})`;cx.shadowColor='#7bffb2';cx.shadowBlur=4;cx.fillRect(ox+s.x,oy+s.y,s.w-.5,s.h-.5)}cx.shadowBlur=0;
  for(const a of aliens)drawAlien(a);
  if(ufo){const x=ox+ufo.x,y=oy+ufo.y;cx.save();cx.shadowColor='#ff7bd1';cx.shadowBlur=16;const g=cx.createLinearGradient(0,y-cell*.3,0,y+cell*.2);g.addColorStop(0,'#ffd0ef');g.addColorStop(1,'#c21f8f');cx.fillStyle=g;cx.beginPath();cx.ellipse(x+cell*.5,y,cell*.5,cell*.17,0,0,6.3);cx.fill();cx.fillStyle='#8fe9ff';cx.beginPath();cx.ellipse(x+cell*.5,y-cell*.13,cell*.22,cell*.15,0,Math.PI,0);cx.fill();
    for(let i=0;i<5;i++){cx.fillStyle=Math.floor(C.t*8+i)%2?'#fff27a':'#ff4d6d';cx.beginPath();cx.arc(x+cell*(.15+i*.175),y+cell*.03,cell*.03,0,6.3);cx.fill()}cx.restore()}
  for(const s of shots){cx.save();cx.globalCompositeOperation='lighter';cx.shadowColor='#5df2ff';cx.shadowBlur=10;cx.fillStyle='#bdf7ff';cx.fillRect(ox+s.x-1.5,oy+s.y-8,3,14);cx.restore()}
  for(const s of eshots){cx.save();cx.shadowColor='#ff4d6d';cx.shadowBlur=10;cx.strokeStyle='#ff9aa8';cx.lineWidth=3;cx.beginPath();for(let k=0;k<8;k++){const yy=oy+s.y+k*2,xx=ox+s.x+Math.sin(s.ph+k)*3;k?cx.lineTo(xx,yy):cx.moveTo(xx,yy)}cx.stroke();cx.restore()}

  drawShip();

}
function idle(dt){
  if(!aliens)reset();
  stepT+=dt;if(stepT>=stepI){stepT=0;frame^=1;const b=alienBounds(),sp=cell*.28;if((dirX>0&&b.mx+sp>W-4)||(dirX<0&&b.mn-sp<4)){dirX*=-1;for(const a of aliens)a.y+=cell*.2;if(b.my>H*.55)buildWave(1)}else for(const a of aliens)a.x+=dirX*sp}
  ship.x=W/2+Math.sin(C.t*.9)*W*.3;
  if(Math.random()<dt*2.5)shots.push({x:ship.x,y:ship.y-cell*.5,vx:0,vy:-H*1.25});
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.y+=s.vy*dt;let g=s.y<0;for(let j=aliens.length-1;j>=0&&!g;j--){const a=aliens[j];if(s.x>a.x&&s.x<a.x+cell*.85&&s.y>a.y&&s.y<a.y+cell*.7){aliens.splice(j,1);C.burst(ox+a.x+cell*.4,oy+a.y+cell*.3,8,['#fff',ECOL[a.t][0]],{life:.5});g=true}}if(g)shots.splice(i,1)}

function down(x,y,id){did=id;tx=x-ox}
function move(x,y,id){if(id===did)tx=x-ox}
function key(code,d){if(!d)return;if(code==='ArrowLeft'||code==='KeyA')tx=ship.x-W*.1;if(code==='ArrowRight'||code==='KeyD')tx=ship.x+W*.1}
C.run({init(){reset()},update,idle,draw,down,move,up(x,y,id){},key,keyRepeat:true,resize(){if(C.state!=='play')reset();else area()},preview(){reset()}});
window.__g={get aliens(){return aliens},get ship(){return ship},get lives(){return lives},get level(){return level},get shots(){return shots},set tx(v){tx=v},get W(){return W},hurt};
