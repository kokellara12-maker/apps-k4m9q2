<!doctype html><html lang="es"><head><script src="mute.js"></script><script src="progress.js"></script><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script><script src="bgm.js" data-track="pueblo"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2a2418"><title>Ciudad de Cartón</title></head><body><script src="gk.js"></script><script>
(function(){
var flashT=0,COLS=6,ROWS=8,grid,coins,pop,hap,sel,t,req,reqT,stormT,warn,demo,earn,TY=[['🏠','Casa',10],['🏪','Tienda',20],['🌳','Parque',15],['🏭','Fábrica',30],['🏫','Escuela',40]],S;
function cnt(k){var n=0;for(var r of grid)for(var c of r)if(c&&c.k===k)n++;return n}
function metrics(){pop=(cnt(0)*4+cnt(4)*2)*1;hap=Math.max(5,Math.min(100,50+cnt(2)*9+cnt(4)*7-cnt(3)*10-Math.max(0,pop-cnt(2)*10-30)))}
function cell(x,y){var W=GK.W(),H=GK.H(),cs=Math.min((W-20)/COLS,(H-290)/ROWS),x0=W/2-cs*COLS/2,y0=110;var cx=Math.floor((x-x0)/cs),cy=Math.floor((y-y0)/cs);return cx>=0&&cy>=0&&cx<COLS&&cy<ROWS?[cx,cy,cs,x0,y0]:null}
function save(){GK.store.set('c',{g:grid,coins:coins,earn:earn})}
GK.start({title:'Ciudad de Cartón',icon:'📦',color:'#e8b878',bg:'#2a2418',help:'Elige un edificio abajo y toca una casilla para construirlo. Casas = vecinos, tiendas y fábricas = monedas, parques = felicidad. Los vecinos piden cosas, llegan tormentas (toca el edificio roto para repararlo) y puedes 💥 demoler',
reset:function(){S=GK.store.get('c',null);grid=[];for(var r=0;r<ROWS;r++){grid.push([]);for(var c=0;c<COLS;c++)grid[r].push(S&&S.g&&S.g[r]?S.g[r][c]:null)}coins=S?S.coins:40;earn=S?S.earn:0;sel=0;demo=false;t=0;req=null;reqT=12;stormT=45;warn=[];metrics();GK.setScore(pop*10+Math.floor(earn/5));GK.commit()},
down:function(x,y){var W=GK.W(),H=GK.H();var bw=(W-30)/6;for(var i=0;i<5;i++)if(GK.hit(x,y,10+i*(bw+2),H-130,bw,70)){sel=i;demo=false;GK.beep(500,.04,'square',.05);return}
 if(GK.hit(x,y,10+5*(bw+2),H-130,bw,70)){demo=!demo;return}
 var k=cell(x,y);if(!k)return;var b=grid[k[1]][k[0]];
 if(demo){if(b){grid[k[1]][k[0]]=null;coins+=Math.round(TY[b.k][2]*.3);GK.burst(k[3]+(k[0]+.5)*k[2],k[4]+(k[1]+.5)*k[2],24,'#fc6',260);GK.shake(8);GK.beep(120,.3,'sawtooth',.1,-80);save()}return}
 if(b){if(b.hp<2&&coins>=5){coins-=5;b.hp=2;GK.beep(700,.1,'triangle',.07,300);GK.float(k[3]+(k[0]+.5)*k[2],k[4]+k[1]*k[2],'Reparado','#7f7',16);save()}return}
 if(coins>=TY[sel][2]){coins-=TY[sel][2];grid[k[1]][k[0]]={k:sel,hp:2};GK.beep(600,.1,'triangle',.07,300);GK.burst(k[3]+(k[0]+.5)*k[2],k[4]+(k[1]+.5)*k[2],8,'#e8b878',140);
  if(req&&req.k===sel){coins+=40;GK.float(GK.W()/2,150,'¡Petición cumplida! +40💰','#ffd23a',22);req=null;reqT=14}save()}else GK.beep(150,.1,'square',.05)},
update:function(dt){t+=dt;metrics();var inc=(cnt(1)*2+cnt(3)*6)*(.5+hap/100);coins+=inc*dt;earn+=inc*dt;reqT-=dt;
 if(!req&&reqT<=0){var k=GK.pick([0,1,2,4]);req={k:k,t:40};}if(req){req.t-=dt;if(req.t<=0){req=null;reqT=14;GK.float(GK.W()/2,150,'Vecinos enfadados','#f88',20)}}
 stormT-=dt;if(stormT<=0){stormT=45;warn=[];for(var i=0;i<3;i++)warn.push({x:GK.ri(0,COLS-1),y:GK.ri(0,ROWS-1),t:3})}
 for(var w of warn){w.t-=dt;if(w.t<=0&&!w.d){w.d=1;flashT=.35;var b=grid[w.y][w.x];GK.shake(12);GK.beep(100,.4,'sawtooth',.1,-60);if(b){b.hp--;if(b.hp<=0)grid[w.y][w.x]=null;save()}}}warn=warn.filter(function(w){return !(w.d&&w.t<-.6)});
 GK.setScore(pop*10+Math.floor(earn/5));this.sv=(this.sv||0)+dt;if(this.sv>3){this.sv=0;save();GK.commit()}},
draw:function(c,W,H){GK.sky(c,W,H,['#6ab0e0','#bfe0f0','#f4e8c8'],0,H*.5);GK.tileFill(c,GK.tex('grass','#5a8a3a'),0,H*.5,W,H*.5,2);var tq=performance.now()/1000;for(var i=0;i<3;i++)GK.cloud(c,((i*200+tq*12)%(W+200))-80,50+i*30,1+i*.2,.8);var cs=Math.min((W-20)/COLS,(H-290)/ROWS),x0=W/2-cs*COLS/2,y0=110;if(!grid)return;
 GK.tileFill(c,GK.tex('stone','#8a8a96'),x0-8,y0-8,cs*COLS+16,cs*ROWS+16,1);
 for(var r=0;r<ROWS;r++)for(var q=0;q<COLS;q++){var x=x0+q*cs,y=y0+r*cs;GK.tileFill(c,GK.tex('dirt',(r+q)%2?'#a8844a':'#9a7840'),x,y,cs,cs,1);c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1;c.strokeRect(x+.5,y+.5,cs-1,cs-1);var b=grid[r][q];if(b){c.fillStyle='rgba(0,0,0,.18)';c.fillRect(x+cs*.12,y+cs*.7,cs*.76,cs*.2);c.font=cs*.62+'px serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';c.save();if(b.hp<2){c.translate(x+cs/2,y+cs/2);c.rotate(.12);c.fillText(TY[b.k][0],0,0)}else c.fillText(TY[b.k][0],x+cs/2,y+cs/2);c.restore();if(b.hp<2){c.strokeStyle='#a33';c.lineWidth=2;c.beginPath();c.moveTo(x+cs*.3,y+cs*.2);c.lineTo(x+cs*.55,y+cs*.5);c.lineTo(x+cs*.4,y+cs*.8);c.stroke()}}}
 for(var w of warn){if(w.d)continue;var x=x0+w.x*cs,y=y0+w.y*cs;c.fillStyle='rgba(100,140,255,'+(.2+.2*Math.sin(t*10))+')';c.fillRect(x,y,cs,cs);c.font=cs*.5+'px serif';c.textAlign='center';c.fillText('⛈',x+cs/2,y+cs/2)}
 if(flashT>0){c.fillStyle='rgba(255,255,255,'+flashT+')';c.fillRect(0,0,W,H);flashT-=.025}GK.text('💰 '+Math.floor(coins),70,40,20,'#ffd23a');GK.text('👥 '+pop,W/2-30,40,20,'#fff');GK.text(hap>66?'😊':hap>33?'😐':'😠',W/2+40,40,24,'#fff');
 if(req)GK.text('Los vecinos piden: '+TY[req.k][0]+' ('+Math.ceil(req.t)+'s)',W/2,80,16,'#ffe9a0');else GK.text('Tormenta en '+Math.ceil(stormT)+'s',W/2,80,14,'#9bc');
 var bw=(W-30)/6;for(var i=0;i<5;i++){var ok=coins>=TY[i][2];GK.rr(10+i*(bw+2),H-130,bw,70,12,sel===i&&!demo?'#ffd23a':'#6a5a3a',sel===i&&!demo?'#fff':null,3);c.font='28px serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';c.fillText(TY[i][0],10+i*(bw+2)+bw/2,H-106);GK.text(TY[i][2]+'💰',10+i*(bw+2)+bw/2,H-76,13,ok?(sel===i&&!demo?'#2a1a00':'#ffd23a'):'#f77',null,false)}
 GK.rr(10+5*(bw+2),H-130,bw,70,12,demo?'#ff5a3a':'#6a5a3a',demo?'#fff':null,3);c.font='28px serif';c.fillStyle='#000';c.textAlign='center';c.fillText('💥',10+5*(bw+2)+bw/2,H-106);GK.text('Demoler',10+5*(bw+2)+bw/2,H-76,11,'#fff',null,false);
 GK.text(demo?'Toca un edificio para volarlo':TY[sel][1]+': toca una casilla',W/2,H-35,15,'#e8d0a0')}});
})();

</script></body></html>
