<!doctype html><html lang="es"><head><script src="mute.js"></script><script src="progress.js"></script><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script><script src="bgm.js" data-track="travieso"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2a1408"><title>Cocina Caótica</title></head><body><script src="gk.js"></script><script>
(function(){
var ING=['🍞','🥬','🍅','🥩','🧀','🥓'],orders,cur,lives,t,tm,spawnT,plate,done;
var layout=function(){var W=GK.W(),H=GK.H(),n=ING.length,bw=Math.min(76,(W-30)/3-6),rows=[];for(var i=0;i<n;i++)rows.push({x:W/2-(bw*1.5+6)+(i%3)*(bw+6),y:H-286+Math.floor(i/3)*(bw+8),w:bw,h:bw});return rows};
function newOrder(){var n=GK.ri(2,Math.min(5,2+Math.floor(done/4)));var r=[];for(var i=0;i<n;i++)r.push(GK.ri(0,ING.length-1));return{r:r,t:20-Math.min(9,done*.35),m:20-Math.min(9,done*.35),p:0}}
GK.start({title:'Cocina Caótica',icon:'🍔',color:'#ff7a45',bg:'#2a1408',help:'Mira el pedido de cada cliente y toca los ingredientes <b>en el mismo orden</b>. Pulsa 🔔 para servir. No dejes que se enfaden 😤',
reset:function(){orders=[newOrder()];lives=3;t=0;spawnT=6;plate=[];done=0;GK.setScore(0)},
down:function(x,y){var W=GK.W(),H=GK.H();var L=layout();for(var i=0;i<L.length;i++)if(GK.hit(x,y,L[i].x,L[i].y,L[i].w,L[i].h)){if(plate.length<7){plate.push(i);GK.beep(500+i*60,.05,'square',.05)}return}
 if(GK.hit(x,y,W/2-150,H-78,100,48)){plate=[];GK.beep(200,.08,'square',.05);return}
 if(GK.hit(x,y,W/2+50,H-78,100,48)){var ok=-1;for(var k=0;k<orders.length;k++){var o=orders[k];if(o.r.length===plate.length&&o.r.every(function(v,j){return v===plate[j]})){ok=k;break}}
  if(ok>=0){var o=orders.splice(ok,1)[0];var s=Math.round(10*o.r.length*(1+o.t/o.m));done++;GK.add(s);GK.float(W/2,H-330,'+'+s,'#ffd23a',30);GK.beep(900,.15,'triangle',.08,500);GK.burst(W/2,H-330,14,'#fc6',200)}else{GK.shake(8);GK.beep(150,.2,'sawtooth',.08,-60);GK.add(-3)}plate=[]}},
update:function(dt){t+=dt;spawnT-=dt;if(spawnT<=0&&orders.length<4){orders.push(newOrder());spawnT=Math.max(3,9-done*.2)}else if(spawnT<=0)spawnT=2;
 for(var i=orders.length-1;i>=0;i--){orders[i].t-=dt;if(orders[i].t<=0){orders.splice(i,1);lives--;GK.shake(10);GK.beep(180,.3,'sawtooth',.1,-90);if(lives<=0)GK.over('¡Clientes furiosos!')}}},
draw:function(c,W,H){c.fillStyle='#3a1d0c';c.fillRect(0,0,W,H);c.fillStyle='#5a3418';c.fillRect(0,H-300,W,300);c.fillStyle='#7a4a24';c.fillRect(0,H-304,W,6);
 if(!orders)return;var n=orders.length,cw=Math.min(90,(W-20)/Math.max(n,3)-6);
 for(var i=0;i<n;i++){var o=orders[i],x=W/2-(n*(cw+6))/2+i*(cw+6)+3,y=70,h=130,f=o.t/o.m;GK.rr(x,y,cw,h,12,'#fff6e0','#d9a');c.fillStyle=f>.5?'#6c6':f>.25?'#fc3':'#f55';c.fillRect(x+6,y+6,(cw-12)*f,6);
  c.font=Math.min(22,cw/2.4)+'px serif';c.textAlign='center';c.textBaseline='middle';for(var j=0;j<o.r.length;j++){c.fillStyle='#000';c.fillText(ING[o.r[j]],x+cw/2,y+30+j*18)}
  var mood=f>.5?'😊':f>.25?'😐':'😡';c.font='22px serif';c.fillText(mood,x+cw/2,y+h-10)}
 c.font='34px serif';c.textAlign='center';for(var i=0;i<plate.length;i++){c.fillText(ING[plate[i]],W/2-((plate.length-1)*18)+i*36,H-326)}
 c.strokeStyle='#fff6';c.lineWidth=2;c.beginPath();c.ellipse(W/2,H-318,120,16,0,0,7);c.stroke();
 var L=layout();for(var i=0;i<L.length;i++){var b=L[i];GK.rr(b.x,b.y,b.w,b.h,14,'#fff3dc');c.font=b.w*.55+'px serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';c.fillText(ING[i],b.x+b.w/2,b.y+b.h/2)}
 GK.btn(W/2-150,H-78,100,48,'🗑 Tirar','#c9a97a');GK.btn(W/2+50,H-78,100,48,'🔔 SERVIR','#7ddc6a');GK.text('❤'.repeat(Math.max(0,lives)),W/2,H-106,22,'#ff6a8a')}});
})();

</script></body></html>
