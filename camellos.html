<!doctype html><html lang="es"><head><script src="mute.js"></script><script src="progress.js"></script><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script><script src="bgm.js" data-track="persecucion"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3a2208"><title>Camellos Locos</title></head><body><script src="gk.js"></script><script>
(function(){
var rr,ob,pw,t,dist,y,vy,boost,rivals,item,fin,sp;
var PW=['🍌','🚀','🧲'];
GK.start({title:'Camellos Locos',icon:'🐪',color:'#ffa94d',bg:'#3a2208',help:'Toca para saltar los cactus. Recoge cajas ❓ para power-ups absurdos: 🚀 turbo, 🍌 plátano al rival, 🧲 imán. ¡Llega primero a la meta! 🐪',
reset:function(){t=0;dist=0;y=0;vy=0;boost=0;ob=[];pw=[];item=null;fin=3000;sp=300;rivals=[{x:0,v:1,c:'#caa',e:'🐫',slow:0},{x:0,v:1.04,c:'#aca',e:'🐪',slow:0},{x:0,v:.97,c:'#acf',e:'🐫',slow:0}];this.pos=1;this.ro=1},
down:function(x,y2){if(y<=0){vy=620;y=.01;GK.beep(500,.1,'square',.06,300)}
 if(item&&y2>GK.H()*.82){var W=GK.W();if(item==='🚀'){boost=2.2;GK.beep(300,.4,'sawtooth',.1,500)}else if(item==='🍌'){var best=null;for(var r of rivals)if(r.x>-1&&(!best||r.x>best.x))best=r;if(best){best.slow=2;GK.float(W*.6,GK.H()*.4,'¡Plátano!','#ffe14a',24)}}else{boost=1;pw.forEach(function(p){if(p.x<GK.W()+200)p.g=1;});GK.add(20)}item=null}},
update:function(dt){var W=GK.W(),H=GK.H();t+=dt;var base=sp*(1+boost*.5);if(boost>0)boost-=dt;dist+=base*dt;vy-=1600*dt;y+=vy*dt;if(y<0){y=0;vy=0}
 for(var r of rivals){var v=sp*r.v*(r.slow>0?.3:1)*(1+Math.sin(t*1.3+r.x)*.05);r.slow-=dt;r.x+=v*dt;r.pos=r.x-dist}
 if(!ob.length||ob[ob.length-1].x<dist+W+GK.rnd(160,300))ob.push({x:(ob.length?ob[ob.length-1].x:dist+W)+GK.rnd(240,420),h:GK.rnd(34,54),w:GK.rnd(18,26)});
 if(Math.random()<dt*.5)pw.push({x:dist+W+80,y:H*.55-GK.rnd(40,110)});
 var px=dist+W*.2;for(var o of ob)if(!o.h2&&px>o.x-14&&px<o.x+o.w+14&&y<o.h-8){o.h2=1;dist-=60;GK.shake(10);GK.beep(130,.2,'sawtooth',.08,-60);boost=0}
 for(var p of pw)if(!p.g&&Math.abs(px-p.x)<30&&Math.abs((H*.55-y)-p.y)<60){p.g=1;if(!item){item=GK.pick(PW);GK.beep(900,.1,'triangle',.08,400)}}
 pw=pw.filter(function(p){return !p.g&&p.x>dist-100});ob=ob.filter(function(o){return o.x>dist-100});
 var ahead=rivals.filter(function(r){return r.x>dist}).length;this.pos=1+ahead;GK.setScore(Math.floor(dist/10)+(4-this.pos)*0);
 if(dist>=fin){var pl=this.pos;GK.add([300,150,60,0][pl-1]||0);GK.over(pl===1?'¡Has ganado la carrera! 🏆':'Llegaste '+pl+'º')}else{for(var r of rivals)if(r.x>=fin&&!r.done){r.done=1}}},
draw:function(c,W,H){var g=c.createLinearGradient(0,0,0,H*.6);g.addColorStop(0,'#ffcf7a');g.addColorStop(1,'#ffe9b0');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#fff3c0';c.beginPath();c.arc(W*.8,H*.15,30,0,7);c.fill();
 c.fillStyle='#e8b45a';c.beginPath();c.moveTo(0,H*.55);for(var x=0;x<=W;x+=30)c.lineTo(x,H*.55-30-((x+(dist||0)*.15)%90<45?20:0));c.lineTo(W,H*.55);c.fill();c.fillStyle='#e0a040';c.fillRect(0,H*.55,W,H);c.fillStyle='#c98a2a';for(var x=-((dist||0)%80);x<W;x+=80)c.fillRect(x,H*.55+30,34,5);
 if(!ob)return;for(var o of ob){var x=o.x-dist;if(x<-40||x>W+40)continue;c.fillStyle='#2a8a3a';c.fillRect(x,H*.55-o.h,o.w,o.h);c.fillRect(x-8,H*.55-o.h*.6,10,6);c.fillRect(x+o.w-2,H*.55-o.h*.7,10,6)}
 for(var p of pw){var x=p.x-dist;c.font='28px serif';c.textAlign='center';c.textBaseline='middle';c.fillText('❓',x,H*.55-p.y)}
 var fx=fin-dist;if(fx<W+40){c.fillStyle='#fff';c.fillRect(fx,H*.4,6,H*.2);c.fillStyle='#000';for(var i=0;i<6;i++)c.fillRect(fx+(i%2)*6,H*.4+i*H*.2/6,6,H*.2/6)}
 rivals.forEach(function(r,i){var x=W*.2+(r.x-dist),yy=H*.55+i*0-2-(i+1)*18;if(x>-40&&x<W+40){c.font='44px serif';c.textAlign='center';c.textBaseline='bottom';c.save();c.translate(x,yy+30);c.scale(-1,1);c.fillText(r.e,0,0);c.restore();if(r.slow>0)c.fillText('🍌',x,yy-30)}});
 c.font='52px serif';c.textAlign='center';c.textBaseline='bottom';c.save();c.translate(W*.2,H*.55+36-y);c.scale(-1,1);c.fillText('🐪',0,0);c.restore();if(boost>0){c.fillStyle='rgba(255,140,40,.7)';c.fillRect(W*.2-70,H*.55-y-6,50,10)}
 GK.text('Puesto '+(this.pos||1)+'º',70,H-100,20,'#fff');GK.rr(20,H-50,W-40,10,5,'rgba(0,0,0,.4)');GK.rr(20,H-50,(W-40)*Math.min(1,(dist||0)/fin),10,5,'#ffd23a');
 if(item)GK.btn(W/2-50,H-100,100,40,item+' USAR','#ffd23a')}});
})();

</script></body></html>
