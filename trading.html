<style>
:root{--bg:#0b0e11;--p:#161a1e;--p2:#1e2329;--ln:#2b3139;--tx:#eaecef;--dm:#848e9c;--up:#0ecb81;--dn:#f6465d;--ye:#f0b90b;--bl:#4f8cff;--fn:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--fn);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;flex:0 0 auto}
#back{color:var(--dm);text-decoration:none;font-size:26px;line-height:1;padding:0 6px 3px 0}
#symBtn{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:7px 10px;font:800 15px var(--fn);display:flex;align-items:center;gap:6px}
#symBtn i{font-style:normal;color:var(--dm);font-size:10px}
#pr{margin-left:auto;text-align:right;line-height:1.15}
#pr b{font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#pr span{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
#news{flex:0 0 auto;margin:0 10px 6px;padding:5px 10px;border-radius:8px;background:var(--p);color:var(--dm);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--ye)}
#bar{display:flex;gap:4px;padding:0 10px 6px;flex:0 0 auto;align-items:center;overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.chip{border:0;background:transparent;color:var(--dm);font:700 12.5px var(--fn);padding:5px 9px;border-radius:7px;white-space:nowrap}
.chip.on{background:var(--p2);color:var(--ye)}
.sep{width:1px;height:16px;background:var(--ln);margin:0 4px;flex:0 0 auto}
#cw{flex:0 0 36%;min-height:210px;position:relative;touch-action:none;background:var(--bg);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
#ch{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#tabs{display:flex;flex:0 0 auto;background:var(--bg)}
#tabs button{flex:1;border:0;background:transparent;color:var(--dm);font:800 12.5px var(--fn);padding:11px 2px 9px;border-bottom:2px solid transparent}
#tabs button.on{color:var(--tx);border-bottom-color:var(--ye)}
#panel{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:10px 12px calc(env(safe-area-inset-bottom) + 18px);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.seg{display:flex;background:var(--p2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;border-radius:7px;background:transparent;color:var(--dm);font:800 13px var(--fn);padding:8px 4px}
.seg button.on{background:var(--ln);color:var(--tx)}
.seg button.buy.on{background:var(--up);color:#06231a}.seg button.sell.on{background:var(--dn);color:#fff}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.lbl{font-size:11.5px;color:var(--dm);margin:10px 0 4px;display:flex;justify-content:space-between}
.inp{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:9px;color:var(--tx);font:700 15px var(--fn);padding:10px 11px;outline:none;-webkit-user-select:text;user-select:text;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--ye)}
input[type=range]{width:100%;accent-color:var(--ye);margin:6px 0}
.pct{display:flex;gap:6px}.pct button{flex:1;border:1px solid var(--ln);background:var(--p);color:var(--dm);border-radius:7px;padding:6px 0;font:700 12px var(--fn)}
.sum{background:var(--p);border-radius:10px;padding:9px 11px;margin-top:10px;font-size:12px;color:var(--dm)}
.sum div{display:flex;justify-content:space-between;padding:2px 0}.sum b{color:var(--tx);font-variant-numeric:tabular-nums}
.go{width:100%;margin-top:12px;border:0;border-radius:11px;padding:14px;font:800 16px var(--fn);color:#fff}
.go.buy{background:var(--up);color:#06231a}.go.sell{background:var(--dn)}
.card{background:var(--p);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.card h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:7px}
.tag{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px}.tag.l{background:rgba(14,203,129,.16);color:var(--up)}.tag.s{background:rgba(246,70,93,.16);color:var(--dn)}.tag.n{background:var(--ln);color:var(--dm)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;font-size:11.5px;color:var(--dm)}.g b{display:block;color:var(--tx);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:1px}
.btns{display:flex;gap:6px;margin-top:9px}.btns button{flex:1;border:1px solid var(--ln);background:var(--p2);color:var(--tx);border-radius:8px;padding:8px 0;font:800 12.5px var(--fn)}
.btns button.r{background:rgba(246,70,93,.14);border-color:rgba(246,70,93,.4);color:var(--dn)}
.empty{text-align:center;color:var(--dm);padding:30px 10px;font-size:13px;line-height:1.5}
.bk{font-size:12px;font-variant-numeric:tabular-nums}.bk .r{display:flex;justify-content:space-between;padding:1.5px 6px;position:relative}.bk .r i{position:absolute;right:0;top:0;bottom:0;opacity:.16}
.bk .mid{text-align:center;font-size:17px;font-weight:800;padding:7px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv .card{margin:0}.kv small{display:block;color:var(--dm);font-size:11px}.kv b{font-size:17px;font-variant-numeric:tabular-nums}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
#sheet>div{width:100%;max-height:78%;overflow-y:auto;background:var(--p);border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 18px)}
#sheet h3{margin:0 0 10px;font-size:16px}
.wl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--ln)}
.wl .n{flex:1}.wl .n b{display:block;font-size:14px}.wl .n small{color:var(--dm);font-size:11.5px}.wl .pp{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);z-index:60;background:#2b3139;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.dis{font-size:10.5px;color:var(--dm);text-align:center;margin-top:14px;line-height:1.5}
</style>

<div id="app">
 <header><a id="back" href="index.html">‹</a><button id="symBtn"><span id="symT">BTC/USDT</span><i>▼</i></button><div id="pr"><b id="prP">-</b><br><span id="prC">-</span></div></header>
 <div id="news">Mercado abierto 24/7. Dinero ficticio.</div>
 <div id="bar"></div>
 <div id="cw"><canvas id="ch"></canvas></div>
 <div id="tabs"><button data-t="op" class="on">Operar</button><button data-t="po">Posiciones</button><button data-t="bk">Libro</button><button data-t="hi">Historial</button><button data-t="ac">Cuenta</button></div>
 <div id="panel"></div>
</div>

<script>
/* ============================== utilidades ============================== */
function $(i){return document.getElementById(i)}
function clamp(x,a,b){return x<a?a:x>b?b:x}
function gauss(){var u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v)}
function nf(x,d){var s=Math.abs(x).toFixed(d),p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return(x<0?'-':'')+p.join('.')}
function toast(t){var e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.opacity=0},2600)}
function pad2(n){return(n<10?'0':'')+n}
/* ============================== activos ============================== */
var DEF=[
 ['BTC','Bitcoin','BTC/USDT',67000,.55,2,.65,.6,250000,'BTCUSDT','c'],
 ['ETH','Ethereum','ETH/USDT',3500,.70,2,.65,.8,150000,'ETHUSDT','c'],
 ['SOL','Solana','SOL/USDT',165,.95,2,.6,1.2,60000,'SOLUSDT','c'],
 ['BNB','BNB','BNB/USDT',590,.60,1,.55,1,50000,'BNBUSDT','c'],
 ['XRP','XRP','XRP/USDT',.55,.85,4,.55,1.3,50000,'XRPUSDT','c'],
 ['DOGE','Dogecoin','DOGE/USDT',.16,1.1,5,.5,1.6,40000,'DOGEUSDT','c'],
 ['ADA','Cardano','ADA/USDT',.45,.9,4,.55,1.5,35000,'ADAUSDT','c'],
 ['AVAX','Avalanche','AVAX/USDT',36,1.0,2,.55,1.6,25000,'AVAXUSDT','c'],
 ['LINK','Chainlink','LINK/USDT',15,.95,3,.55,1.6,25000,'LINKUSDT','c'],
 ['XAU','Oro','XAU/USD',2350,.14,2,.15,.6,400000,null,'t'],
 ['SPX','S&P 500','US500',5300,.16,1,.25,.5,600000,null,'t'],
 ['EUR','Euro / Dólar','EUR/USD',1.08,.07,5,.1,.3,2000000,null,'t'],
 ['TSLA','Tesla','TSLA',180,.50,2,.3,.9,100000,null,'t'],
 ['NVDA','Nvidia','NVDA',900,.55,2,.35,.8,100000,null,'t']
];
var TFS=[['1m',60],['5m',300],['15m',900],['1h',3600],['4h',14400],['1d',86400]];
var A={},AL=[];
DEF.forEach(function(d){var a={id:d[0],name:d[1],pair:d[2],p0:d[3],p:d[3],sig:d[4],dec:d[5],beta:d[6],sbp:d[7],liq:d[8],bn:d[9],grp:d[10],lv:0,mom:0,ev:0,shock:0,S:{},live:false,seed:Math.random(),bkT:0,bk:null};A[a.id]=a;AL.push(a)});
var FEE={spot:{t:.001,m:.0008},fut:{t:.0005,m:.0002}},MMR=.005;
/* ============================== estado ============================== */
var S0={bal:10000,pos:[],ord:[],hist:[],spot:{},eq:[],fees:0,liqs:0,id:1,speed:60,sel:'BTC',tf:'5m',ind:{sma20:1,sma50:0,bb:0,rsi:0,macd:0,vol:1},mode:'fut',side:1,ot:'market',lev:10,pct:25,live:false,prices:{},start:10000};
var S;try{S=JSON.parse(localStorage.getItem('trading_v1'));if(!S||!S.pos)S=null}catch(e){S=null}
if(!S)S=JSON.parse(JSON.stringify(S0));else{for(var k in S0)if(S[k]===undefined)S[k]=S0[k];if(S.prices)for(var k in S.prices)if(A[k])A[k].p0=A[k].p=S.prices[k]}
function save(){try{AL.forEach(function(a){S.prices[a.id]=a.p});localStorage.setItem('trading_v1',JSON.stringify(S))}catch(e){}}
setInterval(save,5000);addEventListener('pagehide',save);
var simT=Math.floor(Date.now()/1000),paused=false;
/* ============================== motor de precios ============================== */
var REG={c:{mu:0,vm:1,n:'lateral'},t:{mu:0,vm:1,n:'lateral'}},zm=0;
function regSwitch(g,dt){if(Math.random()<dt/5400){var r=Math.random();REG[g]=r<.3?{mu:9,vm:1.15,n:'alcista'}:r<.6?{mu:-9,vm:1.25,n:'bajista'}:{mu:0,vm:.85,n:'lateral'};if(g==='t')REG[g].mu/=3}}
function stepAsset(a,dt,z0){
 a.lv+=-.05*a.lv*dt/60+.08*Math.sqrt(dt/60)*gauss();
 var rg=REG[a.grp],sig=a.sig/Math.sqrt(31536000)*Math.exp(a.lv)*rg.vm*(1+a.ev);
 var z=a.beta*z0+Math.sqrt(1-a.beta*a.beta)*gauss();
 var r=rg.mu/31536000*dt+sig*Math.sqrt(dt)*z+.05*a.mom;
 if(Math.random()<dt/20000)r+=gauss()*sig*Math.sqrt(3600)*1.6;
 var sh=a.shock*Math.min(1,dt/90);a.shock-=sh;r+=sh;
 a.mom=a.mom*.85+r*.15;a.ev*=Math.exp(-dt/900);
 var p=a.p*Math.exp(r);a.vlast=Math.abs(r)/Math.max(1e-9,sig*Math.sqrt(dt));return p}
function feed(a,t,p,v,from){for(var i=from||0;i<TFS.length;i++){var s=TFS[i][1],b=Math.floor(t/s)*s,arr=a.S[TFS[i][0]],l=arr[arr.length-1];
  if(l&&l.t===b){if(p>l.h)l.h=p;if(p<l.l)l.l=p;l.c=p;l.v+=v}else{var o=l?l.c:p;arr.push({t:b,o:o,h:Math.max(o,p),l:Math.min(o,p),c:p,v:v})}}}
function baseVol(a,dt,vl){return a.liq/a.p*.00025*dt*(.5+Math.random())*(1+Math.min(4,vl||1)*.5)}
function genHistory(a){a.S={};TFS.forEach(function(f){a.S[f[0]]=[]});a.p=a.p0;var t0=simT-72*3600,t=t0-90*86400,saveP=a.p;
 while(t<t0){var z=gauss();for(var k=0;k<6;k++){a.p=stepAsset(a,150,z);feed(a,t+150*(k+1),a.p,baseVol(a,150,a.vlast),3)}t+=900;if(Math.random()<.003)regSwitch(a.grp,5400)}
 while(t<simT){var z=gauss();a.p=stepAsset(a,10,z);feed(a,t+10,a.p,baseVol(a,10,a.vlast),0);t+=10;if(Math.random()<.0008)regSwitch(a.grp,5400)}
 var f=a.p0/a.p;if(!isFinite(f)||f<=0)f=1;for(var k in a.S)a.S[k].forEach(function(c){c.o*=f;c.h*=f;c.l*=f;c.c*=f});a.p=a.p0;a.lv=0;a.mom=0}
AL.forEach(genHistory);REG.c={mu:0,vm:1,n:'lateral'};REG.t={mu:0,vm:1,n:'lateral'};
function advance(dt){var n=Math.max(1,Math.ceil(dt/10)),sd=dt/n;for(var k=0;k<n;k++){simT+=sd;zm=gauss();regSwitch('c',sd);regSwitch('t',sd);
  AL.forEach(function(a){if(a.live)return;var p=stepAsset(a,sd,zm);a.p=p;feed(a,simT,p,baseVol(a,sd,a.vlast),0);a.tick=(a.tick||0)+1;
   if(Math.random()<.5)tape(a,p)})}
 events(dt);process();eqSample()}
/* ============================== libro y spread ============================== */
function spread(a){return a.p*a.sbp/1e4*(1+(Math.exp(a.lv)-1)*2+a.ev*3)}
function bid(a){return a.p-spread(a)/2}function ask(a){return a.p+spread(a)/2}
function tickSz(a){return Math.pow(10,-a.dec)*Math.max(1,Math.round(a.p*.00004/Math.pow(10,-a.dec)))}
function book(a){var now=performance.now();if(a.bk&&now-a.bkT<500&&Math.abs(a.bkP-a.p)<spread(a)*.3)return a.bk;
 var ts=tickSz(a),sp=spread(a),b={asks:[],bids:[]},q0=a.liq/a.p;
 for(var i=0;i<25;i++){var m=1+i*.35;b.asks.push({p:a.p+sp/2+i*ts*(1+i*.12),q:q0*(.4+Math.random()*1.2)*m*.05});b.bids.push({p:a.p-sp/2-i*ts*(1+i*.12),q:q0*(.4+Math.random()*1.2)*m*.05})}
 a.bk=b;a.bkT=now;a.bkP=a.p;return b}
function fillPrice(a,side,qty){var bk=book(a),lv=side>0?bk.asks:bk.bids,rem=qty,cost=0;for(var i=0;i<lv.length&&rem>0;i++){var t=Math.min(rem,lv[i].q);cost+=t*lv[i].p;rem-=t}
 if(rem>0){var last=lv[lv.length-1].p;var extra=1+(side>0?1:-1)*.002*Math.log(1+rem/Math.max(1e-9,lv[0].q*10))*5;cost+=rem*last*extra}
 return cost/qty}
var TAPE=[];function tape(a,p){if(a.id!==S.sel)return;TAPE.unshift({p:p,s:p>=(a.lastTp||p)?1:-1,q:(a.liq/a.p)*.0004*(.2+Math.random()*Math.random()*6),t:simT});a.lastTp=p;if(TAPE.length>30)TAPE.pop()}
/* ============================== noticias ============================== */
var NEWS=[
 ['Un gran fondo anuncia compras de {n}',.03,.8],['Rumores de regulación estricta para {n}',-.035,1],['Hackeo en un exchange importante: caída de {n}',-.05,1.4],
 ['{n} supera una resistencia clave con volumen récord',.025,.7],['Grandes ballenas mueven {n} a exchanges',-.02,.7],['Anuncian una gran alianza con {n}',.04,.9],['Liquidaciones en cascada sacuden a {n}',-.04,1.3],['Entrada de capital institucional en {n}',.03,.8]];
var MACRO=[['Dato de inflación sorprende al alza: sube la volatilidad',-.012,1.1],['La Reserva Federal da un tono más laxo: los mercados respiran',.015,.8],['Cifras de empleo peores de lo esperado',-.01,1],['Tensión geopolítica: huida hacia activos refugio',-.015,1.2]];
var nextEv=simT+1500,newsLog=[];
function pushNews(t,col){newsLog.unshift({t:t,time:simT});if(newsLog.length>40)newsLog.pop();var e=$('news');e.textContent=t;e.style.borderLeftColor=col||'#f0b90b'}
function events(dt){if(simT<nextEv)return;nextEv=simT+rnd(1800,7200);
 if(Math.random()<.3){var m=MACRO[Math.floor(Math.random()*MACRO.length)];AL.forEach(function(a){var sgn=m[1]>0?1:-1;var f=a.id==='XAU'?-sgn*.5:1;a.shock+=m[1]*f*(a.grp==='c'?1.6:.7);a.ev+=m[2]*.6});pushNews(m[0],m[1]>0?'#0ecb81':'#f6465d')}
 else{var a=AL[Math.floor(Math.random()*AL.length)],n=NEWS[Math.floor(Math.random()*NEWS.length)];var mag=n[1]*(a.grp==='c'?1:.35)*(.6+Math.random()*.8);a.shock+=mag;a.ev+=n[2];pushNews(n[0].replace('{n}',a.name),mag>0?'#0ecb81':'#f6465d')}}
function rnd(a,b){return a+Math.random()*(b-a)}
/* ============================== cuenta ============================== */
function uPnl(p){var a=A[p.a],m=a.p;return(m-p.entry)*p.qty*p.side}
function equity(){var e=S.bal;S.pos.forEach(function(p){e+=p.margin+uPnl(p)});for(var k in S.spot)e+=S.spot[k].q*A[k].p;return e}
var eqT=0;function eqSample(){if(simT-eqT<300)return;eqT=simT;S.eq.push([simT,equity()]);if(S.eq.length>700)S.eq.splice(1,1)}
function liqPx(side,entry,lev,fee){return side>0?entry*(1-1/lev+MMR+fee):entry*(1+1/lev-MMR-fee)}
function closeHist(p,qty,px,fee,reason,pnl){S.hist.unshift({a:p.a,side:p.side,qty:qty,entry:p.entry,exit:px,pnl:pnl,fee:fee,lev:p.lev,t:simT,reason:reason});if(S.hist.length>300)S.hist.pop()}
/* abre/aumenta/reduce posición de futuros (neteo). fill = precio; devuelve texto */
function futFill(a,side,qty,fill,lev,maker,sl,tp,reason){
 var fr=maker?FEE.fut.m:FEE.fut.t,pos=null;for(var i=0;i<S.pos.length;i++)if(S.pos[i].a===a.id){pos=S.pos[i];break}
 var rem=qty;
 if(pos&&pos.side!==side){var c=Math.min(rem,pos.qty),fee=c*fill*fr,pnl=(fill-pos.entry)*c*pos.side,rel=pos.margin*c/pos.qty;
  S.bal+=rel+pnl-fee;S.fees+=fee;pos.margin-=rel;pos.qty-=c;closeHist(pos,c,fill,fee,reason||'cierre',pnl-fee);rem-=c;
  if(pos.qty<=1e-12){S.pos.splice(S.pos.indexOf(pos),1);pos=null}else{}
  if(rem<=1e-12)return}
 if(rem>1e-12){var notion=rem*fill,fee=notion*fr,L=pos?pos.lev:lev,mg=notion/L;
  if(S.bal<mg+fee){toast('Saldo insuficiente');return}
  S.bal-=mg+fee;S.fees+=fee;
  if(pos){pos.entry=(pos.entry*pos.qty+fill*rem)/(pos.qty+rem);pos.qty+=rem;pos.margin+=mg;pos.liq=liqPx(pos.side,pos.entry,pos.lev,fr);if(sl)pos.sl=sl;if(tp)pos.tp=tp}
  else{S.pos.push({id:S.id++,a:a.id,side:side,qty:rem,entry:fill,lev:L,margin:mg,sl:sl||0,tp:tp||0,liq:liqPx(side,fill,L,fr),t:simT,fund:0})}}}
function closePos(p,frac,reason){var a=A[p.a],q=p.qty*frac,side=-p.side,fill=fillPrice(a,side,q);futFill(a,side,q,fill,p.lev,false,0,0,reason);save()}
/* ============================== ejecución de órdenes ============================== */
var lastFund=Math.floor(simT/28800);
function process(){
 /* órdenes pendientes */
 for(var i=S.ord.length-1;i>=0;i--){var o=S.ord[i],a=A[o.a],bd=bid(a),ak=ask(a),fire=false,maker=false,px=0;
  if(o.type==='limit'){if(o.side>0&&ak<=o.price){fire=true;maker=true;px=Math.min(o.price,ak)}if(o.side<0&&bd>=o.price){fire=true;maker=true;px=Math.max(o.price,bd)}}
