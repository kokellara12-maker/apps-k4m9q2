<style>

#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}#sheet.on{display:flex}
#sp{background:linear-gradient(#2a1860,#1a0e3e);width:min(100%,520px);max-height:86%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0);border-top:3px solid #7c4dff}
#sh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;font-size:20px;font-weight:900}#sh .x{background:#e53935;border-radius:12px;padding:3px 12px;font-size:16px}

.it{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:16px;padding:8px 10px;margin:6px 0}
.it .em{font-size:34px;width:44px;text-align:center}.it .tx{flex:1;font-size:13px;line-height:1.3}.it .tx b{font-size:15px}.it .tx small{opacity:.75}
.bt{background:linear-gradient(#69f0ae,#00c853);border-radius:12px;padding:9px 12px;font-weight:900;font-size:14px;color:#05301a;border-bottom:3px solid #007a33;white-space:nowrap}
.bt.y{background:linear-gradient(#ffd740,#ff9100);color:#3a1a00;border-bottom-color:#a85c00}.bt.r{background:linear-gradient(#ff7a7a,#e53935);color:#fff;border-bottom-color:#8a1010}.bt.off{filter:grayscale(1);opacity:.45}.bt:active{transform:translateY(2px)}
.rar{display:inline-block;font-size:10px;font-weight:900;color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0));transform:translateX(-50%);background:rgba(0,0,0,.85);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:92%;border:1px solid rgba(255,255,255,.2)}#toast.on{opacity:1}
#banner{position:fixed;left:0;right:0;top:calc(50px + env(safe-area-inset-top,0));text-align:center;z-index:55;font-weight:900;font-size:15px;padding:8px;background:linear-gradient(90deg,transparent,rgba(255,64,129,.85),transparent);display:none;animation:bn 3.4s forwards}
@keyframes bn{0%{opacity:0;transform:scale(.8)}10%{opacity:1;transform:scale(1.05)}90%{opacity:1}100%{opacity:0}}
.fl{position:fixed;pointer-events:none;font-weight:900;font-size:20px;color:#6dff8c;text-shadow:0 2px 0 #000;animation:up 1s forwards;z-index:30;transform:translateX(-50%)}@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
/* robo */
#raid{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 0,#3a2a10,#150c05);display:none;flex-direction:column;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}#raid.on{display:flex}
#raid.shake{animation:shk .4s}@keyframes shk{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
#rh{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;font-weight:900;font-size:15px}
#guard{text-align:center;margin:4px 0 8px}#guard .g{font-size:76px;line-height:1;transition:transform .15s}#guard .st{font-size:15px;font-weight:900;padding:6px 14px;border-radius:14px;display:inline-block;margin-top:4px}
#guard.look .st{background:#d32f2f}#guard.back .st{background:#2e7d32}#guard.warn .st{background:#f9a825;color:#222}#guard.look .g{transform:scaleX(1)}#guard.back .g{transform:scaleX(-1)}
#shelf{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center;padding:4px 0}
.rc{position:relative;aspect-ratio:.9;border-radius:16px;background:rgba(255,255,255,.08);border:3px solid #777;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.rc .e{font-size:min(11vw,48px)}.rc .n{font-size:10px;font-weight:800;margin-top:2px}.rc .pr{position:absolute;left:0;bottom:0;height:8px;background:#ffd740;width:0}.rc.gone{opacity:.15;pointer-events:none}.rc.hold{transform:scale(.96);border-color:#ffd740}
#rb{padding:8px 0 14px;text-align:center;font-size:13px;opacity:.85;font-weight:700}
#def{position:fixed;inset:0;z-index:50;background:rgba(120,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}#def.on{display:flex}
#def .big{font-size:80px;animation:wob 0.4s infinite}#def h2{margin:6px 0}#def .mt{width:min(80%,320px);height:22px;border-radius:12px;background:rgba(0,0,0,.5);overflow:hidden;margin:10px 0}#def .mt i{display:block;height:100%;width:0;background:#ffd740}
#def .db{font-size:26px;font-weight:900;background:linear-gradient(#ff5252,#c62828);padding:20px 40px;border-radius:24px;border-bottom:6px solid #7f1010;margin-top:8px}#def .db:active{transform:translateY(3px)}
</style></head><body>
<div id="top"><a id="home" href="index.html">🏠</a><div id="cash">$0<small id="inc">+$0/s</small></div><div class="chip" id="rb2">🔄 0</div></div>
<div id="belt"></div>
<div id="slots"></div>
<div id="nav"><div class="nb" data-n="lock" id="nlock"><b>🔒</b><span id="nlt">Candado</span></div><div class="nb red" data-n="raid"><b>🕵️</b>Robar</div><div class="nb" data-n="up"><b>⬆️</b>Mejoras</div><div class="nb" data-n="col"><b>📖</b>Colección</div></div>

<div id="raid"><div id="rh"><span id="rn"></span><span id="rt"></span></div><div id="guard" class="back"><div class="g">👮</div><div class="st">😴 De espaldas: ¡roba!</div></div><div id="shelf"></div><div id="rb">Mantén pulsado un brainrot para robarlo. ¡Suelta si el guardia mira!</div></div>
<div id="def"><div class="big">🥷</div><h2 id="dt">¡Un ladrón intenta robar!</h2><div id="dn"></div><div class="mt"><i id="dm"></i></div><div class="db" id="db">👊 ¡DEFENDER!</div></div>
<div id="toast"></div><div id="banner"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),rnd=Math.random,fl=Math.floor;
const RAR=[['Común','#90a4ae'],['Raro','#42a5f5'],['Épico','#ab47bc'],['Legendario','#ffa726'],['Mítico','#ff4081'],['Brainrot God','#00e5ff'],['Secreto','#ffffff']];
const BR=[
['Ranolino Bobolino','🐸',0,20,1],['Pollo Tralalá','🐔',0,50,2.5],['Pescado Brrr','🐟',0,110,5.5],
['Tiburón Zapatilla','🦈',1,300,12],['Cocodrilo Cappuccino','🐊',1,700,28],['Mono Banana Rot','🐒',1,1400,55],
['Elefantino Espresso','🐘',2,4000,150],['Jirafa Turbo','🦒',2,9000,330],['Hipopótamo Bombo','🦛',2,20000,700],
['Pulpo Bombardero','🐙',3,55000,2000],['Flamingo Mafioso','🦩',3,130000,4600],['Lobo Sigma','🐺',3,300000,10000],
['Dragón Tralalá','🐉',4,800000,28000],['Unicornio Sahur','🦄',4,2e6,65000],['Fénix Crispy','🐦‍🔥',4,5e6,150000],
['Alien Gigachad','👽',5,15e6,480000],['Moai Sigma','🗿',5,40e6,1.3e6],['Robot Rizzler','🤖',5,100e6,3.2e6],
['Cerebro Supremo','🧠',6,500e6,20e6],['Mundo Roto','🌍',6,2e9,80e6]];
const W=[45,28,14,7,4,1.8,.25],HOLD=[.9,1.2,1.6,2,2.5,3,3.8],MUTS={dor:['✨ Dorado',1.5,1.5,'dor'],dia:['💎 Diamante',2.5,3,'dia']};
const UP=[500,2000,8000,30000,120000,500000],NAMES=['xX_Pro_Xx','NoobMaster69','Sigma_Lord','ElPapi_YT','Lucía_Gamer','Brainrot_King','Tralalero_Fan','ZzzCapo','Ninja_Pepe','Mimi123'];
const fmt=n=>{if(n<1e4)return Math.floor(n).toLocaleString('es');const u=['K','M','B','T','Qa'];let i=-1;while(n>=1000&&i<4){n/=1000;i++}return(n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2))+u[i]};
let S;
const fresh=()=>({cash:100,n:6,base:[],reb:0,disc:{},lockUntil:0,lockCd:0,nextRaid:Date.now()+150000,raidCd:0,last:Date.now(),uid:1,maxT:0});
try{S=JSON.parse(localStorage.getItem('sab')||'null')}catch(e){}if(!S)S=fresh();
const save=()=>{S.last=Date.now();try{localStorage.setItem('sab',JSON.stringify(S))}catch(e){}};
const rm=()=>1+S.reb*.5;
const inc=b=>BR[b.k][4]*(b.m?MUTS[b.m][2]:1)*rm();
const incTot=()=>S.base.reduce((a,b)=>a+inc(b),0);
const price=(k,m)=>BR[k][3]*(m?MUTS[m][1]:1);
const sellVal=b=>price(b.k,b.m)*.5;
// audio
let AC=null;function au(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();navigator.audioSession&&(navigator.audioSession.type='playback')}catch(e){}}
function tn(f,d,t,v,dl,f2){if(!AC)return;const T=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v||.1,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d+.02)}
const sBuy=()=>{tn(660,.08,'square',.07);tn(990,.14,'square',.07,.07)},sBad=()=>tn(150,.15,'sawtooth',.06,0,90),sAl=()=>{for(let i=0;i<4;i++)tn(i%2?600:900,.12,'square',.08,i*.12)},sWin=()=>{[523,659,784,1047].forEach((f,i)=>tn(f,.16,'triangle',.1,i*.09))};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000)}
function banner(t){const b=$('banner');b.textContent=t;b.style.display='block';b.style.animation='none';void b.offsetWidth;b.style.animation='';clearTimeout(banner.t);banner.t=setTimeout(()=>b.style.display='none',3500)}
function floatTxt(el,t){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='fl';d.textContent=t;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/3)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
const rb=r=>`<span class="rar" style="background:${RAR[r][1]};color:${r===6?'#222':'#fff'}">${RAR[r][0]}</span>`;
// ---------- cinta
const belt=[];let spawnT=0,beltW=390;
function pickK(){const w=W.map((x,i)=>x*(i>S.maxT+2?.15:1));let r=rnd()*w.reduce((a,b)=>a+b,0),t=0;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0){t=i;break}}const c=BR.map((b,i)=>[b,i]).filter(([b])=>b[2]===t);return c[fl(rnd()*c.length)][1]}
function spawn(){
  const k=pickK(),m=rnd()<.015?'dia':rnd()<.07?'dor':null,el=document.createElement('div'),b=BR[k];
  el.className='bi'+(m?' '+MUTS[m][3]:'');el.style.borderColor=m?'':RAR[b[2]][1];
  el.innerHTML=`<div class="e">${b[1]}</div><div class="n">${b[0]}</div><div class="r" style="color:${RAR[b[2]][1]}">${m?MUTS[m][0]:RAR[b[2]][0]}</div><div class="p"></div>`;
  $('belt').appendChild(el);const o={k,m,x:-100,el,id:S.uid++};el._o=o;belt.push(o);
  if(b[2]>=6)banner('🌟 ¡'+b[0]+' (SECRETO) está en la cinta! 🌟');else if(b[2]===5)banner('⚡ ¡'+b[0]+' en la cinta! ⚡');
}
$('belt').addEventListener('pointerdown',e=>{const el=e.target.closest('.bi');if(!el)return;au();buyBelt(el._o)});
function buyBelt(o){
  if(!o||o.gone)return;const p=price(o.k,o.m);
  if(S.cash<p){sBad();toast('💸 Te faltan $'+fmt(p-S.cash));return}
  if(S.base.length>=S.n){sBad();toast('📦 Base llena. ¡Vende o mejora huecos!');return}
  S.cash-=p;S.base.push({k:o.k,m:o.m,id:S.uid++});S.disc[o.k]=1;S.maxT=Math.max(S.maxT,BR[o.k][2]);o.gone=true;o.el.remove();belt.splice(belt.indexOf(o),1);sBuy();toast(BR[o.k][1]+' '+BR[o.k][0]+' comprado');renderSlots();save();
}
// ---------- base
function renderSlots(){
  let h='';
  for(let i=0;i<12;i++){
    if(i>=S.n){h+=`<div class="sl lock">🔒</div>`;continue}
    const b=S.base[i];if(!b){h+=`<div class="sl empty">Hueco libre</div>`;continue}
    const d=BR[b.k];h+=`<div class="sl ${b.m?MUTS[b.m][3]:''}" data-i="${i}" style="border-color:${RAR[d[2]][1]}">${b.m?`<span class="tag">${MUTS[b.m][0].split(' ')[0]}</span>`:''}<div class="e">${d[1]}</div><div class="n">${d[0]}</div><div class="i">+$${fmt(inc(b))}/s</div></div>`}
  $('slots').innerHTML=h;
}
$('slots').addEventListener('click',e=>{const s=e.target.closest('.sl[data-i]');if(!s)return;au();const b=S.base[+s.dataset.i];if(!b)return;const d=BR[b.k];
  openSheet('Brainrot',`<div class="it"><div class="em">${d[1]}</div><div class="tx"><b>${d[0]}</b>${rb(d[2])}<br><small>${b.m?MUTS[b.m][0]+' · ':''}Genera +$${fmt(inc(b))}/s</small></div></div><div class="it"><div class="tx"><b>Vender</b><br><small>Recibes $${fmt(sellVal(b))}</small></div><div class="bt r" data-sell="${b.id}">Vender</div></div>`)});
// ---------- paneles
function openSheet(t,h){au();$('st').textContent=t;$('sc').innerHTML=h;$('sheet').classList.add('on')}
function closeSheet(){$('sheet').classList.remove('on')}$('sx').onclick=closeSheet;$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function upgPanel(){
  const uc=S.n<12?UP[Math.min(UP.length-1,S.n-6)]:0,can=S.cash>=1e6*Math.pow(3,S.reb);
  openSheet('⬆️ Mejoras',`<div class="it"><div class="em">📦</div><div class="tx"><b>+1 hueco de base</b><br><small>Tienes ${S.n} de 12</small></div>${S.n>=12?'<div class="bt off">Máx</div>':`<div class="bt y ${S.cash>=uc?'':'off'}" data-up="slot">$${fmt(uc)}</div>`}</div>
  <div class="it"><div class="em">🔄</div><div class="tx"><b>Renacer</b> (x${rm().toFixed(1)} → x${(rm()+.5).toFixed(1)})<br><small>Reinicia dinero y brainrots, ganas +50% de ingresos para siempre. Requiere $${fmt(1e6*Math.pow(3,S.reb))}</small></div><div class="bt r ${can?'':'off'}" data-up="reb">Renacer</div></div>`)}
function colPanel(){let h='';for(let t=0;t<7;t++){h+=`<div style="margin:10px 0 2px;font-weight:900">${rb(t)}</div>`;BR.forEach((b,k)=>{if(b[2]!==t)return;const d=S.disc[k];h+=`<div class="it" style="${d?'':'opacity:.5'}"><div class="em">${d?b[1]:'❓'}</div><div class="tx"><b>${d?b[0]:'???'}</b><br><small>${d?'$'+fmt(b[3])+' · +$'+fmt(b[4])+'/s':'Aún no descubierto'}</small></div></div>`})}
  openSheet(`📖 Colección ${Object.keys(S.disc).length}/${BR.length}`,h)}
function lockPanel(){
  const n=Date.now();
  if(S.lockUntil>n){toast('🔒 Ya estás protegido');return}
  if(S.lockCd>n){toast('⏳ Candado en enfriamiento '+Math.ceil((S.lockCd-n)/1000)+'s');return}
  S.lockUntil=n+90000;S.lockCd=n+180000;sBuy();toast('🔒 Base bloqueada 90s: nadie te roba');save()}
$('nav').addEventListener('click',e=>{const t=e.target.closest('[data-n]');if(!t)return;au();const k=t.dataset.n;if(k==='up')upgPanel();else if(k==='col')colPanel();else if(k==='lock')lockPanel();else if(k==='raid')raidList()});
$('sc').addEventListener('click',e=>{
  const t=e.target.closest('[data-sell],[data-up],[data-raid],[data-reroll]');if(!t)return;au();const D=t.dataset;
  if(D.sell){const i=S.base.findIndex(b=>b.id==+D.sell);if(i>=0){S.cash+=sellVal(S.base[i]);S.base.splice(i,1);sBuy();closeSheet();renderSlots();save()}}
  else if(D.up==='slot'){const uc=UP[Math.min(UP.length-1,S.n-6)];if(S.n<12&&S.cash>=uc){S.cash-=uc;S.n++;sBuy();renderSlots();upgPanel();save()}}
  else if(D.up==='reb'){if(S.cash>=1e6*Math.pow(3,S.reb)&&confirm('¿Renacer? Pierdes dinero y brainrots, ganas +50% de ingresos.')){S.reb++;S.cash=100;S.base=[];S.maxT=0;S.lockUntil=0;sWin();banner('🔄 ¡RENACIMIENTO '+S.reb+'! Ingresos x'+rm().toFixed(1));closeSheet();renderSlots();save()}}
  else if(D.raid!==undefined)startRaid(+D.raid);
  else if(D.reroll)raidList(true);
});
// ---------- robar
let bases=null,R=null;
function genBases(){
  bases=[0,1,2].map(i=>{const n=4+fl(rnd()*3),lo=Math.max(0,S.maxT-1),hi=Math.min(6,S.maxT+1),items=[];
    for(let j=0;j<n;j++){const t=Math.min(hi,lo+fl(rnd()*(hi-lo+1)));const c=BR.map((b,k)=>[b,k]).filter(([b])=>b[2]===t);const k=c[fl(rnd()*c.length)][1];items.push({k,m:rnd()<.08?'dor':null,gone:false})}
    return{name:NAMES[fl(rnd()*NAMES.length)],items,locked:rnd()<.3}})}
function raidList(re){
  const n=Date.now();if(S.raidCd>n&&!re){toast('🚔 Te pillaron hace poco. Espera '+Math.ceil((S.raidCd-n)/1000)+'s');return}
  if(!bases||re)genBases();
  let h=bases.map((b,i)=>{const tot=b.items.filter(x=>!x.gone);return`<div class="it"><div class="em">🏠</div><div class="tx"><b>${b.name}</b>${b.locked?' 🔒':''}<br><small>${tot.map(x=>BR[x.k][1]).join(' ')||'Vacía'}</small></div><div class="bt ${b.locked||!tot.length?'off':'r'}" data-raid="${i}">${b.locked?'Bloqueada':'Robar'}</div></div>`}).join('');
  h+=`<div class="it"><div class="tx"><small>Mantén pulsado un brainrot sin que el guardia te vea. ¡Tienes 40 s!</small></div><div class="bt y" data-reroll="1">🔄 Otras bases</div></div>`;
  openSheet('🕵️ ¿A quién robas?',h)}
function startRaid(i){
  const b=bases[i];if(!b||b.locked)return;closeSheet();
  R={b,t:40,state:'back',left:1.6+rnd()*1.2,hold:-1,prog:0,warn:false,stolen:0,over:false};
  $('rn').textContent='🏠 '+b.name;$('raid').classList.add('on');$('raid').classList.remove('shake');
  $('shelf').innerHTML=b.items.map((x,j)=>`<div class="rc ${x.gone?'gone':''}" data-j="${j}" style="border-color:${RAR[BR[x.k][2]][1]}"><div class="e">${BR[x.k][1]}</div><div class="n">${BR[x.k][0]}</div><div class="pr"></div></div>`).join('');
  setGuard();
}
function setGuard(){const g=$('guard');g.className=R.state==='look'?'look':R.warn?'warn':'back';g.querySelector('.st').textContent=R.state==='look'?'👀 ¡MIRANDO! Suelta':R.warn?'⚠️ ¡Se va a girar!':'😴 De espaldas: ¡roba!'}
$('shelf').addEventListener('pointerdown',e=>{const c=e.target.closest('.rc');if(!c||!R||R.over)return;au();e.preventDefault();const j=+c.dataset.j;if(R.b.items[j].gone)return;if(R.hold!==j){R.prog=0}R.hold=j;c.classList.add('hold');try{c.setPointerCapture(e.pointerId)}catch(_){}});
function release(){if(!R)return;R.hold=-1;document.querySelectorAll('.rc.hold').forEach(c=>c.classList.remove('hold'))}
$('shelf').addEventListener('pointerup',release);$('shelf').addEventListener('pointercancel',release);
function raidTick(dt){
  if(!R||R.over)return;R.t-=dt;
  R.left-=dt;
  if(R.state==='back'){R.warn=R.left<.45;if(R.left<=0){R.state='look';R.left=.9+rnd()*1.1;R.warn=false;setGuard()}else setGuard()}
  else if(R.left<=0){R.state='back';R.left=Math.max(1.0,2.8-S.maxT*.15)+rnd()*1.4;setGuard()}
  if(R.hold>=0){
    const it=R.b.items[R.hold];
    if(R.state==='look'){caught();return}
    R.prog+=dt;const need=HOLD[BR[it.k][2]];
    if(R.prog>=need){it.gone=true;R.stolen++;const c=document.querySelector(`.rc[data-j="${R.hold}"]`);if(c)c.classList.add('gone');
      if(S.base.length<S.n){S.base.push({k:it.k,m:it.m,id:S.uid++});S.disc[it.k]=1;S.maxT=Math.max(S.maxT,BR[it.k][2]);toast('🥷 ¡Robaste '+BR[it.k][1]+' '+BR[it.k][0]+'!')}else{S.cash+=price(it.k,it.m)*.5;toast('📦 Base llena: vendido por $'+fmt(price(it.k,it.m)*.5))}
      sWin();renderSlots();R.hold=-1;R.prog=0;save();
      if(R.b.items.every(x=>x.gone))endRaid(true)}
  }else R.prog=Math.max(0,R.prog-dt*.6);
  const pr=document.querySelector(`.rc[data-j="${R.hold>=0?R.hold:-1}"] .pr`);document.querySelectorAll('.rc .pr').forEach(p=>p.style.width='0');
  if(pr)pr.style.width=Math.min(100,R.prog/HOLD[BR[R.b.items[R.hold].k][2]]*100)+'%';
  $('rt').textContent='⏱ '+Math.ceil(R.t)+'s · 🥷 '+R.stolen;
  if(R.t<=0)endRaid(false)
}
function caught(){R.over=true;sAl();$('raid').classList.add('shake');S.raidCd=Date.now()+20000;if(navigator.vibrate)navigator.vibrate([80,40,80]);toast('🚨 ¡TE PILLARON! Robaste '+R.stolen);setTimeout(()=>{$('raid').classList.remove('on');R=null;save()},900)}
function endRaid(full){R.over=true;toast(full?'🏆 ¡Vaciaste la base!':'⏱ Se acabó el tiempo · robaste '+R.stolen);setTimeout(()=>{$('raid').classList.remove('on');R=null;bases=null;save()},700)}
// ---------- defensa
let D=null;
function raiderCome(){
  const n=Date.now();S.nextRaid=n+(150+rnd()*200)*1000;
  if(S.lockUntil>n||!S.base.length||D||R)return;
  const sorted=[...S.base].sort((a,b)=>inc(b)-inc(a)),tg=sorted[fl(rnd()*Math.min(2,sorted.length))];
  D={tg,taps:0,need:8+Math.min(10,S.maxT*2),t:3.2};sAl();$('dn').textContent=BR[tg.k][1]+' '+BR[tg.k][0]+' está en peligro';$('dm').style.width='0';$('def').classList.add('on')}
$('db').addEventListener('pointerdown',e=>{if(!D)return;e.preventDefault();au();D.taps++;tn(300+D.taps*30,.05,'square',.05);$('dm').style.width=Math.min(100,D.taps/D.need*100)+'%';if(D.taps>=D.need){const rw=price(D.tg.k,D.tg.m)*.15;S.cash+=rw;toast('🛡️ ¡Defendido! +$'+fmt(rw));sWin();$('def').classList.remove('on');D=null;save()}});
function defTick(dt){if(!D)return;D.t-=dt;if(D.t<=0){const i=S.base.findIndex(b=>b.id===D.tg.id);if(i>=0)S.base.splice(i,1);sBad();toast('😭 Te robaron '+BR[D.tg.k][0]);$('def').classList.remove('on');D=null;renderSlots();save()}}
// ---------- bucle
let last=performance.now(),accT=0,hudT=0;
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1000);last=now;
  S.cash+=incTot()*dt;
  beltW=$('belt').clientWidth;spawnT-=dt;if(spawnT<=0){spawn();spawnT=2.1}
  for(let i=belt.length-1;i>=0;i--){const o=belt[i];o.x+=70*dt;if(o.x>beltW+20){o.el.remove();belt.splice(i,1);continue}o.el.style.transform=`translateX(${o.x}px)`}
  hudT+=dt;if(hudT>.15){hudT=0;hud()}
  raidTick(dt);defTick(dt);
  if(Date.now()>=S.nextRaid)raiderCome();
}
function hud(){
  $('cash').firstChild.textContent='$'+fmt(S.cash);$('inc').textContent='+$'+fmt(incTot())+'/s';$('rb2').textContent='🔄 '+S.reb+' · x'+rm().toFixed(1);
  for(const o of belt){const p=o.el.querySelector('.p'),pr=price(o.k,o.m),t='$'+fmt(pr);if(p.textContent!==t)p.textContent=t;p.className='p'+(S.cash<pr?' no':'')}
  const n=Date.now(),L=$('nlock'),t=$('nlt');
  if(S.lockUntil>n){t.textContent='🔒 '+Math.ceil((S.lockUntil-n)/1000)+'s';L.classList.remove('off')}else if(S.lockCd>n){t.textContent='⏳ '+Math.ceil((S.lockCd-n)/1000)+'s';L.classList.add('off')}else{t.textContent='Candado';L.classList.remove('off')}
}
// offline
(function(){const off=Math.min(4*3600,(Date.now()-S.last)/1000);if(off>10){const g=incTot()*off;if(g>0){S.cash+=g;setTimeout(()=>toast('💤 Ganaste $'+fmt(g)+' mientras no estabas'),600)}}})();
if(S.nextRaid<Date.now())S.nextRaid=Date.now()+90000;
for(let i=0;i<4;i++){spawn();belt[belt.length-1].x=i*105}
renderSlots();hud();requestAnimationFrame(loop);
setInterval(save,4000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);document.addEventListener('gesturestart',e=>e.preventDefault());
window.__s={S,BR,belt,buyBelt,startRaid,genBases,get bases(){return bases},raidList,raiderCome,get R(){return R},get D(){return D}};
})();
</script></body></html>
