<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0614">
<title>Oleadas 3D</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0a0614;--ink:#f1ecff;--dim:#9a8fc2;--cyan:#00f0ff;--mag:#ff2bd6;--yel:#ffd23f;--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bar{position:fixed;inset:0 0 auto 0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
#bar a{pointer-events:auto;color:var(--dim);text-decoration:none;font-size:14px;font-weight:700;padding:6px 12px;margin-left:-8px;border-radius:999px;background:rgba(10,6,20,.55);border:1px solid rgba(154,143,194,.25)}
#hudw{display:none;position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);padding:0 16px;pointer-events:none;text-align:center}
#hudw.show{display:block}
.row{display:flex;justify-content:flex-end;align-items:flex-start;gap:14px}
.st{text-align:center;line-height:1.05}
.st b{display:block;font-size:26px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;color:var(--cyan);text-shadow:0 0 12px rgba(0,240,255,.55)}
.st.y b{color:var(--yel);text-shadow:0 0 12px rgba(255,210,63,.5)}
.st small{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#hpw{margin:36px auto 0;width:min(320px,70%);height:14px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,43,214,.5);position:relative;overflow:hidden}
#hpf{height:100%;width:100%;background:linear-gradient(90deg,var(--mag),#ff7ae8);box-shadow:0 0 12px var(--mag);transition:width .15s}
#hpt{position:absolute;inset:0;font-size:10px;font-weight:800;line-height:12px;color:#fff}
#left{margin-top:6px;font-size:12px;color:var(--dim);font-weight:700}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(40px,13vw,72px);font-weight:900;font-style:italic;color:var(--ink);text-shadow:0 0 22px var(--mag);opacity:0;pointer-events:none}
#banner.on{animation:ban 1.8s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:24px;font-weight:900;font-style:italic;opacity:0;pointer-events:none;text-shadow:0 0 14px currentColor}
#toast.on{opacity:1}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,43,214,.45));}
.joy{position:fixed;left:0;top:0;width:100px;height:100px;border-radius:50%;border:2px solid rgba(0,240,255,.35);background:rgba(0,240,255,.05);pointer-events:none;opacity:.35}
.joy.r{border-color:rgba(255,43,214,.4);background:rgba(255,43,214,.05)}
.joy.on{opacity:.9}
.knob{position:fixed;left:0;top:0;width:48px;height:48px;border-radius:50%;background:rgba(0,240,255,.45);box-shadow:0 0 14px var(--cyan);pointer-events:none;opacity:.5}
.knob.r{background:rgba(255,43,214,.5);box-shadow:0 0 14px var(--mag)}
.knob.on{opacity:1}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px 16px;background:rgba(10,6,20,.62)}
.ov.show{display:flex}
.card{text-align:center;max-width:360px;width:100%}
h1{margin:0 0 8px;font-size:clamp(44px,14vw,72px);line-height:.95;font-weight:900;font-style:italic;text-shadow:0 0 22px rgba(255,43,214,.75),0 0 2px #fff}
h2{margin:0 0 6px;font-size:36px;font-weight:900;font-style:italic;color:var(--mag);text-shadow:0 0 18px rgba(255,43,214,.7)}
.sub{margin:0 0 16px;color:var(--cyan);font-weight:700;font-size:17px}
.help{margin:0 0 18px;color:var(--dim);font-size:14px;line-height:1.55}
.help span{color:var(--ink);font-weight:700}
.rec{margin:0 0 14px;color:var(--yel);font-weight:800;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;margin:10px 0 0;padding:15px 26px;border:0;border-radius:14px;background:var(--mag);color:#14041a;font:900 17px var(--font);letter-spacing:.02em;box-shadow:0 0 26px rgba(255,43,214,.55)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid rgba(154,143,194,.45);box-shadow:none}
.big{font-size:64px;font-weight:900;font-style:italic;color:var(--cyan);text-shadow:0 0 18px rgba(0,240,255,.6);font-variant-numeric:tabular-nums;line-height:1}
#onew{display:none;color:var(--yel);font-weight:900;margin:6px 0}
#ucards{display:grid;gap:10px;margin-top:14px}
.ucard{border:2px solid var(--c);background:rgba(20,10,40,.85);color:var(--ink);border-radius:14px;padding:14px;text-align:left;font-family:var(--font);box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.ucard b{display:block;font-size:19px;color:var(--c);font-weight:900}
.ucard span{font-size:14px;color:var(--dim)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hurt"></div>
<div class="joy" id="jl"></div><div class="knob" id="kl"></div>
<div class="joy r" id="jr"></div><div class="knob r" id="kr"></div>
<div id="hudw">
  <div class="row"><div class="st"><b id="wv">1</b><small>Oleada</small></div><div class="st y"><b id="sc">0</b><small>Puntos</small></div></div>
  <div id="hpw"><div id="hpf"></div><div id="hpt">100/100</div></div>
  <div id="left"></div>
</div>
<div id="bar"><a href="index.html">‹ Apps</a></div>
<div id="banner"></div><div id="toast"></div>
<div class="ov" id="menu"><div class="card">
  <h1>OLEADAS<br>3D</h1><p class="sub">Sobrevive a las hordas neón</p>
  <p class="help"><span>Izquierda:</span> joystick para moverte<br><span>Derecha:</span> arrastra para apuntar y disparar<br>Si no apuntas, dispara solo al más cercano<br>Recoge ítems y mejora entre oleadas</p>
  <p class="rec" id="rec"></p>
  <button class="btn" id="cta">¡JUGAR!</button>
</div></div>
<div class="ov" id="up"><div class="card"><h2>¡Oleada superada!</h2><p class="sub">Elige una mejora</p><div id="ucards"></div></div></div>
<div class="ov" id="over"><div class="card">
  <h2>GAME OVER</h2><div class="big" id="os">0</div><p class="sub" id="ow"></p>
  <div id="onew">¡NUEVO RÉCORD!</div><p class="rec" id="ob"></p>
  <button class="btn" id="retry">REINTENTAR</button><button class="btn alt" id="tomenu">MENÚ</button>
</div></div>
