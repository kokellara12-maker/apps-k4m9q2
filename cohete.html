<!doctype html><html lang="es"><head><script src="mute.js"></script><script src="progress.js"></script><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script><script src="bgm.js" data-track="espacio"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07102a"><title>Cohete Chatarrero</title></head><body><script src="gk.js"></script><script>
(function(){
var U=GK.store.get('up',{e:0,f:0,h:0,s:0}),M=GK.store.get('scrap',0),pr=function(k){return 20+U[k]*25+U[k]*U[k]*7};
var r,debris,scrap,alt,vy,fuel,t,tilt,boost,stars,cash;
function shop(){var d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;gap:6px;width:100%';var mo=document.createElement('div');mo.style.cssText='font-weight:900;color:#ffd23a';d.appendChild(mo);
 var L=[['e','🔥 Motor'],['f','⛽ Depósito'],['h','🛡 Casco'],['s','🧲 Imán de chatarra']],bs=[];
 function ref(){mo.textContent='🔩 '+M+' chatarra';L.forEach(function(l,i){var k=l[0];bs[i].textContent=l[1]+' (nv '+U[k]+') · '+(U[k]>=10?'MAX':pr(k)+'🔩');bs[i].disabled=U[k]>=10||M<pr(k);bs[i].style.opacity=bs[i].disabled?.5:1})}
 L.forEach(function(l,i){var b=document.createElement('button');b.className='btn g';b.style.cssText='font-size:14px;padding:9px 12px';b.onclick=function(){var k=l[0];if(U[k]<10&&M>=pr(k)){M-=pr(k);U[k]++;GK.store.set('up',U);GK.store.set('scrap',M);GK.beep(900,.1,'triangle',.08,400);ref()}};bs.push(b);d.appendChild(b)});ref();return d}
GK.start({extra:shop,title:'Cohete Chatarrero',icon:'🚀',color:'#ff5a5a',bg:'#07102a',help:'Mantén pulsado para encender el motor y mueve el dedo para inclinar. Esquiva la basura espacial, recoge chatarra 🔩 y mejora tu cohete entre vuelos',
reset:function(){var W=GK.W(),H=GK.H();r={x:W/2,hp:2+U.h};debris=[];scrap=[];alt=0;vy=0;fuel=100+U.f*40;t=0;tilt=0;boost=false;cash=0;stars=[];for(var i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1})},
down:function(x){boost=true;r.tx=x},move:function(x){r.tx=x},up:function(){boost=false},
update:function(dt){var W=GK.W(),H=GK.H();t+=dt;var pw=boost&&fuel>0?(520+U.e*70):-0;if(boost&&fuel>0){vy+=pw*dt*.9;fuel-=26*dt}vy-=120*dt+(vy>0?vy*.1*dt:0);if(alt<=0&&vy<0)vy=0;alt+=vy*dt;
 if(alt<=0&&vy<=0&&t>1.5&&!boost&&fuel<=0){GK.beep(300,.2,'triangle');}
 if(r.tx!=null)r.x+=(r.tx-r.x)*Math.min(1,dt*6);r.x=GK.clamp(r.x,20,W-20);
 var sp=Math.max(0,vy);if(Math.random()<dt*(1.2+alt/900)&&alt>40)debris.push({x:Math.random()*W,y:-30,r:GK.rnd(12,24),v:GK.rnd(60,140),a:Math.random()*6});
 if(Math.random()<dt*1.3&&alt>20)scrap.push({x:Math.random()*W,y:-20});
 for(var d of debris){d.y+=(d.v+sp*.6)*dt;d.a+=dt}for(var s of scrap)s.y+=(sp*.6+80)*dt;
 var py=H*.7;for(var d of debris)if(!d.h&&GK.dist(r.x,py,d.x,d.y)<d.r+14){d.h=1;r.hp--;GK.shake(14);GK.vib(50);GK.beep(120,.3,'sawtooth',.1,-60);GK.burst(r.x,py,12,'#f84',200);vy*=.5;if(r.hp<=0){end('¡Cohete destruido!');return}}
 for(var s of scrap)if(!s.g&&GK.dist(r.x,py,s.x,s.y)<22+U.s*14){s.g=1;cash+=2;GK.beep(1000,.06,'triangle',.06,400);GK.float(s.x,s.y,'+2🔩','#ffd23a',16)}
 debris=debris.filter(function(d){return !d.h&&d.y<H+40});scrap=scrap.filter(function(s){return !s.g&&s.y<H+30});
 GK.setScore(Math.floor(alt/10));
 if(fuel<=0&&vy<=0&&alt>5&&t>3)fall();
 if(fuel<=0&&alt<=0&&t>2)end('Aterrizaje')},
draw:function(c,W,H){var k=Math.min(1,(alt||0)/6000);c.fillStyle='rgb('+Math.round(90*(1-k))+','+Math.round(140*(1-k)+10)+','+Math.round(220*(1-k)+30)+')';c.fillRect(0,0,W,H);if(!r)return;
 c.fillStyle='rgba(255,255,255,'+Math.min(1,k*1.5)+')';for(var s of stars){c.fillRect(s.x,(s.y+alt*.2*s.s)%H,s.s,s.s)}
 if(alt<400){c.fillStyle='#3a5a2a';c.fillRect(0,H*.7+16+alt,W,H)}
 for(var d of debris){c.save();c.translate(d.x,d.y);c.rotate(d.a);c.fillStyle='#8a8f99';c.fillRect(-d.r,-d.r*.6,d.r*2,d.r*1.2);c.fillStyle='#555';c.fillRect(-d.r*.3,-d.r*.6,d.r*.6,d.r*1.2);c.restore()}
 for(var s of scrap){c.font='22px serif';c.textAlign='center';c.textBaseline='middle';c.fillText('🔩',s.x,s.y)}
 var py=H*.7;c.save();c.translate(r.x,py);if(boost&&fuel>0){c.fillStyle='#ffb347';c.beginPath();c.moveTo(-8,22);c.lineTo(0,50+Math.random()*20);c.lineTo(8,22);c.fill();c.fillStyle='#fff3a0';c.beginPath();c.moveTo(-4,22);c.lineTo(0,38+Math.random()*10);c.lineTo(4,22);c.fill()}
 c.fillStyle='#e8e8ee';c.beginPath();c.moveTo(0,-30);c.quadraticCurveTo(14,-8,10,22);c.lineTo(-10,22);c.quadraticCurveTo(-14,-8,0,-30);c.fill();c.fillStyle='#e33';c.beginPath();c.moveTo(0,-30);c.quadraticCurveTo(8,-22,9,-14);c.lineTo(-9,-14);c.quadraticCurveTo(-8,-22,0,-30);c.fill();c.fillStyle='#39f';c.beginPath();c.arc(0,-2,5,0,7);c.fill();c.fillStyle='#e33';c.fillRect(-18,10,8,14);c.fillRect(10,10,8,14);c.restore();
 GK.rr(20,H-50,W-40,12,6,'#222');GK.rr(20,H-50,(W-40)*Math.max(0,fuel/(100+U.f*40)),12,6,'#f90');GK.text('⛽',14,H-44,16,'#fff');GK.text(Math.floor(alt/10)+' m',W/2,H*.12,28,'#fff');GK.text('❤'.repeat(Math.max(0,r.hp))+'  🔩'+cash,W/2,H*.12+34,18,'#ffd23a')}});
function fall(){}
function end(m){M+=cash+Math.floor(GK.score()/20);GK.store.set('scrap',M);GK.over(m+' · +'+(cash+Math.floor(GK.score()/20))+'🔩')}
})();

</script></body></html>
