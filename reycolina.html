(function(){

update:function(dt){var W=GK.W(),H=GK.H();t+=dt;if(t>6)R=Math.max(R0*.35,R-dt*5.5*(1+round*.12));var me=P[0];
 if(jd&&!me.dead){var l=Math.hypot(jd.x,jd.y);if(l>8){var m=Math.min(1,l/60);me.vx+=jd.x/l*m*900*dt;me.vy+=jd.y/l*m*900*dt}}
 for(var p of P){if(p.dead)continue;if(!p.me){p.cd-=dt;var tg=null,bd=1e9;for(var o of P)if(o!==p&&!o.dead){var d=GK.dist(p.x,p.y,o.x,o.y);if(d<bd){bd=d;tg=o}}if(tg){var dx=tg.x-p.x,dy=tg.y-p.y,l2=Math.hypot(dx,dy)||1;var cx=W/2-p.x,cy=H*.5-p.y,ed=Math.hypot(cx,cy);var ax=dx/l2,ay=dy/l2;if(ed>R*.78){ax=cx/ed;ay=cy/ed}p.vx+=ax*(380+round*30)*dt;p.vy+=ay*(380+round*30)*dt;if(p.cd<=0&&bd<110&&ed<R*.7){dash(p,dx,dy);p.cd=GK.rnd(1.6,3.2)}}}
  p.dc-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.18,dt);p.vy*=Math.pow(.18,dt);

 GK.text('Ronda '+round+' · vivos '+P.filter(function(p){return !p.dead}).length,W/2,H-30,16,'#cfa')}});
