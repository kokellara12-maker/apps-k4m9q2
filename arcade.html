<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0614">
<title>Arcade Neón</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg:#0a0614; --ink:#f1ecff; --dim:#9a8fc2; --cyan:#00f0ff; --mag:#ff2bd6; --yel:#ffd23f;
    --font: ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  html,body {
    margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:var(--font); touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #bar {
    position:fixed; inset:0 0 auto 0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0; pointer-events:none; z-index:5;
  }
  #bar a, #bar button.pill {
    pointer-events:auto; color:var(--dim); text-decoration:none; font:700 14px var(--font);
    padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1); margin-left:-6px;
  }
  #bar button.pill { margin:0 -6px 0 0; color:var(--ink); display:none; min-width:44px; font-size:16px; }
  #hud { text-align:center; line-height:1.05; pointer-events:none; display:none; }
  #hud b { display:block; font-size:34px; font-weight:900; font-style:italic; color:var(--cyan);
    text-shadow:0 0 14px rgba(0,240,255,.55); font-variant-numeric:tabular-nums; }
  #hud small { display:block; font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--dim);
    text-transform:uppercase; margin-top:2px; }
  .ov {
    position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);
    gap:14px; text-align:center;
  }
  .ov.show { display:flex; }
  #ovPause,#ovOver { background:rgba(10,6,20,.82); }
  h1 { margin:0; font-size:40px; font-weight:900; font-style:italic; letter-spacing:.02em; color:var(--cyan);
    text-shadow:0 0 18px rgba(0,240,255,.7),0 0 40px rgba(255,43,214,.45); }
  h1 span { color:var(--mag); text-shadow:0 0 18px rgba(255,43,214,.8); }
  h2 { margin:0; font-size:34px; font-weight:900; font-style:italic; color:var(--mag); text-shadow:0 0 16px rgba(255,43,214,.7); }
  p.sub { margin:0; color:var(--dim); font-size:14px; font-weight:600; }
  .big { font-size:64px; font-weight:900; font-style:italic; color:var(--cyan); text-shadow:0 0 18px rgba(0,240,255,.6); line-height:1; }
  .rec { color:var(--yel); font-weight:800; text-shadow:0 0 12px rgba(255,210,63,.6); min-height:20px; }
  .card, .btn {
    font-family:var(--font); color:var(--ink); border-radius:18px; cursor:pointer;
    background:rgba(255,255,255,.05); border:2px solid var(--c,var(--cyan)); box-shadow:0 0 14px var(--cg,rgba(0,240,255,.35)), inset 0 0 14px var(--cg,rgba(0,240,255,.12));
  }
  .card { width:min(100%,340px); display:flex; align-items:center; gap:14px; padding:14px 16px; text-align:left; }
  .card:active,.btn:active { transform:scale(.97); }
  .card .ic { font-size:34px; width:44px; text-align:center; }
  .card .tx { flex:1; min-width:0; }
  .card b { display:block; font-size:20px; font-weight:900; letter-spacing:.02em; }
  .card small { display:block; font-size:12px; color:var(--dim); font-weight:600; margin-top:2px; }
  .card .best { font-size:11px; font-weight:800; color:var(--yel); letter-spacing:.08em; text-align:right; }
  .card .best i { display:block; font-style:normal; font-size:22px; color:var(--ink); }
  .btn { padding:14px 28px; font-size:18px; font-weight:800; min-width:220px; }
  .btn.alt { --c:var(--mag); --cg:rgba(255,43,214,.35); }
  .btn.dim { --c:#6c5fa0; --cg:rgba(108,95,160,.25); font-size:16px; }
  .tog { font:700 13px var(--font); color:var(--dim); background:none; border:1px solid rgba(255,255,255,.14);
    padding:8px 14px; border-radius:999px; }
  .tog b { color:var(--yel); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <a href="index.html" id="back">‹ Apps</a>
  <div id="hud"><b id="hScore">0</b><small id="hSub"></small></div>
  <button class="pill" id="pauseBtn" aria-label="Pausa">⏸</button>
</div>

<div class="ov show" id="ovMenu">
  <h1>ARCADE <span>NEÓN</span></h1>
  <p class="sub">Elige juego</p>
  <button class="card" data-g="snake" style="--c:#00f0ff"><div class="ic">🐍</div><div class="tx"><b>Snake</b><small>Desliza para girar</small></div><div class="best">MEJOR<i id="bSnake">0</i></div></button>
  <button class="card" data-g="flappy" style="--c:#ffd23f;--cg:rgba(255,210,63,.35)"><div class="ic">🐤</div><div class="tx"><b>Flappy</b><small>Toca para aletear</small></div><div class="best">MEJOR<i id="bFlappy">0</i></div></button>
  <button class="card" data-g="breakout" style="--c:#ff2bd6;--cg:rgba(255,43,214,.35)"><div class="ic">🧱</div><div class="tx"><b>Ladrillos</b><small>Arrastra la pala</small></div><div class="best">MEJOR<i id="bBreakout">0</i></div></button>
  <button class="tog" id="wrapTog">Snake · Paredes: <b id="wrapTxt">mortales</b></button>
</div>

<div class="ov" id="ovPause">
  <h2>PAUSA</h2>
  <button class="btn" id="bResume">Continuar</button>
  <button class="btn alt" id="bRestartP">Reiniciar</button>
  <button class="btn dim" id="bMenuP">Menú del arcade</button>
</div>

<div class="ov" id="ovOver">
  <h2>GAME OVER</h2>
  <div class="big" id="oScore">0</div>
  <p class="sub" id="oBest">Mejor: 0</p>
  <div class="rec" id="oRec"></div>
  <button class="btn" id="bRetry">Reintentar</button>
  <button class="btn dim" id="bMenuO">Menú del arcade</button>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const COL = { bg:'#0a0614', cyan:'#00f0ff', mag:'#ff2bd6', yel:'#ffd23f', ink:'#f1ecff' };
const NAMES = { snake:'Snake', flappy:'Flappy', breakout:'Ladrillos' };

/* ---------- storage ---------- */
const store = {
  get(k,d){ try { const v = localStorage.getItem(k); return v===null?d:v; } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem(k,String(v)); } catch(e){} }
};
const best = {}; ['snake','flappy','breakout'].forEach(g => best[g] = parseInt(store.get('arcade-best-'+g,'0'),10) || 0);
let wrap = store.get('arcade-snake-wrap','0') === '1';
function refreshMenu(){
  $('bSnake').textContent = best.snake; $('bFlappy').textContent = best.flappy; $('bBreakout').textContent = best.breakout;
  $('wrapTxt').textContent = wrap ? 'se atraviesan' : 'mortales';
}

/* ---------- audio ---------- */
let AC = null;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
}
function beep(f, d=0.08, type='square', vol=0.05, slide=0){
  if (!AC) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  } catch(e){}
}

/* ---------- canvas / layout ---------- */
let W=0, H=0, dpr=1, safeT=0, safeB=0, fieldTop=0, fieldBot=0, bgCanvas=null;
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
document.body.appendChild(probe);
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs = getComputedStyle(probe);
  safeT = parseFloat(cs.paddingTop) || 0; safeB = parseFloat(cs.paddingBottom) || 0;
  fieldTop = safeT + 58; fieldBot = H - Math.max(safeB, 10);
  buildBg();
  if (cur && cur.layout && mode === 'menu') cur.layout();
}
function buildBg(){
  bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
  const g = bgCanvas.getContext('2d');
  g.fillStyle = COL.bg; g.fillRect(0,0,W,H);
  const grad = g.createRadialGradient(W/2,H*0.35,10,W/2,H*0.35,H*0.7);
  grad.addColorStop(0,'rgba(255,43,214,.10)'); grad.addColorStop(1,'rgba(10,6,20,0)');
  g.fillStyle = grad; g.fillRect(0,0,W,H);
  g.strokeStyle = 'rgba(0,240,255,.06)'; g.lineWidth = 1; g.beginPath();
  for (let x=0;x<W;x+=32){ g.moveTo(x+.5,0); g.lineTo(x+.5,H); }
  for (let y=0;y<H;y+=32){ g.moveTo(0,y+.5); g.lineTo(W,y+.5); }
  g.stroke();
}
const glow = (c,b) => { ctx.shadowColor = c; ctx.shadowBlur = b; };
const noglow = () => { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; };
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;

/* ---------- particles ---------- */
let parts = [];
function burst(x,y,color,n=10,sp=140){
  for (let i=0;i<n;i++){ const a=Math.random()*6.283, s=rnd(sp*.3,sp);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.6),t:0,c:color}); }
  if (parts.length > 120) parts.splice(0, parts.length-120);
}
function stepParts(dt){
  for (let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t+=dt; if(p.t>p.life){parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; }
}
function drawParts(){
  for (const p of parts){ ctx.globalAlpha = 1 - p.t/p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x-2,p.y-2,4,4); }
  ctx.globalAlpha = 1;
}

/* ---------- state ---------- */
let mode = 'menu';       // menu | play | pause | over
let gname = null, cur = null, score = 0, hudSub = '';
let last = 0;

function setScore(v){ score = v; $('hScore').textContent = v; }
function setSub(s){ if (s !== hudSub){ hudSub = s; $('hSub').textContent = s; } }
function show(id, on){ $(id).classList.toggle('show', on); }
function showHud(on){ $('hud').style.display = on ? 'block' : 'none'; $('pauseBtn').style.display = on ? 'block' : 'none'; }

function toMenu(){
  mode = 'menu'; cur = null; gname = null; parts = [];
  show('ovPause',false); show('ovOver',false); show('ovMenu',true); showHud(false); refreshMenu();
}
function startGame(name){
  gname = name; cur = GAMES[name]; parts = [];
  setScore(0); hudSub = ''; cur.init();
  mode = 'play';
  show('ovMenu',false); show('ovPause',false); show('ovOver',false); showHud(true);
  beep(660,.08,'square',.05,330);
}
function pauseGame(){
  if (mode !== 'play') return;
  mode = 'pause'; show('ovPause',true);
}
function resumeGame(){ if (mode==='pause'){ mode='play'; show('ovPause',false); last = performance.now(); } }
function gameOver(){
  if (mode !== 'play') return;
  mode = 'over';
  const isNew = score > best[gname];
  if (isNew){ best[gname] = score; store.set('arcade-best-'+gname, score); }
  $('oScore').textContent = score;
  $('oBest').textContent = 'Mejor: ' + best[gname];
  $('oRec').textContent = isNew && score > 0 ? '★ ¡Nuevo récord! ★' : '';
  beep(300,.35,'sawtooth',.06,-220);
  setTimeout(() => { if (mode==='over') show('ovOver',true); }, 450);
}

/* ---------- input ---------- */
let ptr = { down:false, id:-1, x:0, y:0, sx:0, sy:0, t:0 };
function pt(e){ return [e.clientX, e.clientY]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (mode !== 'play' || !cur) return;
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  const [x,y] = pt(e); ptr = { down:true, id:e.pointerId, x, y, sx:x, sy:y, t:performance.now() };
  cur.down && cur.down(x,y);
}, { passive:false });
cv.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!ptr.down || e.pointerId !== ptr.id || mode !== 'play' || !cur) return;
  const [x,y] = pt(e); ptr.x = x; ptr.y = y;
  cur.move && cur.move(x,y);
}, { passive:false });
const endPtr = e => {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false;
  if (mode === 'play' && cur && cur.up) cur.up(e.clientX, e.clientY);
};
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('pointerdown', initAudio, { once:false, passive:true });

document.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => { initAudio(); startGame(b.dataset.g); }));
$('wrapTog').addEventListener('click', () => { initAudio(); wrap = !wrap; store.set('arcade-snake-wrap', wrap?'1':'0'); refreshMenu(); beep(520,.05); });
$('pauseBtn').addEventListener('click', () => { initAudio(); pauseGame(); beep(440,.05); });
$('bResume').addEventListener('click', () => { beep(520,.05); resumeGame(); });
$('bRestartP').addEventListener('click', () => startGame(gname));
$('bMenuP').addEventListener('click', () => { beep(330,.06); toMenu(); });
$('bRetry').addEventListener('click', () => startGame(gname));
$('bMenuO').addEventListener('click', () => { beep(330,.06); toMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('blur', pauseGame);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* =========================================================
   SNAKE
   ========================================================= */
const Snake = (() => {
  let cols=16, rows, cell, offX, offY, body, dir, queue, food, acc, interval, eaten, flash=0;
  const DIRS = { U:[0,-1], D:[0,1], L:[-1,0], R:[1,0] };
  function layout(){
    cell = Math.floor(W/cols); const fw = cell*cols;
    rows = Math.floor((fieldBot - fieldTop) / cell);
    offX = Math.round((W - fw)/2); offY = Math.round(fieldTop + ((fieldBot-fieldTop) - rows*cell)/2);
  }
  function placeFood(){
    const occ = new Set(body.map(s => s[0]+','+s[1]));
    for (let tries=0; tries<500; tries++){
      const x=(Math.random()*cols)|0, y=(Math.random()*rows)|0;
      if (!occ.has(x+','+y)) { food=[x,y]; return; }
    }
    for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) if (!occ.has(x+','+y)) { food=[x,y]; return; }
    food = null;
  }
  function init(){
    layout();
    const cx = (cols/2)|0, cy = Math.round(rows*0.65);
    body = [[cx,cy],[cx,cy+1],[cx,cy+2]]; dir = 'U'; queue = []; acc = 0; eaten = 0; interval = 140; flash = 0;
    placeFood(); setSub('Mejor ' + best.snake);
  }
  function turn(d){
    const last = queue.length ? queue[queue.length-1] : dir;
    const opp = { U:'D', D:'U', L:'R', R:'L' };
    if (d === last || d === opp[last]) return;
    if (queue.length < 2) { queue.push(d); beep(900,.02,'square',.025); }
  }
  let sx=0, sy=0;
  function down(x,y){ sx=x; sy=y; }
  function move(x,y){
    const dx=x-sx, dy=y-sy;
    if (Math.hypot(dx,dy) < 22) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx>0?'R':'L') : (dy>0?'D':'U'));
    sx=x; sy=y;
  }
  function step(){
    if (queue.length) dir = queue.shift();
    const [dx,dy] = DIRS[dir]; let nx = body[0][0]+dx, ny = body[0][1]+dy;
    if (wrap){ nx=(nx+cols)%cols; ny=(ny+rows)%rows; }
    else if (nx<0||ny<0||nx>=cols||ny>=rows){ return die(); }
    const willEat = food && nx===food[0] && ny===food[1];
    const lim = willEat ? body.length : body.length-1;
    for (let i=0;i<lim;i++) if (body[i][0]===nx && body[i][1]===ny) return die();
    body.unshift([nx,ny]);
    if (willEat){
      eaten++; setScore(eaten); burst(offX+(nx+.5)*cell, offY+(ny+.5)*cell, COL.mag, 12);
      beep(720+Math.min(eaten,20)*20,.09,'square',.05,300);
      interval = Math.max(62, 140 - eaten*3.2); placeFood();
    } else body.pop();
  }
  function die(){ flash = 1; gameOver(); }
  function update(dt){
    stepParts(dt);
    if (flash>0) flash -= dt*2;
    acc += dt*1000;
    let n = 0;
    while (acc >= interval && n++ < 4 && mode==='play'){ acc -= interval; step(); }
  }
  function draw(){
    // field
    ctx.strokeStyle = 'rgba(0,240,255,.35)'; ctx.lineWidth = 2;
    glow(COL.cyan, 10); ctx.strokeRect(offX-1, offY-1, cols*cell+2, rows*cell+2); noglow();
    ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let i=1;i<cols;i++){ ctx.moveTo(offX+i*cell+.5,offY); ctx.lineTo(offX+i*cell+.5,offY+rows*cell); }
    for (let j=1;j<rows;j++){ ctx.moveTo(offX,offY+j*cell+.5); ctx.lineTo(offX+cols*cell,offY+j*cell+.5); }
    ctx.stroke();
    if (food){
      const pul = 1 + Math.sin(performance.now()/130)*.12, r = cell*.34*pul;
      ctx.fillStyle = COL.mag; glow(COL.mag, 16);
      ctx.beginPath(); ctx.arc(offX+(food[0]+.5)*cell, offY+(food[1]+.5)*cell, r, 0, 6.283); ctx.fill(); noglow();
    }
    // body: one path, one glow
    const pad = 1.5, rad = cell*.28;
    ctx.fillStyle = flash>0 ? COL.mag : COL.cyan; glow(flash>0?COL.mag:COL.cyan, 14);
    ctx.beginPath();
    for (let i=body.length-1;i>=1;i--){ const s=body[i]; ctx.roundRect(offX+s[0]*cell+pad, offY+s[1]*cell+pad, cell-pad*2, cell-pad*2, rad); }
    ctx.fill(); noglow();
    const h = body[0];
    ctx.fillStyle = '#e8ffff'; glow(COL.cyan, 18);
    ctx.beginPath(); ctx.roundRect(offX+h[0]*cell+pad, offY+h[1]*cell+pad, cell-pad*2, cell-pad*2, rad); ctx.fill(); noglow();
    // eyes
    ctx.fillStyle = COL.bg; const [dx,dy] = DIRS[dir], cx = offX+(h[0]+.5)*cell, cy = offY+(h[1]+.5)*cell;
    const px = -dy, py = dx, e = cell*.2;
    for (const sgn of [-1,1]){ ctx.beginPath(); ctx.arc(cx+dx*e+px*e*sgn, cy+dy*e+py*e*sgn, cell*.07, 0, 6.283); ctx.fill(); }
    drawParts();
    if (eaten === 0 && body.length === 3){
      ctx.fillStyle = 'rgba(241,236,255,.55)'; ctx.font = '700 15px '+getComputedStyle(document.body).fontFamily; ctx.textAlign='center';
      ctx.fillText('Desliza para girar', W/2, offY + rows*cell*0.35);
    }
  }
  return { init, update, draw, down, move, layout, get info(){ return { eaten, len: body.length, dir, interval, food, head: body[0], cols, rows }; } };
})();

/* =========================================================
   FLAPPY
   ========================================================= */
const Flappy = (() => {
  let bird, pipes, state, t, speed, gap, pw=62, spacing, gy0, gyMax, groundY, bx, dead;
  function layout(){ groundY = fieldBot - 22; gy0 = fieldTop + 10; }
  function init(){
    layout(); gap = Math.min(190, Math.max(150, (groundY-gy0)*0.27)); spacing = 215;
    bx = W*0.3; bird = { y:(gy0+groundY)/2, vy:0, r:14 }; pipes = []; state = 'ready'; t = 0; speed = 150; dead = false;
    setSub('Mejor ' + best.flappy);
  }
  function flap(){
    if (state === 'ready'){ state = 'run'; spawn(W + 40); }
    bird.vy = -420; beep(520,.07,'square',.04,380);
  }
  function down(){ flap(); }
  function spawn(x){
    const m = 50; pipes.push({ x, gy: rnd(gy0+m+gap/2, groundY-m-gap/2), passed:false });
  }
  function update(dt){
    stepParts(dt); t += dt;
    if (state === 'ready'){ bird.y = (gy0+groundY)/2 + Math.sin(t*4)*8; return; }
    const sub = Math.ceil(dt/0.008);
    for (let s=0;s<sub;s++){
      const d = dt/sub;
      bird.vy += 1450*d; bird.y += bird.vy*d;
      for (const p of pipes) p.x -= speed*d;
      if (bird.y - bird.r < gy0 - 6){ bird.y = gy0 - 6 + bird.r; if (bird.vy<0) bird.vy = 0; }
      if (bird.y + bird.r > groundY) { bird.y = groundY - bird.r; return die(); }
      for (const p of pipes){
        if (bx+bird.r-3 > p.x && bx-bird.r+3 < p.x+pw){
          if (bird.y-bird.r+3 < p.gy-gap/2 || bird.y+bird.r-3 > p.gy+gap/2) return die();
        }
      }
    }
    for (const p of pipes) if (!p.passed && p.x+pw < bx - bird.r){
      p.passed = true; setScore(score+1); beep(1000,.08,'triangle',.06,500);
      speed = Math.min(230, 150 + score*3);
    }
    if (pipes.length && pipes[0].x < -pw-10) pipes.shift();
    if (!pipes.length || pipes[pipes.length-1].x < W - spacing) spawn(W + 10);
  }
  function die(){ burst(bx, bird.y, COL.yel, 18, 200); dead = true; gameOver(); }
  function draw(){
    // ground
    ctx.strokeStyle = COL.cyan; ctx.lineWidth = 2; glow(COL.cyan, 12);
    ctx.beginPath(); ctx.moveTo(0,groundY+1); ctx.lineTo(W,groundY+1); ctx.stroke(); noglow();
    ctx.strokeStyle = 'rgba(0,240,255,.18)'; ctx.lineWidth = 1; ctx.beginPath();
    const off = (state==='run' ? (t*speed) : 0) % 24;
    for (let x=-off; x<W; x+=24){ ctx.moveTo(x, groundY+3); ctx.lineTo(x-12, groundY+22); }
    ctx.stroke();
    // pipes
    ctx.fillStyle = 'rgba(255,43,214,.16)'; ctx.strokeStyle = COL.mag; ctx.lineWidth = 2.5; glow(COL.mag, 14);
    ctx.beginPath();
    for (const p of pipes){
      const top = p.gy-gap/2, bot = p.gy+gap/2;
      ctx.rect(p.x, gy0-20, pw, top-(gy0-20)-14); ctx.rect(p.x-5, top-14, pw+10, 14);
      ctx.rect(p.x, bot+14, pw, groundY-bot-14); ctx.rect(p.x-5, bot, pw+10, 14);
    }
    ctx.fill(); ctx.stroke(); noglow();
    // bird
    if (!dead || true){
      const rot = clamp(bird.vy/700, -.5, 1.0);
      ctx.save(); ctx.translate(bx, bird.y); ctx.rotate(rot);
      ctx.fillStyle = COL.yel; glow(COL.yel, 18);
      ctx.beginPath(); ctx.arc(0,0,bird.r,0,6.283); ctx.fill(); noglow();
      ctx.fillStyle = COL.mag; ctx.beginPath(); ctx.moveTo(bird.r-2,-2); ctx.lineTo(bird.r+9,2); ctx.lineTo(bird.r-2,6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = COL.bg; ctx.beginPath(); ctx.arc(5,-4,3,0,6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(10,6,20,.55)'; ctx.lineWidth = 2; ctx.beginPath();
      const w = Math.sin(t*22)*4; ctx.moveTo(-9,2); ctx.lineTo(-2,2+w); ctx.stroke();
      ctx.restore();
    }
    drawParts();
    if (state === 'ready'){
      ctx.fillStyle = 'rgba(241,236,255,.75)'; ctx.font = '800 18px '+getComputedStyle(document.body).fontFamily; ctx.textAlign='center';
      ctx.fillText('Toca para aletear', W/2, gy0 + (groundY-gy0)*0.28);
    }
  }
  return { init, update, draw, down, layout, get info(){ return { y:bird.y, vy:bird.vy, state, pipes:pipes.map(p=>({x:p.x,gy:p.gy})), bx, gap }; } };
})();

/* =========================================================
   BREAKOUT
   ========================================================= */
const Breakout = (() => {
  let pad, ball, bricks, lives, level, held, bannerT, bannerTxt, grab, tapStart, base;
  const ROWC = [COL.mag, COL.yel, COL.cyan, '#8a5bff', '#3dff9a'];
  function layout(){}
  function buildLevel(){
    bricks = []; const cols = 8, gapx = 4, pw = (W - 24 - gapx*(cols-1))/cols, bh = 20, rows = Math.min(4 + level, 8);
    const x0 = 12, y0 = fieldTop + 30;
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
      const pat = level % 4;
      if (pat===2 && (r+c)%2) continue;
      if (pat===3 && (c===3||c===4) && r>0 && r<rows-1) continue;
      if (pat===0 && level>0 && r%2===1 && (c===0||c===cols-1)) continue;
      bricks.push({ x:x0+c*(pw+gapx), y:y0+r*(bh+5), w:pw, h:bh, row:r, hp: (level>=3 && r===0)?2:1 });
    }
  }
  function serve(){ held = true; ball = { x:pad.x, y:pad.y-pad.h/2-7, vx:0, vy:0, r:7 }; }
  function init(){
    pad = { x:W/2, y:fieldBot-46, w:84, h:12 }; lives = 3; level = 1; base = 340; grab = 0; bannerT = 0;
    buildLevel(); serve(); sub();
  }
  function sub(){ setSub('Nivel '+level+'  ·  '+'♥'.repeat(lives)); }
  function launch(){
    held = false; const sp = ball.sp = Math.min(560, base + (level-1)*28), a = rnd(-.35,.35);
    ball.vx = sp*Math.sin(a); ball.vy = -sp*Math.cos(a); beep(480,.06,'square',.04,240);
  }
  function down(x){ grab = pad.x - x; tapStart = performance.now(); }
  function move(x){ pad.x = clamp(x + grab, pad.w/2+4, W-pad.w/2-4); if (held) ball.x = pad.x; }
  function up(x,y){
    if (held && performance.now()-tapStart < 350 && Math.hypot(x-ptr.sx,y-ptr.sy) < 14) launch();
  }
  function lose(){
    lives--; beep(220,.3,'sawtooth',.06,-120);
    if (lives <= 0){ burst(ball.x, ball.y, COL.mag, 20, 200); sub(); gameOver(); }
    else { sub(); serve(); }
  }
  function update(dt){
    stepParts(dt); if (bannerT>0) bannerT -= dt;
    if (held){ ball.x = pad.x; ball.y = pad.y-pad.h/2-ball.r; return; }
    const n = Math.max(2, Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/4)), d = dt/n;
    for (let s=0;s<n;s++){
      ball.x += ball.vx*d; ball.y += ball.vy*d;
      if (ball.x < ball.r){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); beep(300,.03,'square',.03); }
      else if (ball.x > W-ball.r){ ball.x = W-ball.r; ball.vx = -Math.abs(ball.vx); beep(300,.03,'square',.03); }
      if (ball.y < fieldTop+4+ball.r){ ball.y = fieldTop+4+ball.r; ball.vy = Math.abs(ball.vy); beep(300,.03,'square',.03); }
      // paddle
      if (ball.vy > 0 && ball.y+ball.r >= pad.y-pad.h/2 && ball.y-ball.r <= pad.y+pad.h/2 && Math.abs(ball.x-pad.x) <= pad.w/2+ball.r){
        const k = clamp((ball.x-pad.x)/(pad.w/2), -1, 1), a = k*1.05;
        ball.sp = Math.min(580, ball.sp + 4);
        ball.vx = ball.sp*Math.sin(a); ball.vy = -ball.sp*Math.cos(a); ball.y = pad.y-pad.h/2-ball.r;
        beep(420,.05,'square',.045,120);
      }
      // bricks
      for (let i=0;i<bricks.length;i++){
        const b = bricks[i];
        const cx = clamp(ball.x,b.x,b.x+b.w), cy = clamp(ball.y,b.y,b.y+b.h), dx = ball.x-cx, dy = ball.y-cy;
        if (dx*dx+dy*dy < ball.r*ball.r){
          if (dx===0 && dy===0) ball.vy = -ball.vy;
          else if (Math.abs(dx) > Math.abs(dy)){ ball.vx = dx>0 ? Math.abs(ball.vx) : -Math.abs(ball.vx); ball.x += dx>0 ? 1 : -1; }
          else { ball.vy = dy>0 ? Math.abs(ball.vy) : -Math.abs(ball.vy); ball.y += dy>0 ? 1 : -1; }
          b.hp--;
          if (b.hp <= 0){
            bricks.splice(i,1); setScore(score + 10*level); burst(b.x+b.w/2,b.y+b.h/2,ROWC[b.row%ROWC.length],8,150);
            beep(600+(7-b.row)*50,.06,'square',.045,200);
          } else beep(260,.05,'square',.04);
          break;
        }
      }
      if (!bricks.length){ level++; bannerTxt = '¡NIVEL '+level+'!'; bannerT = 1.4; buildLevel(); serve(); sub(); beep(880,.25,'triangle',.06,500); return; }
      if (ball.y - ball.r > H) { lose(); return; }
    }
  }
  function draw(){
    // bricks batched per row color
    for (let ci=0; ci<ROWC.length; ci++){
      const c = ROWC[ci]; let any=false;
      ctx.beginPath();
      for (const b of bricks) if (b.row%ROWC.length===ci && b.hp===1){ ctx.roundRect(b.x,b.y,b.w,b.h,4); any=true; }
      if (any){ ctx.fillStyle = c+'38'; ctx.strokeStyle = c; ctx.lineWidth = 2; glow(c,10); ctx.fill(); ctx.stroke(); }
      any = false; ctx.beginPath();
      for (const b of bricks) if (b.row%ROWC.length===ci && b.hp>1){ ctx.roundRect(b.x,b.y,b.w,b.h,4); any=true; }
      if (any){ ctx.fillStyle = c+'99'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; glow(c,14); ctx.fill(); ctx.stroke(); }
    }
    noglow();
    // paddle
    ctx.fillStyle = COL.cyan; glow(COL.cyan, 16);
    ctx.beginPath(); ctx.roundRect(pad.x-pad.w/2, pad.y-pad.h/2, pad.w, pad.h, 6); ctx.fill(); noglow();
    // ball
    ctx.fillStyle = '#fff'; glow(COL.yel, 16);
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.283); ctx.fill(); noglow();
    drawParts();
    ctx.textAlign='center';
    if (held){
      ctx.fillStyle = 'rgba(241,236,255,.75)'; ctx.font = '800 17px '+getComputedStyle(document.body).fontFamily;
      ctx.fillText('Arrastra · toca para lanzar', W/2, pad.y-60);
    }
    if (bannerT > 0){
      ctx.globalAlpha = clamp(bannerT,0,1); ctx.fillStyle = COL.yel; glow(COL.yel,20);
      ctx.font = '900 38px '+getComputedStyle(document.body).fontFamily; ctx.fillText(bannerTxt, W/2, H*0.58); noglow(); ctx.globalAlpha = 1;
    }
  }
  return { init, update, draw, down, move, up, layout, get info(){ return { lives, level, bricks:bricks.length, held, ball, pad }; } };
})();

const GAMES = { snake:Snake, flappy:Flappy, breakout:Breakout };

/* ---------- main loop ---------- */
let menuT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, Math.max(0.001, (now - last)/1000)); last = now;
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  if (mode === 'menu'){ menuT += dt; return; }
  if (mode === 'play') cur.update(dt);
  else if (mode === 'over' && cur) stepParts(dt);
  if (cur) cur.draw();
}

window.__arc = () => ({ mode, game:gname, score, best:{...best}, info: cur && cur.info });

resize(); refreshMenu();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
