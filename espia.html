var N=9,M=11,wall,pl,doc,ex,gu,cam,tu,has,lvl,per,T,sx,sy,hist;
var DV=[[0,-1],[1,0],[0,1],[-1,0]];
function gcd(a,b){return b?gcd(b,a%b):a}

function gpos(g,t){var cyc=2*(g.len-1),m=t%cyc,idx=m<g.len?m:cyc-m;return[g.x+g.d[0]*idx,g.y+g.d[1]*idx,m<g.len-1?1:-1]}

 for(var g of gu){var p=gpos(g,t),fx=g.d[0]*p[2],fy=g.d[1]*p[2];add(p[0],p[1]);for(var i=1;i<=3;i++){var x=p[0]+fx*i,y=p[1]+fy*i;if(x<0||y<0||x>=N||y>=M||wall[y][x])break;add(x,y)}}
 for(var c of cam){var d=DV[(c.o+t)%4];add(c.x,c.y);for(var i=1;i<=4;i++){var x=c.x+d[0]*i,y=c.y+d[1]*i;if(x<0||y<0||x>=N||y>=M||wall[y][x])break;add(x,y)}}return v}
function solvable(){var seen={},q=[[pl.x,pl.y,0,0,0]];seen[pl.x+','+pl.y+',0,0']=1;var vc=[];for(var t=0;t<per;t++)vc.push(vis(t));var qi=0;while(qi<q.length){var s=q[qi++];if(s[0]===ex.x&&s[1]===ex.y&&s[2])return s[4];if(s[4]>60)continue;var t2=(s[3]+1)%per;for(var d=0;d<5;d++){var dx=d<4?DV[d][0]:0,dy=d<4?DV[d][1]:0,x=s[0]+dx,y=s[1]+dy;if(x<0||y<0||x>=N||y>=M||wall[y][x])continue;if(vc[t2][x+','+y])continue;var h=s[2]||(x===doc.x&&y===doc.y?1:0);var k=x+','+y+','+h+','+t2;if(seen[k])continue;seen[k]=1;q.push([x,y,h,t2,s[4]+1])}}return -1}
function gen(){for(var tr=0;tr<300;tr++){wall=[];for(var y=0;y<M;y++){wall.push([]);for(var x=0;x<N;x++)wall[y].push(Math.random()<.16?1:0)}pl={x:0,y:M-1};ex={x:0,y:M-1};wall[M-1][0]=0;wall[M-2][0]=0;wall[M-1][1]=0;

  for(var i=0;i<ng;i++){var hor=Math.random()<.5,len=GK.ri(3,5);var g={x:GK.ri(1,N-2),y:GK.ri(1,M-4),len:len,d:hor?[1,0]:[0,1]};var ok=true;for(var k=0;k<len;k++){var x=g.x+g.d[0]*k,y=g.y+g.d[1]*k;if(x>=N||y>=M||wall[y][x]){ok=false;break}}if(ok&&!(g.x<2&&g.y>M-4))gu.push(g)}
  for(var i=0;i<nc;i++){var x=GK.ri(1,N-1),y=GK.ri(0,M-3);if(!wall[y][x]&&!(x===doc.x&&y===doc.y))cam.push({x:x,y:y,o:GK.ri(0,3)})}
  per=4;for(var g of gu)per=lcm(per,2*(g.len-1));if(per>120)continue;
  var s=solvable();if(s>=8&&s<=50)return}
 wall=wall.map(function(r){return r.map(function(){return 0})});gu=[];cam=[]}
function step(dx,dy){var x=pl.x+dx,y=pl.y+dy;if(x<0||y<0||x>=N||y>=M||wall[y][x]){if(dx||dy)return}else{pl.x=x;pl.y=y}
 hist=hist||[];T++;GK.beep(300,.04,'square',.04);if(pl.x===doc.x&&pl.y===doc.y&&!has){has=1;GK.beep(900,.15,'triangle',.08,400);GK.float(GK.W()/2,GK.H()*.2,'¡Documento!','#ffd23a',24)}
 if(vis(T)[pl.x+','+pl.y]){GK.shake(14);GK.over('¡Te vieron!');return}

reset:function(){lvl=0;start()},
