function wf(u,v,f,o){var vv=v*f*.5,n=V3.fbm(u*f,vv,o||5);if(u>.85){var w=(u-.85)/.15,n2=V3.fbm((u-1)*f,vv,o||5);n=n+(n2-n)*w}return n}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function paint(w,h,fn){return V3.tex(V3.cvs(w,h,function(x){var id=x.createImageData(w,h),d=id.data;for(var j=0;j<h;j++)for(var i=0;i<w;i++){var c=fn(i/w,j/h),p=(j*w+i)*4;d[p]=c[0];d[p+1]=c[1];d[p+2]=c[2];d[p+3]=255}x.putImageData(id,0,0)}))}

O.onTap=function(x,y){var arr=mode==='solar'?hits:galHits,r=O.ray(x,y,arr,false);if(r.length){var u=r[0].object.userData;if(u.P)setFocus(u.P);else if(u.G)focusGal(u.G)}};
function buildBar(){bar.innerHTML='';chipEls={};
 if(mode==='solar'){chipEls.sistema=V3.chip(bar,'☀ Sistema solar',function(){setFocus(null)},true);PL.forEach(function(P){chipEls[P.n]=V3.chip(bar,P.n,function(){setFocus(P)})})}
 else{chipEls.gal0=V3.chip(bar,'Vista general',function(){O.follow=null;O.tgt.set(0,0,0);distT=420;focus=null;showCard(null)},true);GAL.forEach(function(G){V3.chip(bar,G.n,function(){focusGal(G)})})}
 side.innerHTML='';
 V3.chip(side,mode==='solar'?'🌌 Ir a las galaxias':'🪐 Volver al sistema solar',function(){setMode(mode==='solar'?'gal':'solar')});
 if(mode==='solar'){V3.chip(side,'⏩ Velocidad ×'+speed,function(b){speed=speed===1?10:speed===10?100:speed===100?0:1;b.textContent='⏩ Velocidad '+(speed?'×'+speed:'en pausa')});
  V3.chip(side,'🧭 Tour automático',function(b){tour=!tour;b.classList.toggle('on',tour);tourT=0;if(!tour){}});
  V3.chip(side,'🏷 Nombres',function(b){showLabels=!showLabels;b.classList.toggle('on',showLabels)},true);
  V3.chip(side,'⭕ Órbitas',function(b){showOrbits=!showOrbits;b.classList.toggle('on',showOrbits)},true)}}
buildBar();setFocus(null);
/* ---------- bucle ---------- */
var tmp=new T.Vector3();
V3.on(function(dt,t){
 if(mode==='solar'){
  bodies.forEach(function(P){if(P.a){P.ang+=P.omega*dt*speed*.35;P.group.position.set(Math.cos(P.ang)*P.a,0,Math.sin(P.ang)*P.a)}
   if(P.day){P.mesh.rotation.y+=(P.day>0?1:-1)*dt*Math.min(speed||0,10)*.9*(24/Math.min(Math.abs(P.day),200))*.12}else if(P.n==='Sol')P.mesh.rotation.y+=dt*.03;
   if(P.clouds)P.clouds.rotation.y+=dt*.02*speed;
   P.moonObjs.forEach(function(mm){var M=mm.userData.M;mm.userData.a+=dt*speed*.35*2*Math.PI/(M.T*1.4+1);mm.position.set(Math.cos(mm.userData.a)*M.d,Math.sin(mm.userData.a*.5)*.3,Math.sin(mm.userData.a)*M.d)});
   var d=cam.position.distanceTo(P.group.getWorldPosition(tmp));P.lb.visible=showLabels&&focus!==P;var s=Math.max(d*.075,P.r*1.4);P.lb.scale.set(s*2.4,s*.6,1);P.lb.position.y=P.r*1.5+s*.35;if(P.orbit)P.orbit.visible=showOrbits;
  });
  if(window.__belt)window.__belt.rotation.y+=dt*.004*speed;
  if(tour){tourT-=dt;if(tourT<=0){tourT=13;tourI=(tourI+1)%PL.length;setFocus(PL[tourI]);tour=true;O.auto=0}if(focus)O.yaw+=dt*.12}
 }else{GAL.forEach(function(G){G.group.rotation.y+=dt*.01;var d=cam.position.distanceTo(G.group.getWorldPosition(tmp));var s=Math.max(d*.1,G.R*.7);G.lb.scale.set(s*2.4,s*.6,1);G.lb.position.y=G.R*.4+s*.2;if(G.me){var q=Math.max(d*.04,3);G.me.scale.set(q*4,q,1)}});if(tour){}}
 O.dist+=(distT-O.dist)*(1-Math.exp(-3*dt));O.update(dt)});
document.addEventListener('visibilitychange',function(){});

var padOn=false;
function pad(){if(padOn)return;var ac=V3.audio();if(!ac)return;padOn=true;var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;var g=ac.createGain();g.gain.value=0;g.gain.setTargetAtTime(.07,ac.currentTime,3);lp.connect(g);g.connect(V3.master);
 [110,164.8,220,277.2,329.6].forEach(function(f,i){var o=ac.createOscillator();o.type=i%2?'sine':'triangle';o.frequency.value=f*(1+(i-2)*.0015);var og=ac.createGain();og.gain.value=.5/(1+i*.3);o.connect(og);og.connect(lp);o.start();var l=ac.createOscillator();l.frequency.value=.05+i*.02;var lg=ac.createGain();lg.gain.value=.25*og.gain.value;l.connect(lg);lg.connect(og.gain);l.start()});
 var l2=ac.createOscillator();l2.frequency.value=.04;var lg2=ac.createGain();lg2.gain.value=180;l2.connect(lg2);lg2.connect(lp.frequency);l2.start()}
addEventListener('pointerdown',pad,{once:true});
