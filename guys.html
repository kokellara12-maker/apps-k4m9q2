function respawn(r){var cp=checkpoints[0];checkpoints.forEach(function(c){if(r.z<c.z+2)cp=c});r.x=rnd(-3,3);r.z=cp.z-1;r.y=cp.y+3;r.vx=r.vy=r.vz=0;r.stun=.4;if(r.isP){GK.snd('splash',.4);bannerTxt='¡Ups!';banner=1}}
function spawnConfetti(x,y,z){for(var i=0;i<60;i++){var m=new T.Mesh(new T.PlaneGeometry(.18,.18),new T.MeshBasicMaterial({color:COLORS[i%12],side:T.DoubleSide}));m.position.set(x+rnd(-1,1),y+3,z+rnd(-1,1));scene.add(m);confetti.push({m:m,vx:rnd(-4,4),vy:rnd(4,10),vz:rnd(-4,4),t:3})}}
function botInput(r,dt){var tz=r.z-9,tx=r.lane;var goalSolid=null;
 // plataformas siguiente: buscar la plataforma mas cercana por delante
 var ahead=null,ad=1e9;solids.forEach(function(s){if(s.deco||s.peg||s.disc||s.hy===0||s.hy>1)return;if(s.cy+s.hy>.5)return;var dz=r.z-s.cz;if(dz>-s.hz&&dz<18){var d=dz;if(d<ad&&s.cz<r.z-.2){ad=d;ahead=s}}});
 var inGap=!r.stand;
 var mx=0,mz=0,jump=false,dive=false;
 // objetivo base
 var dx=tx-r.x;mx=Math.max(-1,Math.min(1,dx*.5))*.6;mz=-1;
 // evitar spinners: esperar
 spinners.forEach(function(s){var dz=r.z-s.z;if(dz>1&&dz<6.5&&r.y<s.y+1){var c=Math.cos(s.ang),sn=Math.sin(s.ang);var along=(r.x-s.x)*c+(r.z-s.z)*sn;var near=Math.abs(sn)<.7;if(Math.random()<.02+r.skill*.03||(!near&&dz<4)){}else if(near&&dz<4.5){mz=.0;mx*=.3}}});
 // huecos: saltar
 var ax=r.x+Math.sign(mx)*0,az=r.z-1.4;var floor=false;solids.forEach(function(s){if(s.deco||s.peg||s.hy===0)return;var top=s.cy+s.hy;if(Math.abs(az-s.cz)<s.hz&&Math.abs(r.x-s.cx)<s.hx&&Math.abs(top-r.y)<.9)floor=true;if(s.disc&&Math.hypot(r.x-s.cx,az-s.cz)<s.r)floor=true});
 if(!floor&&r.g&&r.jt<=0){jump=true;r.jt=.6}
 var st=r.stand;if(st&&st.hz<3.6&&!st.disc&&!st.peg&&st.hy<1){var nx=null;solids.forEach(function(s){if(s.deco||s.peg||s.disc||s.hy>.5||s===st)return;if(s.cz<st.cz-1&&s.cz>st.cz-10&&(!nx||s.cz>nx.cz))nx=s});if(nx){mx=Math.max(-1,Math.min(1,(nx.cx-r.x)*.9));mz=-1;if(r.z-(st.cz-st.hz)<1.1&&r.jt<=0){jump=true;r.jt=.5}}}
 // discos: empuja al centro
 r.jt-=dt;if(r.g&&Math.random()<dt*.15*(1-r.skill*.5))jump=true;if(r.stand&&r.stand.disc){mx=Math.max(-1,Math.min(1,(r.stand.cx-r.x)*.4));}
 if(Math.random()<dt*.05*(1.2-r.skill))r.lane=rnd(-5,5);
 if(r.fin){mx=0;mz=0}
 return [mx,mz,jump,dive]}
G3.update=function(dt){time+=dt;
 // cuenta atras
 if(state==='count'){cdT-=dt;var n=Math.ceil(cdT-.4);if(cdT>.4){bannerTxt=''+Math.max(1,n);banner=1}else if(cdT>0){bannerTxt='¡YA!';banner=1}else{state='run';banner=0.6;bannerTxt='¡CORRE!'}
  runners.forEach(function(r){physics(r,dt,0,0,false,false)});return}
 solids.forEach(function(s){if(s.mv){var ox=s.cx,oz=s.cz;s.mv(s,time);s.dx=s.cx-ox;s.dz=s.cz-oz;s.mesh.position.x=s.cx;s.mesh.position.z=s.cz}if(s.disc){var w=1.0;s.dang=w*dt;s.w=w;s.ang+=s.dang;s.mesh.rotation.y=-s.ang;s.dx=0;s.dz=0}});
 spinners.forEach(function(s){s.ang+=s.sp*dt;s.m.rotation.y=-s.ang});
 runners.forEach(function(r){var mx=0,mz=0,jump=false,dive=false;if(r.isP&&window.__auto){var bi0=botInput(r,dt);mx=bi0[0];mz=bi0[1];jump=bi0[2];r.fin&&(mx=mz=0)}else if(r.isP){if(joy){var L=Math.hypot(joy.dx,joy.dy);if(L>8){var k=Math.min(1,L/55);mx=joy.dx/L*k;mz=joy.dy/L*k}}if(GK.keys.KeyA||GK.keys.ArrowLeft)mx-=1;if(GK.keys.KeyD||GK.keys.ArrowRight)mx+=1;if(GK.keys.KeyW||GK.keys.ArrowUp)mz-=1;if(GK.keys.KeyS||GK.keys.ArrowDown)mz+=1;var ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml}jump=jumpReq;dive=diveReq;jumpReq=diveReq=false;if(r.fin){mx=mz=0}}else{var bi=botInput(r,dt);mx=bi[0];mz=bi[1];jump=bi[2];dive=bi[3]}
  physics(r,dt,mx,mz,jump,dive);
  // animacion
  var m=r.m,sp=Math.hypot(r.vx,r.vz);if(sp>.4||r.stun>0)m.rotation.y=r.stun>0?m.rotation.y+dt*14:Math.atan2(r.vx,r.vz)+0;r.ph+=dt*sp*1.8;var sw=Math.sin(r.ph)*Math.min(1,sp/4);m.userData.legs[0].rotation.x=sw*.9;m.userData.legs[1].rotation.x=-sw*.9;m.userData.arms[0].rotation.x=-sw*.8+(r.g?0:-2.2);m.userData.arms[1].rotation.x=sw*.8+(r.g?0:-2.2);
  if(r.dive>0)m.userData.body.rotation.x=Math.PI/2.6;else m.userData.body.rotation.x*=.7;m.position.set(r.x,r.y,r.z);if(m.userData.ar)m.userData.ar.position.y=2.4+Math.sin(time*5)*.12});
 banner=Math.max(0,banner-dt);
 confetti.forEach(function(c){c.t-=dt;c.vy-=12*dt;c.m.position.x+=c.vx*dt;c.m.position.y+=c.vy*dt;c.m.position.z+=c.vz*dt;c.m.rotation.x+=dt*6;c.m.rotation.y+=dt*5;if(c.t<=0)c.m.visible=false});
 if(time>150&&!P.fin){GK.over('Se acabó el tiempo')}
};
G3.frame=function(dt){if(!P)return;var asp=GK.W()/GK.H();var tx=P.x*.6,ty=P.y+4.0+(asp>1.3?0:1.5),tz=P.z+(asp>1.3?7.4:9.5);var k=Math.min(1,dt*5);cam.position.x+=(tx-cam.position.x)*k;cam.position.y+=(ty-cam.position.y)*k;cam.position.z+=(tz-cam.position.z)*k;cam.lookAt(P.x*.8,P.y+1.0,P.z-4.5);cam.fov=asp>1.3?58:68;cam.updateProjectionMatrix();sun.position.set(P.x+14,34,P.z+10);sun.target.position.set(P.x,0,P.z);sun.target.updateMatrixWorld();
 if(GK.state()!=='play'){cam.position.set(Math.sin(performance.now()/3000)*8,5,-6+Math.cos(performance.now()/4000)*3);cam.lookAt(0,1,-18)}};
G3.draw=function(c,W,H){if(!P||GK.state()!=='play')return;
 // posicion
 var ord=runners.slice().sort(function(a,b){return (b.fin?1e6-b.rank:-b.z)-(a.fin?1e6-a.rank:-a.z)});var pos=ord.indexOf(P)+1;
 GK.text('PUESTO '+pos+' / '+runners.length,W/2,70,20,'#fff');
 // barra de progreso
 var bw=Math.min(300,W*.4),bx=W/2-bw/2,by=96;GK.rr(bx,by,bw,8,4,'rgba(0,0,0,.45)');var tot=-finishZ;runners.forEach(function(r){var f=Math.max(0,Math.min(1,-r.z/tot));c.fillStyle=r.isP?'#ffe03a':'rgba(255,255,255,.7)';c.beginPath();c.arc(bx+bw*f,by+4,r.isP?6:3.5,0,7);c.fill()});
 if(banner>0)GK.text(bannerTxt,W/2,H*.38,(bannerTxt.length<3?90:46)*Math.min(1,banner*1.5+.3),'#fff');
 GK.text(Math.floor(time/60)+':'+('0'+Math.floor(time%60)).slice(-2),W/2,H-24,16,'rgba(255,255,255,.8)');
 if(joy){c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=3;c.beginPath();c.arc(joy.ox,joy.oy,52,0,7);c.stroke();c.fillStyle='rgba(255,255,255,.4)';var L=Math.min(52,Math.hypot(joy.dx,joy.dy)),a=Math.atan2(joy.dy,joy.dx);c.beginPath();c.arc(joy.ox+Math.cos(a)*L,joy.oy+Math.sin(a)*L,24,0,7);c.fill()}};
GK.start({three:true,exposure:1.0,fov:58,pr:1.5,title:'KOKE GUYS',color:'#ff5aa8',bg:'#9ad8ff',help:'Carrera de obstáculos contra 11 bots: esquiva barras giratorias, puertas deslizantes, plataformas y discos. Izquierda: moverte · SALTAR y LANZARSE a la derecha. ¡Llega primero a la meta!',init:init,reset:G3.reset,update:G3.update,frame:G3.frame,draw:G3.draw,down:G3.down,move:G3.move,up:G3.up,key:G3.key});
})();
