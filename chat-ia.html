<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0614">
<title>Chat IA</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#0a0614;--panel:#150d28;--panel2:#1d1236;--line:#2e2150;--ink:#f1ecff;--dim:#9d92c2;--cyan:#00f0ff;--mag:#ff2bd6;--bad:#ff5d73;--ok:#3dff9a;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:radial-gradient(120% 60% at 50% -10%,#24104a 0%,var(--bg) 60%)}
header{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:rgba(10,6,20,.85)}
.pill{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--cyan);color:var(--cyan);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;background:rgba(0,240,255,.07)}
header h1{flex:1;margin:0;font-size:17px;text-align:center;letter-spacing:.5px;color:var(--ink);text-shadow:0 0 12px var(--mag);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:17px;display:flex;align-items:center;justify-content:center;padding:0}
.ib:active{border-color:var(--mag)}
#msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px;display:flex;flex-direction:column;gap:12px;user-select:text;-webkit-user-select:text}
.empty{margin:auto;text-align:center;color:var(--dim);padding:20px;line-height:1.5}
.empty b{display:block;font-size:22px;color:var(--cyan);text-shadow:0 0 14px rgba(0,240,255,.5);margin-bottom:6px}
.m{max-width:92%;padding:10px 13px;border-radius:16px;font-size:16px;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}
.m.user{align-self:flex-end;background:linear-gradient(135deg,#3b0f5c,#5a0e57);border:1px solid var(--mag);border-bottom-right-radius:4px;white-space:pre-wrap}
.m.model{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.err{align-self:stretch;max-width:100%;background:rgba(255,93,115,.1);border:1px solid var(--bad);color:#ffc2cb;font-size:15px}
.m p{margin:0 0 8px}.m p:last-child,.m ul:last-child,.m ol:last-child{margin-bottom:0}
.m ul,.m ol{margin:0 0 8px;padding-left:22px}.m li{margin:2px 0}
.m h3,.m h4{margin:6px 0 6px;font-size:17px;color:var(--cyan)}
.m a{color:var(--cyan)}
.m strong{color:#fff}.m em{color:#ffd7f7}
.m code{font-family:var(--mono);font-size:14px;background:#0a0614;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--cyan)}
.cb{margin:6px 0 8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#07040f}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 10px;background:var(--panel2);font-size:12px;color:var(--dim);font-family:var(--mono)}
.cbh button{border:1px solid var(--cyan);background:transparent;color:var(--cyan);border-radius:10px;font-size:12px;padding:3px 10px}
.cb pre{margin:0;padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cb pre code{background:none;border:0;padding:0;color:#e9e4ff;font-size:13px;white-space:pre}
.cur::after{content:"▍";color:var(--cyan);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.dots{display:inline-flex;gap:4px;padding:4px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mag);animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{opacity:.25}50%{opacity:1}}
#bar{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);border-top:1px solid var(--line);background:rgba(10,6,20,.92)}
body.kb #bar{padding-bottom:8px}
#inp{flex:1;resize:none;max-height:140px;min-height:42px;border-radius:21px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:16px/1.35 var(--font);padding:10px 15px;outline:none;user-select:text;-webkit-user-select:text}
#inp:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,240,255,.15)}
#send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--cyan),var(--mag));color:#0a0614;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
#send.stop{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:760px;margin:0 auto;max-height:85dvh;max-height:85vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .22s;visibility:hidden;user-select:text;-webkit-user-select:text}
.sheet.on{transform:none;visibility:visible}
.sheet h2{margin:0 0 12px;font-size:18px;color:var(--cyan)}
.sheet label{display:block;margin:12px 0 5px;font-size:13px;color:var(--dim)}
.sheet input,.sheet select,.sheet textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:#0a0614;color:var(--ink);font:16px var(--font);padding:11px 12px;outline:none}
.sheet textarea{min-height:90px;resize:vertical}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{border-color:var(--cyan)}
.sheet a{color:var(--cyan)}.hint{font-size:13px;color:var(--dim);line-height:1.45;margin-top:6px}
.btn{display:block;width:100%;margin-top:16px;padding:12px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--cyan),var(--mag));color:#0a0614;font-weight:800;font-size:16px}
.btn.sec{background:transparent;border:1px solid var(--cyan);color:var(--cyan);margin-top:0;margin-bottom:12px}
.ci{display:flex;align-items:center;gap:8px;margin:6px 0}
.ci .t{flex:1;min-width:0;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0a0614;overflow:hidden}
.ci .t.act{border-color:var(--mag);box-shadow:0 0 10px rgba(255,43,214,.25)}
.ci .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .t small{color:var(--dim);font-size:12px}
.ci .x{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--bad);background:transparent;color:var(--bad);font-size:17px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;border:1px solid var(--cyan);color:var(--cyan);padding:8px 14px;border-radius:14px;font-size:14px;z-index:40;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="pill" href="index.html">‹ Apps</a>
    <h1 id="title">Chat IA</h1>
    <button class="ib" id="bChats" aria-label="Chats">💬</button>
    <button class="ib" id="bSet" aria-label="Ajustes">⚙️</button>
  </header>
  <div id="msgs"></div>
  <div id="bar">
    <textarea id="inp" rows="1" placeholder="Escribe un mensaje…" enterkeyhint="send" autocomplete="off"></textarea>
    <button id="send" aria-label="Enviar">➤</button>
  </div>
</div>
<div class="ov" id="ov"></div>
<div class="sheet" id="shSet">
  <h2>Ajustes</h2>
  <label for="key">Clave API de Google Gemini</label>
  <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…">
  <div class="hint">Consigue una clave gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/apikey</a>. Se guarda solo en este móvil (localStorage) y solo se envía a Google.</div>
  <label for="model">Modelo</label>
  <select id="model"><option value="gemini-2.5-flash">gemini-2.5-flash (rápido)</option><option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (el más ligero)</option><option value="gemini-2.5-pro">gemini-2.5-pro (el más listo)</option></select>
  <label for="sys">Instrucciones del sistema</label>
  <textarea id="sys"></textarea>
  <button class="btn" id="saveSet">Guardar</button>
</div>
<div class="sheet" id="shChats">
  <h2>Tus chats</h2>
  <button class="btn sec" id="newChat">＋ Nuevo chat</button>
  <div id="clist"></div>
</div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var DEF_SYS='Responde siempre en español, de forma corta y directa.';
var $=function(id){return document.getElementById(id)};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var chats=[];try{chats=JSON.parse(lsGet('chatia-chats','[]'));if(!Array.isArray(chats))chats=[]}catch(e){chats=[]}
var curId=lsGet('chatia-cur','');
var busy=false,ctrl=null;
function save(){lsSet('chatia-chats',JSON.stringify(chats));lsSet('chatia-cur',curId)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cur(){for(var i=0;i<chats.length;i++)if(chats[i].id===curId)return chats[i];return null}
function newChat(){var c={id:uid(),title:'Chat nuevo',ts:Date.now(),msgs:[]};chats.unshift(c);curId=c.id;save();return c}
if(!cur()){curId=chats.length?chats[0].id:'';}

/* ---------- markdown seguro: se escapa TODO primero ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function inline(raw){
  var codes=[];
  var s=esc(raw).replace(/`([^`\n]+)`/g,function(_,c){codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)&"<>]+(?:&amp;[^\s)&"<>]*)*)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<>"]+[^\s<>".,;:!?)])/g,function(m,a,u){return u.indexOf('&quot;')>=0?m:a+'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'});
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>').replace(/__([^_\n]+?)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\*)/g,'$1<em>$2</em>').replace(/(^|[^_\w])_([^_\s][^_\n]*?)_(?![_\w])/g,'$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g,function(_,i){return '<code>'+codes[+i]+'</code>'});
}
function block(text){
  var lines=text.split('\n'),out=[],i=0,para=[];
  function flush(){if(para.length){out.push('<p>'+para.map(inline).join('<br>')+'</p>');para=[]}}
  while(i<lines.length){
    var l=lines[i],m;
    if(/^\s*$/.test(l)){flush();i++;continue}
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){flush();out.push('<h'+(m[1].length<3?3:4)+'>'+inline(m[2])+'</h'+(m[1].length<3?3:4)+'>');i++;continue}
    if(/^\s*[-*+]\s+/.test(l)||/^\s*\d+[.)]\s+/.test(l)){
      flush();var ord=/^\s*\d+[.)]\s+/.test(l),re=ord?/^\s*\d+[.)]\s+(.*)$/:/^\s*[-*+]\s+(.*)$/,it=[];
      while(i<lines.length&&(m=lines[i].match(re))){it.push('<li>'+inline(m[1])+'</li>');i++}
      out.push((ord?'<ol>':'<ul>')+it.join('')+(ord?'</ol>':'</ul>'));continue}
    para.push(l);i++;
  }
  flush();return out.join('');
}
function md(text){
  var parts=text.split(/(```[^\n]*\n[\s\S]*?(?:```|$))/),h='';
  for(var i=0;i<parts.length;i++){
    var p=parts[i],m=p.match(/^```([^\n]*)\n([\s\S]*?)(?:```)?$/);
    if(m&&p.indexOf('```')===0){
      var code=m[2].replace(/\n$/,'');
      h+='<div class="cb"><div class="cbh"><span>'+esc(m[1].trim()||'código')+'</span><button type="button" data-copy="1">Copiar</button></div><pre><code>'+esc(code)+'</code></pre></div>';
    }else h+=block(p);
  }
  return h;
}

/* ---------- UI ---------- */
var msgsEl=$('msgs');
function nearBottom(){return msgsEl.scrollHeight-msgsEl.scrollTop-msgsEl.clientHeight<80}
function toBottom(){msgsEl.scrollTop=msgsEl.scrollHeight}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},1600)}
function addBubble(role,text,stream){
  var d=document.createElement('div');d.className='m '+role;
  if(role==='user')d.textContent=text;else if(role==='err')d.textContent=text;else d.innerHTML=md(text);
  msgsEl.appendChild(d);return d;
}
function render(){
  var c=cur();msgsEl.textContent='';
  $('title').textContent=c?c.title:'Chat IA';
  if(!c||!c.msgs.length){var e=document.createElement('div');e.className='empty';e.innerHTML='<b>Chat IA</b>Pregúntame lo que quieras.<br>Pon tu clave de Gemini en ⚙️ para empezar.';msgsEl.appendChild(e);return}
  c.msgs.forEach(function(m){addBubble(m.e?'err':m.r==='user'?'user':'model',m.t)});
  toBottom();
}
function renderList(){
  var l=$('clist');l.textContent='';
  if(!chats.length){var p=document.createElement('div');p.className='hint';p.textContent='Aún no hay chats.';l.appendChild(p)}
  chats.forEach(function(c){
    var r=document.createElement('div');r.className='ci';
    var t=document.createElement('button');t.className='t'+(c.id===curId?' act':'');t.dataset.open=c.id;
    var b=document.createElement('b');b.textContent=c.title;var s=document.createElement('small');
    s.textContent=new Date(c.ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' · '+c.msgs.length+' mensajes';
    t.appendChild(b);t.appendChild(s);
    var x=document.createElement('button');x.className='x';x.dataset.del=c.id;x.textContent='🗑';x.setAttribute('aria-label','Borrar chat');
    r.appendChild(t);r.appendChild(x);l.appendChild(r);
  });
}
function openSheet(id){closeSheets();$('ov').classList.add('on');$(id).classList.add('on')}
function closeSheets(){$('ov').classList.remove('on');$('shSet').classList.remove('on');$('shChats').classList.remove('on')}
$('ov').addEventListener('click',closeSheets);
$('bChats').addEventListener('click',function(){renderList();openSheet('shChats')});
function openSettings(){$('key').value=lsGet('chatia-key','');$('model').value=lsGet('chatia-model','gemini-2.5-flash');$('sys').value=lsGet('chatia-sys',DEF_SYS);openSheet('shSet')}
$('bSet').addEventListener('click',openSettings);
$('saveSet').addEventListener('click',function(){
  lsSet('chatia-key',$('key').value.trim());lsSet('chatia-model',$('model').value);lsSet('chatia-sys',$('sys').value.trim()||DEF_SYS);
  closeSheets();toast('Guardado ✓');
});
$('newChat').addEventListener('click',function(){if(busy)return;var c=cur();if(!(c&&!c.msgs.length))newChat();closeSheets();render();$('inp').focus()});
$('clist').addEventListener('click',function(e){
  var d=e.target.closest('[data-del]'),o=e.target.closest('[data-open]');
  if(d){if(busy)return;if(!confirm('¿Borrar este chat?'))return;
    chats=chats.filter(function(c){return c.id!==d.dataset.del});
    if(curId===d.dataset.del)curId=chats.length?chats[0].id:'';
    save();renderList();render();return}
  if(o){if(busy)return;curId=o.dataset.open;save();closeSheets();render()}
});
msgsEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-copy]');if(!b)return;
  var code=b.closest('.cb').querySelector('code').textContent;
  function ok(){b.textContent='¡Copiado!';setTimeout(function(){b.textContent='Copiar'},1200)}
  function fb(){var t=document.createElement('textarea');t.value=code;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(x){}document.body.removeChild(t)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(ok,fb);else fb();
});

/* ---------- teclado iOS ---------- */
var app=$('app');
function fit(){
  var vv=window.visualViewport;if(!vv)return;
  app.style.height=vv.height+'px';app.style.top=vv.offsetTop+'px';
  document.body.classList.toggle('kb',window.innerHeight-vv.height>120);
  window.scrollTo(0,0);
}
if(window.visualViewport){visualViewport.addEventListener('resize',function(){fit();toBottom()});visualViewport.addEventListener('scroll',fit);fit()}
var inp=$('inp');
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'}
inp.addEventListener('input',grow);
inp.addEventListener('focus',function(){setTimeout(toBottom,300)});

/* ---------- API ---------- */
function setBusy(b){busy=b;var s=$('send');s.classList.toggle('stop',b);s.textContent=b?'■':'➤';s.setAttribute('aria-label',b?'Parar':'Enviar')}
function friendly(status,body){
  var msg='';try{msg=JSON.parse(body).error.message||''}catch(e){}
  if(status===429)return '⏳ Has llegado al límite de uso gratis de Gemini (429). Espera un minuto y vuelve a intentarlo, o prueba el modelo gemini-2.5-flash-lite.';
  if(status===400){if(/api key|API_KEY/i.test(msg))return '🔑 La clave API no es válida (400). Revísala en ⚙️ Ajustes.';return '⚠️ Petición rechazada (400)'+(msg?': '+msg:'')+'. Revisa tu clave y el modelo en ⚙️ Ajustes.'}
  if(status===401||status===403)return '🔑 Clave API sin permiso ('+status+'). Revísala en ⚙️ Ajustes.';
  if(status===404)return '⚠️ Modelo no encontrado (404). Elige otro en ⚙️ Ajustes.';
  if(status>=500)return '🛠️ Google tiene problemas ahora mismo ('+status+'). Inténtalo en un rato.';
  return '⚠️ Error '+status+(msg?': '+msg:'');
}
function pushErr(c,t){c.msgs.push({r:'model',t:t,e:1});save();render()}
async function send(){
  if(busy){if(ctrl)ctrl.abort();return}
  var text=inp.value.trim();if(!text)return;
  var key=lsGet('chatia-key','').trim();
  if(!key){toast('Falta la clave API');openSettings();return}
  if(!navigator.onLine){var cc=cur()||newChat();cc.msgs.push({r:'user',t:text});inp.value='';grow();pushErr(cc,'📴 Sin internet: la IA necesita conexión, pero tus chats se pueden leer.');return}
  var c=cur()||newChat();
  c.msgs.push({r:'user',t:text});c.ts=Date.now();
  if(c.msgs.length===1)c.title=text.length>32?text.slice(0,32)+'…':text;
  inp.value='';grow();save();render();
  var hist=c.msgs.filter(function(m){return !m.e}).map(function(m){return {role:m.r,parts:[{text:m.t}]}});
  var bub=addBubble('model','');bub.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';toBottom();
  var acc='',model=lsGet('chatia-model','gemini-2.5-flash');
  ctrl=new AbortController();setBusy(true);
  var errText=null;
  try{
    var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse&key='+encodeURIComponent(key),{
      method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({systemInstruction:{parts:[{text:lsGet('chatia-sys',DEF_SYS)}]},contents:hist})});
    if(!res.ok){errText=friendly(res.status,await res.text())}
    else{
      var block_=null;
      function handle(line){
        if(line.indexOf('data:')!==0)return;
        var j;try{j=JSON.parse(line.slice(5).trim())}catch(e){return}
        if(j.promptFeedback&&j.promptFeedback.blockReason)block_='🚫 Gemini ha bloqueado esta petición ('+j.promptFeedback.blockReason+'). Prueba a reformularla.';
        var cand=j.candidates&&j.candidates[0];
        if(cand&&cand.content&&cand.content.parts)cand.content.parts.forEach(function(p){if(p.text&&!p.thought)acc+=p.text});
        if(cand&&cand.finishReason==='SAFETY'&&!acc)block_='🚫 Respuesta bloqueada por seguridad. Prueba a reformular.';
      }
      var pend='',stick=true;
      function paint(fin){var st=nearBottom();bub.innerHTML=md(acc);if(!fin&&acc){var l=bub.lastElementChild;(l||bub).classList.add('cur')}if(st)toBottom()}
      if(res.body&&res.body.getReader){
        var rd=res.body.getReader(),dec=new TextDecoder();
        for(;;){var r=await rd.read();if(r.done)break;
          pend+=dec.decode(r.value,{stream:true});var ls=pend.split(/\r?\n/);pend=ls.pop();ls.forEach(handle);paint(false)}
        pend+=dec.decode();if(pend)handle(pend);
      }else{(await res.text()).split(/\r?\n/).forEach(handle)}
      if(!acc&&block_)errText=block_;
      else if(!acc)errText='🤷 La IA no devolvió respuesta. Inténtalo de nuevo.';
    }
  }catch(e){
    if(e&&e.name==='AbortError'){if(!acc)errText='⏹ Detenido.'}
    else errText=navigator.onLine===false||/fetch|network|load failed/i.test(String(e&&e.message))?'📴 Sin internet: la IA necesita conexión, pero tus chats se pueden leer.':'⚠️ Error inesperado: '+(e&&e.message||e);
  }
  ctrl=null;setBusy(false);
  if(acc){c.msgs.push({r:'model',t:acc});if(errText&&errText!=='⏹ Detenido.')c.msgs.push({r:'model',t:errText,e:1})}
  else if(errText&&errText!=='⏹ Detenido.')c.msgs.push({r:'model',t:errText,e:1});
  c.ts=Date.now();save();if(curId===c.id)render();
}

render();
})();
