<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Apps">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0614">
<title>Mis Apps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Hub de juegos: cabecera grande, tarjetas en rejilla, estado offline arriba a la derecha */
  :root {
    --bg: #0a0614;
    --panel: #150d2a;
    --line: #2d2052;
    --ink: #f1ecff;
    --dim: #9a8fc2;
    --cyan: #00f0ff;
    --mag: #ff2bd6;
    --yel: #ffd23f;
    --ok: #3dff9a;
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 20px 40px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  header { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
  h1 {
    margin: 0;
    font-size: clamp(44px, 13vw, 76px);
    line-height: 0.92;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 0.005em;
    text-shadow: 0 0 24px rgba(255, 43, 214, 0.6);
  }
  h1 span { color: var(--cyan); text-shadow: 0 0 24px rgba(0, 240, 255, 0.55); }

  #status {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--dim);
    font-size: 13px;
    font-weight: 700;
  }
  #status i { width: 9px; height: 9px; border-radius: 50%; background: var(--yel); flex: none; }
  #status[data-s="ok"] i { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  #status[data-s="off"] i { background: var(--mag); }

  #tip {
    margin: 0;
    padding: 12px 14px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--dim);
    font-size: 14px;
    line-height: 1.5;
  }
  #tip b { color: var(--ink); }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
  .game {
    --c: var(--cyan);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    color: inherit;
    text-decoration: none;
    box-shadow: inset 0 0 0 1px transparent;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .game:hover, .game:focus-visible {
    border-color: var(--c);
    box-shadow: 0 0 22px color-mix(in srgb, var(--c) 35%, transparent);
    outline: none;
  }
  .game:active { transform: scale(0.985); }
  .game h2 { margin: 0; font-size: 22px; font-weight: 900; font-style: italic; color: var(--c); overflow-wrap: anywhere; }
  .game p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span {
    padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .play { margin-top: auto; font-weight: 900; color: var(--c); }

  .more { border-style: dashed; color: var(--dim); }
  .more:hover { border-color: var(--line); box-shadow: none; }
  .more h2 { color: var(--dim); font-size: 18px; }

  @media (prefers-reduced-motion: reduce) { .game { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>MIS<br><span>APPS</span></h1>
    <div id="status" data-s="work"><i></i><span id="statusText">Comprobando…</span></div>
  </header>

  <p id="tip" hidden>Para tenerlos como app: toca <b>Compartir</b> en Safari y luego <b>Añadir a pantalla de inicio</b>. Ábrela una vez con internet y después funciona sin conexión.</p>

  <section id="grid" aria-label="Lista de apps"></section>
</main>

<script>
(function () {
  var FALLBACK = [
    { nombre: 'Neon Runner 3D', desc: 'Corre por una autopista neón, esquiva muros y recoge monedas.', href: 'runner3d.html', tags: ['3D', 'táctil', 'récord'], color: '#00f0ff' },
    { nombre: 'Calculadora', desc: 'Calculadora normal con coma decimal, % y borrar.', href: 'calculadora.html', tags: ['app', 'simple'], color: '#ff2bd6' }
  ];

  var grid = document.getElementById('grid');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');

  function setStatus(kind, text) {
    status.setAttribute('data-s', kind);
    statusText.textContent = text;
  }

  // consejo de instalación solo si no está ya instalada
  var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (!standalone) document.getElementById('tip').hidden = false;

  function card(g) {
    var a = document.createElement('a');
    a.className = 'game';
    a.href = g.href;
    if (g.color) a.style.setProperty('--c', g.color);
    var h = document.createElement('h2');
    h.textContent = g.nombre;
    var p = document.createElement('p');
    p.textContent = g.desc || '';
    a.appendChild(h);
    a.appendChild(p);
    if (g.tags && g.tags.length) {
      var t = document.createElement('div');
      t.className = 'tags';
      g.tags.forEach(function (x) {
        var s = document.createElement('span');
        s.textContent = x;
        t.appendChild(s);
      });
      a.appendChild(t);
    }
    var pl = document.createElement('div');
    pl.className = 'play';
    pl.textContent = 'Abrir ›';
    a.appendChild(pl);
    return a;
  }

  function more() {
    var d = document.createElement('div');
    d.className = 'game more';
    var h = document.createElement('h2');
    h.textContent = 'Próxima app';
    var p = document.createElement('p');
    p.textContent = 'Pídelo, súbelo y aparecerá aquí solo.';
    d.appendChild(h);
    d.appendChild(p);
    return d;
  }

  function render(list) {
    grid.textContent = '';
    list.forEach(function (g) { grid.appendChild(card(g)); });
    grid.appendChild(more());
  }

  function loadList() {
    return fetch('juegos.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('lista'); return r.json(); })
      .then(function (j) { return j.juegos && j.juegos.length ? j.juegos : FALLBACK; })
      .catch(function () { return FALLBACK; });
  }

  // descarga cada juego para que funcione sin internet
  function saveAll(list) {
    var ok = 0;
    return list.reduce(function (p, g) {
      return p.then(function () {
        return fetch(g.href, { cache: 'reload' })
          .then(function (r) { if (r.ok) ok++; })
          .catch(function () {
            return caches.match(g.href).then(function (hit) { if (hit) ok++; });
          });
      });
    }, Promise.resolve()).then(function () { return ok; });
  }

  function plural(n) { return n + (n === 1 ? ' app guardada' : ' apps guardadas'); }

  loadList().then(function (list) {
    render(list);

    if (!('serviceWorker' in navigator) || !('caches' in window)) {
      setStatus('off', 'Este navegador no guarda para offline');
      return;
    }
    if (!navigator.onLine) {
      setStatus('off', 'Sin conexión · usando lo guardado');
      return;
    }
    setStatus('work', 'Guardando para jugar sin internet…');
    navigator.serviceWorker.register('sw.js').then(function () {
      return navigator.serviceWorker.ready;
    }).then(function () {
      return saveAll(list);
    }).then(function (ok) {
      if (ok === list.length) setStatus('ok', 'Listo sin internet · ' + plural(ok));
      else setStatus('work', 'Faltan apps por guardar (' + ok + '/' + list.length + ')');
    }).catch(function () {
      setStatus('off', 'No se pudo activar el modo offline');
    });
  });

  window.addEventListener('offline', function () { setStatus('off', 'Sin conexión · usando lo guardado'); });
})();
</script>
</body>
</html>
