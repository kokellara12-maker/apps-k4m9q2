<html lang="es">
<head><script>try{var A=navigator.audioSession;if(A){A.type="ambient";Object.defineProperty(A,"type",{get:function(){return"ambient"},set:function(v){},configurable:true})}}catch(e){}</script>

<style>
  /* Librería de apps: cabecera grande y cuadrícula de tarjetas con icono, nombre y qué hace */
  :root {
    --bg: #0a0614;
    --panel: #150d2a;
    --line: #2d2052;
    --ink: #f1ecff;
    --dim: #a69fc4;
    --cyan: #00f0ff;
    --mag: #ff2bd6;
    --yel: #ffd23f;
    --ok: #3dff9a;
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body { height: 100%; overflow: hidden; }
  #sc { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 20px 16px 40px; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  header { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
  h1 {
    margin: 0;
    font-size: clamp(44px, 13vw, 76px);
    line-height: 0.92;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 0.005em;
    text-shadow: 0 0 24px rgba(255, 43, 214, 0.6);
  }
  h1 span { color: var(--cyan); text-shadow: 0 0 24px rgba(0, 240, 255, 0.55); }

  #status {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--dim);
    font-size: 13px;
    font-weight: 700;
  }
  #status i { width: 9px; height: 9px; border-radius: 50%; background: var(--yel); flex: none; }
  #status[data-s="ok"] i { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  #status[data-s="off"] i { background: var(--mag); }

  #snd { margin-top: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: #fff; font: 700 13px/1 inherit; cursor: pointer; }
  #snd.off { color: var(--mag); border-color: var(--mag); }
  #tip {
    margin: 0;
    padding: 12px 14px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--dim);
    font-size: 14px;
    line-height: 1.5;
  }
  #tip b { color: var(--ink); }

  #grid { display: flex; flex-direction: column; gap: 26px; }
  .sec h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .sec h3 small { margin-left: auto; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: 12px; font-weight: 700; }
  .sec h3::after { content: none; }
  .g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 12px; }
  @media (min-width: 560px) { .g { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); } }
  #bar { position: sticky; top: -1px; z-index: 5; margin: 0 -16px; padding: 8px 16px 10px; background: rgba(10,6,20,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 9px; border-bottom: 1px solid var(--line); }
  #q { position: relative; }
  #q input { width: 100%; font: 600 16px var(--font); color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 40px 12px 40px; outline: none; -webkit-appearance: none; appearance: none; }
  #q input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,240,255,.15); }
  #q input::placeholder { color: var(--dim); font-weight: 500; }
  #q i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 17px; pointer-events: none; }
  #q button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--line); color: var(--ink); font-size: 14px; display: none; }
  .row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .row::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font: 800 14px var(--font); padding: 8px 14px; border-radius: 999px; white-space: nowrap; touch-action: manipulation; }
  .chip small { opacity: .6; font-weight: 700; margin-left: 4px; }
  .chip.on { background: var(--cyan); border-color: var(--cyan); color: #04222b; }
  .row.s .chip { font-size: 13px; padding: 6px 11px; }
  .row.s .chip.on { background: var(--mag); border-color: var(--mag); color: #fff; }
  .none { text-align: center; color: var(--dim); font-size: 16px; font-weight: 700; padding: 40px 10px; line-height: 1.6; }
  .tile {
    --c: var(--cyan);
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    text-decoration: none;
    transition: transform 0.12s;
  }
  .tile:active { transform: scale(0.95); }
  .tile:focus-visible { outline: 2px solid var(--c); outline-offset: 4px; border-radius: 24px; }
  .ic {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 22.5%;
    display: grid;
    place-items: center;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .ic svg { width: 50%; height: 50%; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ic b { font-size: 40px; font-weight: 800; line-height: 1; }
  .tile h2 { margin: 2px 0 0; font-size: 13.5px; line-height: 1.15; font-weight: 800; overflow-wrap: anywhere; text-align: center; }
  .tile p { margin: 0; color: var(--dim); font-size: 11px; line-height: 1.3; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  #sp { position: fixed; inset: 0; z-index: 120; background: radial-gradient(90% 70% at 50% 40%, #2a1c55, #0a0614 75%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .45s ease, transform .45s ease; }
  #sp.out { opacity: 0; transform: scale(1.08); pointer-events: none; }
  #sp img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 0 0 0 rgba(160,120,255,.6), 0 14px 50px rgba(0,0,0,.6); animation: spl .7s cubic-bezier(.2,1.6,.4,1) both, spg 1.4s ease-out .5s both; }
  @keyframes spl { from { opacity: 0; transform: scale(.3) rotate(-14deg); } to { opacity: 1; transform: none; } }
  @keyframes spg { 0% { box-shadow: 0 0 0 0 rgba(160,120,255,.6), 0 14px 50px rgba(0,0,0,.6); } 100% { box-shadow: 0 0 0 46px rgba(160,120,255,0), 0 14px 50px rgba(0,0,0,.6); } }
  #sp b { font: 900 38px/1 var(--font); letter-spacing: .06em; color: #fff; display: flex; }
  #sp b i { font-style: normal; display: inline-block; opacity: 0; animation: spt .5s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(.55s + var(--k) * 70ms); }
  #sp b i.s { width: .35em; }
  #sp b i:nth-child(n+6) { background: linear-gradient(180deg, #d8c5ff, #8a63ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes spt { from { opacity: 0; transform: translateY(26px) scale(.6); } to { opacity: 1; transform: none; } }
  .sp-on .tile, .sp-on header, .sp-on .hero { animation-delay: calc(var(--i, 0) * 30ms + 1.9s); }
  @media (prefers-reduced-motion: reduce) { #sp { display: none; } .tile { transition: none; } }

  @keyframes pop { from { opacity: 0; transform: translateY(22px) scale(.72); } to { opacity: 1; transform: none; } }
  .tile { animation: pop .55s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(var(--i, 0) * 30ms); }
  @keyframes drop { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
  h1, header, .hero { animation: drop .6s ease-out both; }
  #lz { position: fixed; inset: 0; z-index: 99; pointer-events: none; background: var(--lc, #4b3a8a); clip-path: circle(0 at var(--lx, 50%) var(--ly, 50%)); transition: clip-path .5s cubic-bezier(.5,0,.2,1); display: grid; place-items: center; }
  #lz.go { clip-path: circle(150% at var(--lx, 50%) var(--ly, 50%)); }
  #lz .li { width: 120px; height: 120px; border-radius: 27px; overflow: hidden; display: grid; place-items: center; font-size: 64px; box-shadow: 0 12px 40px rgba(0,0,0,.5); transform: scale(.4); opacity: 0; transition: transform .45s cubic-bezier(.2,1.6,.4,1) .12s, opacity .25s .12s; }
  #lz.go .li { transform: scale(1); opacity: 1; }
  #lz .li img { width: 100%; height: 100%; object-fit: cover; }
  #lz .ln { position: absolute; top: calc(50% + 86px); font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.5); opacity: 0; transition: opacity .3s .2s; }
  #lz.go .ln { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .tile, h1, header, .hero { animation: none; } #lz { transition: none; } }
</style>
</head>
<body>
<div id="sp"><img src="icon-192.png" alt=""><b aria-label="Koke Apps"></b></div>
<script>(function(){var sp=document.getElementById('sp'),on=1;try{if(sessionStorage.getItem('sp1'))on=0;else sessionStorage.setItem('sp1','1')}catch(e){}
if(!on){sp.remove();return}
var b=sp.querySelector('b');'KOKE APPS'.split('').forEach(function(c,k){var i=document.createElement('i');i.textContent=c;if(c==' ')i.className='s';i.style.setProperty('--k',k);b.appendChild(i)});
document.documentElement.classList.add('sp-on');
setTimeout(function(){sp.classList.add('out')},1700);setTimeout(function(){sp.remove();document.documentElement.classList.remove('sp-on')},2250)})()</script>
<div id="sc">
<main>
  <header>
    <h1>MIS<br><span>APPS</span></h1>
    <div id="status" data-s="work"><i></i><span id="statusText">Comprobando…</span></div>
    <button id="snd" type="button" aria-label="Sonido de todos los juegos">🔊 Sonido: SÍ</button>
  </header>

  <p id="tip" hidden>Para tenerlas como app: toca <b>Compartir</b> en Safari y luego <b>Añadir a pantalla de inicio</b>. Ábrela una vez con internet y después funciona sin conexión.</p>

  <div id="bar">
    <div id="q"><i>🔎</i><input id="qi" type="search" placeholder="Busca: fnaf, minecraft, dibujar…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><button id="qx" aria-label="Borrar">✕</button></div>
    <div class="row" id="cats"></div>
    <div class="row s" id="subs"></div>
  </div>
  <section id="grid" aria-label="Lista de apps"></section>
</main>
</div>

<script>
(function () {
  var ICONS = {
    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>',
    calc: '<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7.5h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',
    cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    photo: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-5 4 4 3-3 6 5"/>',
    note: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    game: '<rect x="3" y="7.5" width="18" height="10" rx="5"/><path d="M8 10.5v4M6 12.5h4"/><circle cx="15.5" cy="12" r=".9"/><circle cx="18" cy="13.5" r=".9"/>',
    torch: '<path d="M9 3h6l-1 6h-4z"/><path d="M10 9v11h4V9"/><path d="M12 12v2"/>',
    dice: '<rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/>'
  };

  var grid = document.getElementById('grid');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');

  function setStatus(kind, text) {
    status.setAttribute('data-s', kind);
    statusText.textContent = text;
  }

  var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (!standalone) document.getElementById('tip').hidden = false;

  var TI = 0;
  function tile(a) {
    var el = document.createElement('a');
    el.style.setProperty('--i', Math.min(TI++, 22));
    el.className = 'tile';
    el.href = a.href;
    var color = a.color || '#4b3a8a';
    el.style.setProperty('--c', color);

    var ic = document.createElement('span');
    ic.className = 'ic';
    ic.style.background = 'linear-gradient(145deg, rgba(255,255,255,.22), rgba(0,0,0,.3)), ' + color;
    var key = a.icono || '';
    if (a.img) {
      ic.style.background = color; ic.style.overflow = 'hidden';
      var im = document.createElement('img'); im.src = a.img; im.alt = ''; im.decoding = 'async'; im.loading = 'lazy'; im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      ic.appendChild(im);
    } else if (ICONS[key]) {
      ic.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[key] + '</svg>';
    } else {
      var b = document.createElement('b');
      b.textContent = key || (a.nombre || '?').charAt(0).toUpperCase();
      ic.appendChild(b);
    }

    var h = document.createElement('h2');
    h.textContent = a.nombre;
    var p = document.createElement('p');
    p.textContent = a.desc || '';
    el.appendChild(ic);
    el.appendChild(h);
    el.appendChild(p);
    return el;
  }

  var CATS = [['all', '✨', 'Todo'], ['juegos', '🎮', 'Juegos'], ['herramientas', '🧰', 'Herramientas']];
  var SUBS = {
    juegos: [['terror', '👻', 'Terror'], ['roblox', '🧱', 'Estilo Roblox'], ['arcade', '🏃', 'Arcade'], ['puzzle', '🧩', 'Puzzle'], ['carreras', '🏎️', 'Carreras'], ['accion', '⚔️', 'Acción'], ['deportes', '🏀', 'Deportes'], ['fiesta', '🎉', 'Fiesta']],
    herramientas: [['dibujo', '🎨', 'Dibujo'], ['musica', '🎵', 'Música'], ['voz', '🎙️', 'Voz'], ['foto', '📸', 'Foto y memes'], ['relax', '🧘', 'Relax'], ['electronica', '🔌', 'Electrónica'], ['util', '🔐', 'Utilidades']]
  };
  var ALL = [], st = { q: '', cat: 'all', sub: 'all' };
  var cats = document.getElementById('cats'), subs = document.getElementById('subs'), qi = document.getElementById('qi'), qx = document.getElementById('qx');

  function norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  function lev(a, b, m) {
    if (Math.abs(a.length - b.length) > m) return m + 1;
    var p = [], c, i, j;
    for (j = 0; j <= b.length; j++) p[j] = j;
    for (i = 1; i <= a.length; i++) {
      c = [i];
      for (j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      p = c;
    }
    return p[b.length];
  }
  function prep(a) {
    var sl = ''; Object.keys(SUBS).forEach(function (k) { SUBS[k].forEach(function (x) { if (x[0] === a.sub) sl = x[2]; }); });
    a._n = norm(a.nombre).split(' '); a._ns = a._n.join('');
    a._t = norm((a.tags || '') + ' ' + sl + ' ' + (a.cat || '')).split(' ').filter(Boolean);
    a._d = norm(a.desc).split(' ');
    a._ac = a._n.map(function (w) { return w.charAt(0); }).join('');
  }
  function tokScore(q, a) {
    var best = 0, k, w, s, m = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0;
    function t(list, eq, st, ct, fz) {
      for (k = 0; k < list.length; k++) {
        w = list[k]; s = 0;
        if (w === q) s = eq; else if (w.indexOf(q) === 0) s = st; else if (q.length > 2 && w.indexOf(q) > 0) s = ct;
        else if (m && fz && w.length > 3 && lev(q, w, m) <= m) s = fz;
        else if (m && fz && w.length > q.length + 1 && lev(q, w.slice(0, q.length), m) <= m) s = fz - 8;
        if (s > best) best = s;
      }
    }
    t(a._n, 100, 80, 50, 45); t(a._t, 75, 62, 38, 34); t(a._d, 28, 22, 12, 0);
    if (a._ns.indexOf(q) >= 0 && q.length > 2) best = Math.max(best, 55);
    if (q.length > 2 && a._ac === q) best = Math.max(best, 60);
    return best;
  }
  function search(raw) {
    var qs = norm(raw).split(' ').filter(Boolean), out = [];
    if (!qs.length) return ALL.slice();
    ALL.forEach(function (a) {
      var tot = 0;
      for (var i = 0; i < qs.length; i++) { var s = tokScore(qs[i], a); if (!s) return; tot += s; }
      out.push([tot, a]);
    });
    out.sort(function (x, y) { return y[0] - x[0]; });
    return out.map(function (x) { return x[1]; });
  }

  function section(title, items, count) {
    var sec = document.createElement('section'); sec.className = 'sec';
    var h = document.createElement('h3'); h.textContent = title;
    var n = document.createElement('small'); n.textContent = items.length; h.appendChild(n);
    var g = document.createElement('div'); g.className = 'g';
    items.forEach(function (a) { g.appendChild(tile(a)); });
    sec.appendChild(h); sec.appendChild(g); grid.appendChild(sec);
  }
  function chip(parent, key, label, on, cb) {
    var b = document.createElement('button'); b.className = 'chip' + (on ? ' on' : ''); b.innerHTML = label; b.onclick = cb; parent.appendChild(b);
  }
  function draw() {
    TI = 0; grid.textContent = ''; cats.textContent = ''; subs.textContent = '';
    var searching = st.q.trim().length > 0;
    qx.style.display = qi.value ? 'block' : 'none';
    CATS.forEach(function (c) {
      var n = c[0] === 'all' ? ALL.length : ALL.filter(function (a) { return a.cat === c[0]; }).length;
      chip(cats, c[0], c[1] + ' ' + c[2] + '<small>' + n + '</small>', !searching && st.cat === c[0], function () { st.cat = c[0]; st.sub = 'all'; qi.value = ''; st.q = ''; saveF(); draw(); document.getElementById('sc').scrollTop = 0; });
    });
    if (searching) {
      subs.style.display = 'none';
      var r = search(st.q);
      if (!r.length) { var d = document.createElement('div'); d.className = 'none'; d.innerHTML = '🫥 Nada con «' + st.q.replace(/</g, '&lt;') + '»<br><small>Prueba otra palabra: nombre, juego parecido o tema</small>'; grid.appendChild(d); return; }
      section('🔎 Resultados', r); return;
    }
    var list = ALL.filter(function (a) { return st.cat === 'all' || a.cat === st.cat; });
    var sl = SUBS[st.cat];
    if (sl) {
      subs.style.display = 'flex';
      chip(subs, 'all', 'Todo', st.sub === 'all', function () { st.sub = 'all'; saveF(); draw(); });
      sl.forEach(function (x) {
        var n = list.filter(function (a) { return a.sub === x[0]; }).length; if (!n) return;
        chip(subs, x[0], x[1] + ' ' + x[2] + '<small>' + n + '</small>', st.sub === x[0], function () { st.sub = x[0]; saveF(); draw(); });
      });
      subs.className = 'row s';
    } else subs.style.display = 'none';
    if (st.cat === 'all') {
      CATS.slice(1).forEach(function (c) { var it = list.filter(function (a) { return a.cat === c[0]; }); if (it.length) section(c[1] + ' ' + c[2], it); });
    } else if (st.sub !== 'all') {
      var x = (sl || []).filter(function (y) { return y[0] === st.sub; })[0];
      section((x ? x[1] + ' ' + x[2] : ''), list.filter(function (a) { return a.sub === st.sub; }));
    } else {
      sl.forEach(function (x) { var it = list.filter(function (a) { return a.sub === x[0]; }); if (it.length) section(x[1] + ' ' + x[2], it); });
    }
  }
  function saveF() { try { localStorage.setItem('hub_f', JSON.stringify({ cat: st.cat, sub: st.sub })); } catch (e) {} }
  qi.addEventListener('input', function () { st.q = qi.value; draw(); document.getElementById('sc').scrollTop = 0; });
  qx.onclick = function () { qi.value = ''; st.q = ''; draw(); qi.focus(); };
  function render(list) {
    ALL = list.filter(function (a) { return a && a.nombre && a.href; }).map(function (a) { if (a.cat !== 'juegos' && a.cat !== 'herramientas') a.cat = 'herramientas'; return a; });
    ALL.forEach(prep); draw();
  }

  function loadList() {
    return fetch('apps.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('lista'); return r.json(); })
      .then(function (j) { return j.apps || []; })
      .catch(function () { return []; });
  }

  // descarga cada app para que funcione sin internet
  function saveAll(list) {
    var ok = 0;
    return list.reduce(function (p, a) {
      return p.then(function () {
        return fetch(a.href, { cache: 'reload' })
          .then(function (r) { if (r.ok) ok++; })
          .catch(function () {
            return caches.match(a.href).then(function (hit) { if (hit) ok++; });
          });
      });
    }, Promise.resolve()).then(function () { return ok; });
  }

  function plural(n) { return n + (n === 1 ? ' app guardada' : ' apps guardadas'); }

  loadList().then(function (list) {
    render(list);
    if (!list.length) { setStatus('off', 'No se pudo cargar la lista de apps'); return; }

    if (!('serviceWorker' in navigator) || !('caches' in window)) {
      setStatus('off', 'Este navegador no guarda para offline');
      return;
    }
    if (!navigator.onLine) {
      setStatus('off', 'Sin conexión · usando lo guardado');
      return;
    }
    setStatus('work', 'Guardando para usar sin internet…');
    navigator.serviceWorker.register('sw.js').then(function () {
      return navigator.serviceWorker.ready;
    }).then(function () {
      return saveAll(list);
    }).then(function (ok) {
      if (ok === list.length) setStatus('ok', 'Listo sin internet · ' + plural(ok));
      else setStatus('work', 'Faltan apps por guardar (' + ok + '/' + list.length + ')');
    }).catch(function () {
      setStatus('off', 'No se pudo activar el modo offline');
    });
  });

  window.addEventListener('offline', function () { setStatus('off', 'Sin conexión · usando lo guardado'); });
})();

  // animación al abrir una app: círculo de color que se expande desde el icono
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('a.tile');
    if (!t || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var ic = t.querySelector('.ic'), r = (ic || t).getBoundingClientRect(), name = (t.querySelector('h2') || {}).textContent || '';
    var z = document.getElementById('lz'); if (z) z.remove();
    z = document.createElement('div'); z.id = 'lz';
    z.style.setProperty('--lc', getComputedStyle(t).getPropertyValue('--c') || '#4b3a8a');
    z.style.setProperty('--lx', (r.left + r.width / 2) + 'px'); z.style.setProperty('--ly', (r.top + r.height / 2) + 'px');
    var li = document.createElement('div'); li.className = 'li'; li.style.background = 'rgba(0,0,0,.25)';
    var im = t.querySelector('img'), b = t.querySelector('b');
    if (im) { var i2 = document.createElement('img'); i2.src = im.src; li.appendChild(i2); } else if (b) li.textContent = b.textContent; else li.textContent = '✨';
    var ln = document.createElement('div'); ln.className = 'ln'; ln.textContent = name;
    z.appendChild(li); z.appendChild(ln); document.body.appendChild(z);
    try { navigator.vibrate && navigator.vibrate(8); } catch (x) {}
    requestAnimationFrame(function () { requestAnimationFrame(function () { z.classList.add('go'); }); });
    var href = t.getAttribute('href'); setTimeout(function () { location.href = href; }, 520);
  });
  window.addEventListener('pageshow', function () { var z = document.getElementById('lz'); if (z) z.remove(); });
</script>
