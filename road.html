 var tx=pl.g.position.x*.7,tz=cam.z;cam.x+=(tx-cam.x)*Math.min(1,dt*4);
 if(GK.state()!=='play'){cam.z-=dt*.5;tz=cam.z}
 var kx=asp>1?-1.2:-2.1,kz=asp>1?-1.6:-2.8,lx=cam.x+kx,lz=tz+kz;ocam.position.set(lx+8,13,lz+11);ocam.lookAt(lx,0,lz);
 sun.position.set(cam.x+9,18,tz+7);sun.target.position.set(cam.x,0,tz);
 if(pl&&GK.state()!=='play'){while(rows.length&&rows[rows.length-1].r<-cam.z+22)addRow();}};
G3.render=function(r,sc){r.render(sc,ocam)};
G3.draw=function(c,W,H){if(GK.state()!=='play')return;GK.text('MONEDAS '+totalCoins,W/2,70+(W>H?0:6),13,'#fff2a0');if(idleT>3.5&&!dead)GK.text('¡Avanza o te pilla el águila!',W/2,H*.2,16,'#fff')};
function extra(){var d=document.createElement('div');d.style.cssText='display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0';var coins=GK.store.get('coins',0),cur=GK.store.get('skin',0),own=GK.store.get('own',[0]);var info=document.createElement('div');info.style.cssText='width:100%;font-size:12px;opacity:.9';info.textContent='Monedas: '+coins;d.appendChild(info);SK.forEach(function(k,i){var b=document.createElement('button');b.className='btn g';var has=own.indexOf(i)>=0;b.textContent=k.n+(has?'':' · '+k.cost);b.style.cssText='padding:7px 11px;font-size:12px;'+(i===cur?'background:#ffd23a;color:#1a1530':'');b.onclick=function(){var cn=GK.store.get('coins',0),ow=GK.store.get('own',[0]);if(ow.indexOf(i)<0){if(cn<k.cost){GK.snd('err',.4);return}cn-=k.cost;ow.push(i);GK.store.set('own',ow);GK.store.set('coins',cn);info.textContent='Monedas: '+cn;b.textContent=k.n}GK.store.set('skin',i);GK.snd('ok',.4);d.querySelectorAll('button').forEach(function(x){x.style.background='';x.style.color=''});b.style.background='#ffd23a';b.style.color='#1a1530'};d.appendChild(b)});return d}
GK.start({three:true,exposure:1.05,pr:1.5,extra:extra,title:'KOKE ROAD',color:'#7bd13a',bg:'#9fd8ff',help:'Toca para saltar adelante. Desliza para ir a los lados o atrás. Cruza carreteras, ríos sobre troncos y vías de tren. ¡No te quedes quieto o te pilla el águila!',init:G3.init,reset:G3.reset,update:G3.update,frame:G3.frame,render:G3.render,draw:G3.draw,down:G3.down,up:G3.up,key:G3.key});
})();
